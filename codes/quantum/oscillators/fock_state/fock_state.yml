relations:
  parents:
    - code_id: qudits_into_oscillators
    - code_id: ampdamp
      detail: 'Fock-state codes are designed to protect against bosonic \hyperref[topic:ad]{AD} noise. Asymptotically good constant-excitation Fock-state codes approximately correct \hyperref[topic:ad]{AD} noise with a sufficiently small constant loss rate \(\gamma\), with recovery error vanishing as the total excitation grows \cite[Cor. 6]{arxiv:2603.15190}.'
  cousins:
    - code_id: bits_into_bits
      detail: 'Fock-state code distance is a natural extension of Hamming distance between binary strings.'
    - code_id: simplex_discrete
      detail: 'Constant-excitation Fock-state codes are obtained from simplex integer-based codes by partitioning the classical code into blocks and superposing the Fock states of each block \cite{arxiv:2509.20545}. The code distance is inherited from the classical \(\ell_1\) distance \cite{arxiv:2509.20545}. Random simplex integer-based codes partitioned into equal blocks with uniform superpositions yield asymptotically good approximate Fock-state codes \cite[Thm. 10]{arxiv:2603.15190}.'


