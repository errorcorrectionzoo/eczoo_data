    - code_id: ampdamp
      detail: 'Fock-state codes are designed to protect against bosonic \hyperref[topic:ad]{AD} noise.'
  cousins:
    - code_id: bits_into_bits
      detail: 'Fock-state code distance is a natural extension of Hamming distance between binary strings.'
    - code_id: simplex_discrete
      detail: 'Constant-excitation Fock-state codes can be obtained from simplex integer-based codes by partitioning the classical code into blocks and superposing the Fock states of each block \cite{arxiv:2509.20545}. Classical \(\ell_1\) distance \(t+1\) guarantees the Knill-Laflamme orthogonality conditions against up to \(t\) losses, and a Tverberg partition with suitable coefficients yields quantum distance \(t+1\) \cite{arxiv:2509.20545}\cite[Prop. 7]{arxiv:2603.15190}. With high probability, random simplex integer-based codes partitioned into equal blocks with uniform superpositions yield asymptotically good approximate Fock-state codes \cite[Thm. 10]{arxiv:2603.15190}.'


