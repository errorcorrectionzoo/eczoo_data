code_id: ea_oscillators
physical: oscillators
logical: oscillators

name: 'EA bosonic code'

description: |
  Bosonic code designed to utilize pre-shared entanglement between sender and receiver.

relations:
  parents:
    - code_id: eaqecc
  cousins:
    - code_id: oscillators
      detail: 'EA bosonic codes utilize additional ancillary modes in a pre-shared entangled state, but reduce to ordinary bosonic codes when said modes are interpreted as noiseless physical modes.'
    - code_id: gkp-stabilizer
      detail: 'Applying the Gaussian encoder of the \([[n,1,n;n-1]]\) EA repetition code to a GKP-encoded data mode and \(n-1\) halves of pre-shared GKP Bell pairs yields an EA O2O GKP code \cite{arxiv:2606.09379}. Here, \(n\geq 3\) is odd. It reduces the variances of both quadrature displacements of the data mode by a factor of \(1/n\) \cite[Thm. 1]{arxiv:2606.09379}.'


