code_id: multivariate_multicycle
physical: galois
logical: galois

name: 'Multivariate multicycle (MM) code'
short_name: 'MM'
introduced: '\cite{arxiv:2506.16910,arxiv:2601.18879}'

alternative_names:
  - 'Abelian multi-cycle (AMC) code'

description: |
  \hyperref[code:multi_block_quantum]{Multi-block CSS code} whose \(t\) commuting matrices represent elements \(F_1,\ldots,F_t\) of the \hyperref[topic:group-algebra]{group algebra} of a finite Abelian group, written as polynomials in \(D\) variables.
  Each element defines a two-term complex \(S\xrightarrow{F_i}S\) over the group algebra \(S\), and the tensor product of the \(t\) complexes is a Koszul complex with \(t+1\) terms whose boundary maps are the check and metacheck matrices \cite{arxiv:2506.16910,arxiv:2601.18879}.
  For \(t \geq 4\), the code has metachecks in both bases and admits complete \hyperref[code:single_shot]{single-shot} decoding, while \(t=2\) and \(t=3\) recover \hyperref[code:abelian_2bga]{Abelian 2BGA} and \hyperref[code:tricycle]{tricycle} codes \cite{arxiv:2601.18879}.

  Writing \(G \cong \mathbb{Z}_{\ell_1}\times\cdots\times\mathbb{Z}_{\ell_D}\), the group algebra is the quotient polynomial ring \(S=\mathbb{F}_q[x_1,\ldots,x_D]/\langle x_1^{\ell_1}-1,\ldots,x_D^{\ell_D}-1\rangle\), so that a code is specified by \(t\) polynomials \(F_1,\ldots,F_t \in S\), each represented by a sum of Kronecker products of circulant matrices \cite{arxiv:2506.16910,arxiv:2601.18879}.
  The number of polynomials \(t\) (the number of ``cycles'') and the number of variables \(D\) can be chosen independently.
  The number of variables is a matter of presentation.
  By the Chinese remainder theorem, coprime cyclic factors can be split or merged, so \(\mathbb{Z}_{15}\) and \(\mathbb{Z}_{5}\times\mathbb{Z}_{3}\) present the same code with \(D=1\) and \(D=2\), respectively.

  The level-\(q\) space of the Koszul complex \(K_{\bullet}(F_1,\ldots,F_t;S)\) is \(S^{\binom{t}{q}}\), and its boundary maps \(\partial_q\) are available in closed form \cite{arxiv:2601.18879}.
  In the Koszul-complex formulation \cite{arxiv:2601.18879}, qubits are placed at the middle level \(q=\lfloor t/2\rfloor\), yielding \(P_X=\partial_q^T\) and \(P_Z=\partial_{q+1}\).
  The \(X\)-type metacheck matrix is \(M_X = \partial_{q-1}^T\) whenever \(t\geq 4\), and the \(Z\)-type metacheck matrix is \(M_Z=\partial_{q+2}\) whenever \(t\geq 3\).
  The multi-block-complex formulation \cite{arxiv:2506.16910} allows qudits to be placed at any level \(0<j<t\) of the same complex.
  It also admits a general Abelian group presentation whose relators define a periodicity lattice on \(\mathbb{Z}^D\), i.e., a torus \cite{arxiv:2506.16910}.

  A CSS code together with metacheck matrices \(M_X\) and \(M_Z\) satisfying \(M_X P_X = 0\) and \(M_Z P_Z = 0\) forms a five-term chain complex and is dubbed a \textit{metacheck CSS (mCSS) code} \cite{arxiv:2601.18879}.
  An mCSS code is \textit{balanced} when its outermost pair and its next-to-outermost pair of spaces each have equal dimensions \cite{arxiv:2601.18879}.
  Any five-term segment of a longer chain complex yields an mCSS code, and the middle five terms of the Koszul complex of an MM code with even \(t\) yield a balanced one.

  Fixing \(t\) and \(D\) recovers several known code families, each with explicit MM polynomials \cite{arxiv:2601.18879}.
  Abelian 2BGA codes (\(t=2\)) include \hyperref[code:generalized_bicycle]{GB codes} (\(D=1\)), \hyperref[code:qcga]{bivariate bicycle codes} (\(D=2\)), and higher-variable Abelian 2BGA codes.
  They also include \hyperref[code:cyclic_hgp]{cyclic hypergraph-product codes} (\(D=2\) with polynomials in disjoint variables) and \hyperref[code:lacross]{La-cross codes} with periodic boundary conditions (\(D=2\), with \(G=\mathbb{Z}_n\times\mathbb{Z}_n\)).
  \hyperref[code:haah_cubic]{Haah cubic codes} on a cubic lattice have \(t=2\) and \(D=3\).
  Weight-two elements \(a_i=1+x_i\) with \(t=D\) yield \(D\)-dimensional \hyperref[code:higher_dimensional_toric]{toric codes} on regular or twisted tori, with arbitrary twists realized via general group presentations \cite{arxiv:2506.16910}.

  A \([[144,12,12]]\) MM code has the same parameters as, but is distinct from, the \hyperref[code:gross]{gross code} \cite{arxiv:2308.07915,arxiv:2601.18879}.
  A family of MM codes locally equivalent to 4D toric codes, with weight-six stabilizer generators and \(k=6\), is constructed in Ref. \cite{arxiv:2506.16910}.
  Codes with \(t=5\) through \(t=9\) provide the first explicit instances of collapsed 5D through 9D higher-dimensional codes \cite{arxiv:2601.18879}.
  See Ref. \cite{arxiv:2601.18879} for tables of MM codes with \(t \geq 4\), including a \([[648,60,(9,9)]]\) code whose check and metacheck matrices are written out explicitly.

protection: |
  Analytic expressions for the code dimension in two general cases, as well as lower (existence) and upper bounds on the distance, are derived in Ref. \cite{arxiv:2506.16910}.

features:
  decoders:
    - 'BP-OSD and Tesseract decoders \cite{arxiv:2601.18879}.'
    - 'Few-shot sliding-window decoding \cite{arxiv:2506.16910}.'
    - 'Single-shot decoding using metachecks for \(t \geq 4\), with confinement profiles surpassing those of known single-shot-decodable CSS codes of practical block size \cite{arxiv:2601.18879}.'

  threshold:
    - 'Circuit-level noise: \hyperref[topic:pseudo-threshold]{pseudo-threshold} close to \(1.1\%\) for MM codes locally equivalent to 4D toric codes, better than for toric or surface codes under a similar noise model \cite{arxiv:2506.16910}.'

notes:
  - 'See QuantumClifford.jl Julia software library for MM code instances, stabilizer states, and Clifford circuits \cite{preset:QuantumClifford,arxiv:2601.18879}.'

relations:
  parents:
    - code_id: multi_block_quantum
      detail: 'MM codes are multi-block CSS codes whose commuting matrices represent Abelian group-algebra elements \cite{arxiv:2506.16910,arxiv:2601.18879}.'
    - code_id: quantum_quasi_cyclic
      detail: 'After ordering coordinates by translation orbits, translation by any cyclic factor of the Abelian group simultaneously shifts every group-algebra block, making every MM code quasi-cyclic \cite{arxiv:2506.16910,arxiv:2601.18879}.'
  cousins:
    - code_id: lacross
      detail: |-
        La-cross codes with periodic boundary conditions are \(t=2\) MM codes over \(\mathbb{Z}_n\times\mathbb{Z}_n\) \cite{arxiv:2404.13010,arxiv:2601.18879}.
        Their open-boundary versions fall outside the periodic group-algebra construction \cite{arxiv:2404.13010,arxiv:2601.18879}.
    - code_id: multisector_hypergraph
      detail: 'MM codes can be viewed as collapsed versions of \(t\)-fold products of two-term complexes \cite{arxiv:2506.16910,arxiv:2601.18879}.'
    - code_id: double_homological_product
      detail: |-
        Both Campbell double homological product codes and MM codes with \(t \geq 4\) admit metachecks in both bases \cite{arxiv:2506.16910}.
        The MM construction yields shorter codes \cite{arxiv:2506.16910}.
    - code_id: single_shot
      detail: 'Complete single-shot decoding of MM codes with \(t \geq 4\) is demonstrated in Ref. \cite{arxiv:2601.18879}, and single-shot properties of these codes are also studied in Ref. \cite{arxiv:2506.16910}.'
    - code_id: quantum_tanner
      detail: 'Collapsed 5D through 9D MM codes have lower check weights than small instances of quantum Tanner codes \cite{arxiv:2601.18879} (cf. \cite{arxiv:2508.05095,arxiv:2512.20532}).'


