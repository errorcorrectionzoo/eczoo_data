code_id: abelian_2bga
physical: galois
logical: galois

name: 'Abelian two-block group-algebra code'
short_name: 'Abelian 2BGA'
introduced: '\cite{arxiv:1212.6703,manual:{G. V. Kalachev and P. A. Panteleev, “On the minimum distance in one class of quantum LDPC codes”, Intelligent systems. Theory and applications 24(4), 87-117 (2020)},arxiv:2306.16400}'

alternative_names:
  - 'Multivariate bicycle (MB) code'
  # MB naming for the qubit case from arxiv:2406.19151

description: |
  A \hyperref[code:2bga]{2BGA code} LP\((a,b)\) whose group \(G\) is Abelian, equivalently a multi-dimensional index-two quasi-cyclic code.
  Since any finite Abelian group is a direct product of cyclic groups, the \hyperref[topic:group-algebra]{group algebra} elements \(a\) and \(b\) can be treated as multivariate polynomials.
  The family includes \hyperref[code:generalized_bicycle]{GB} (one variable), \hyperref[code:qcga]{bivariate bicycle} (two variables), and higher-variable codes, providing some of the best known short codes with small stabilizer weights.

  Writing \(G=\mathbb{Z}_{\ell_1}\times \mathbb{Z}_{\ell_2}\times \cdots \times \mathbb{Z}_{\ell_D}\), the elements \(a\) and \(b\) become \(D\)-variate polynomials in \(\mathbb{F}_q[x_1,\ldots,x_D]/\langle x_1^{\ell_1}-1,\ldots,x_D^{\ell_D}-1 \rangle\), yielding stabilizer generator matrices
  \begin{align}
    H_X=(A|B)~,\quad H_Z=(B^T|-A^T)~,
  \end{align}
  where \(A\) and \(B\) are sums of Kronecker products of circulant matrices representing \(a\) and \(b\).
  An equivalent construction in terms of Kronecker products of circulant matrices was introduced in Ref. \cite{arxiv:1212.6703}.
  Related higher-dimensional quasi-cyclic and convolutional quantum codes are constructed in Ref. \cite{arxiv:2305.00137}.

  The decomposition of \(G\) into cyclic factors, and hence the number of variables \(D\), is not unique.
  By the Chinese remainder theorem, a cyclic group \(\mathbb{Z}_{\ell}\) with \(\ell = \prod_i p_i^{k_i}\) splits into a product of coprime cyclic groups.
  The same code can thus be presented with fewer or more variables.
  For example, \(\mathbb{Z}_{15}\) yields a \hyperref[code:generalized_bicycle]{GB code} in one variable, whereas the isomorphic \(\mathbb{Z}_{5}\times\mathbb{Z}_{3}\) yields a \hyperref[code:qcga]{bivariate bicycle code} in two variables.

  In the qubit case, Ref. \cite{arxiv:2406.19151} studied Abelian 2BGA codes built from polynomials in \(r\) variables, focusing on the trivariate (\(r=3\)) case.
  In that case, the polynomials feature a third, dependent variable \(z=xy\) supplementing the two variables of a \hyperref[code:qcga]{bivariate bicycle} code \cite{arxiv:2406.19151}.
  Examples include weight-five codes, such as a \([[30,4,5]]\) code, that admit bi-planar toric layouts with a single long-range connection per check and depth-seven syndrome-extraction circuits \cite{arxiv:2406.19151}.
  Such codes with check weight at most six admit bi-planar (thickness-two) Tanner graphs \cite{arxiv:2406.19151}.
  There is a criterion for determining whether a code admits a toric layout \cite{arxiv:2406.19151}.
  Weight-four codes can instead admit tangled toric layouts \cite{arxiv:2406.19151}.

protection: |
  The code dimension \(k\) of an Abelian 2BGA code is always even \cite{manual:{G. V. Kalachev and P. A. Panteleev, “On the minimum distance in one class of quantum LDPC codes”, Intelligent systems. Theory and applications 24(4), 87-117 (2020)}}.
  Bounds on code parameters and an enumeration of codes with small row weights, including codes with \(kd \geq n\), are given in Ref. \cite{arxiv:2306.16400}.

features:
  general_gates:
    - 'Several qubit Abelian 2BGA codes admit fault-tolerant logical circuits implemented via transversal operations combined with qubit permutations, obtained from code automorphism groups \cite{arxiv:2406.19151}.'
    - |
      Certain qubit Abelian 2BGA codes admit a constant-depth inter-code logical \(CZ\) gate between two copies of the code via the 2-copy-cup gate \cite{arxiv:2602.23307}.
      The gate exists when the check polynomials satisfy a pre-orientation condition equivalent to a graph perfect-matching problem \cite{arxiv:2602.23307}.
      Examples include the \hyperref[code:copycup_16_6_4]{\([[16,6,4]]\) copy-cup code} and check-weight-six codes such as \([[72,8,6]]\), \([[108,12,6]]\), and \([[144,16,6]]\) \cite{arxiv:2602.23307}.

  code_capacity_threshold:
    - 'Qubit Abelian 2BGA families with fixed check weight and polynomially growing distance have vanishing rate \cite{arxiv:2607.21160}. When such a family has a unique threshold, its optimal code capacity threshold under bit-flip noise is constrained by the Kramers-Wannier self-duality of zero-rate \hyperref[code:perm_self_dual_css]{PSD codes} \cite{arxiv:2607.21160}.'

relations:
  parents:
    - code_id: 2bga
      detail: 'Abelian 2BGA codes are 2BGA codes whose group is Abelian.'
    - code_id: abelian_lifted_product
      detail: 'Abelian 2BGA codes are the one-by-one (scalar) Abelian LP codes.'
    - code_id: multivariate_multicycle
      detail: 'Abelian 2BGA codes are MM codes with \(t=2\).'
  cousins:
    - code_id: galois_hypergraph_product
      detail: |-
        An Abelian 2BGA code whose elements \(a\) and \(b\) are supported on subgroups intersecting trivially is a square-matrix hypergraph-product code constructed from a pair of classical group-algebra codes \cite[Statements 8 and 12]{arxiv:2306.16400}.
        Elements given by polynomials in disjoint sets of variables satisfy this condition.
        See the \hyperref[code:cyclic_hgp]{cyclic HGP code} entry for the case of two cyclic codes.
    - code_id: translationally_invariant_stabilizer
      detail: 'Qubit Abelian 2BGA codes admitting a toric layout have translationally invariant checks on an \(r\)-dimensional torus \cite{arxiv:2406.19151}.'
    - code_id: perm_self_dual_css
      detail: 'Qubit Abelian 2BGA codes are permutationally self-dual \cite[Thm. 6]{arxiv:2306.16400}. Exchanging the two blocks of qubits while inverting each group element is an involutive \(XZ\)-duality \cite[Sec. 3]{arxiv:2407.03973}.'


