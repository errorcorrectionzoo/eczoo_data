code_id: 2bga
physical: galois
logical: galois

name: 'Two-block group-algebra (2BGA) codes'
short_name: '2BGA'
introduced: '\cite{manual:{M. B. Hastings, LR codes, private communication, 2014},arxiv:2305.06890,arxiv:2306.16400}'
# Hastings ref from 1812.02101

alternative_names:
  - 'Non-Abelian GB code'
  - 'LR code'
  # Hastings ref from 1812.02101

description: |
  2BGA codes are the one-by-one, or smallest, \hyperref[code:lifted_product]{LP codes}:
  \(LP(a,b)\) is defined by a pair of \hyperref[topic:group-algebra]{group algebra} elements
  \(a,b\in \mathbb{F}_q[G]\), where \(G\) is a finite group.
  The codes have length \(n=2|G|\).

  A cyclic group \(G\) yields a \hyperref[code:generalized_bicycle]{GB code}, while an Abelian group yields an \hyperref[code:abelian_2bga]{Abelian 2BGA code}.
  In the special case where the support subgroups generated by \(a\) and \(b\) are disjoint, the code reduces to a square-matrix \hyperref[code:galois_hypergraph_product]{Galois-qudit hypergraph-product code} built from a pair of classical group-algebra codes \cite{arxiv:2306.16400}.

  A \(Z\)-type logical subspace of \(LP(a,b)\) can be represented by pairs
  \((u,v)\in \mathbb{F}_q[G]\times \mathbb{F}_q[G]\) satisfying
  \begin{align}
    au+vb=0,
  \end{align}
  with any two pairs \((u,v)\) and \((u',v')\) such that \(u'=u+w b\)
  and \(v'=v-aw\) considered equivalent.
  The order in the products is relevant when the group is non-Abelian.

  For example, consider the
  alternating group \(G=A_4=T\), also known as the rotation group of a
  regular tetrahedron,
  \begin{align}
    T=\langle x,y|x^3=(yx)^3=y^2=1\rangle,\quad |T|=12,
  \end{align} and the
  binary algebra \(\mathbb{F}_2[T]\). Select \(a=1+x+y+x^{-1}yx\)
  and \(b=1+x+y+yx\) to get an \emph{essentially non-Abelian} 2BGA code
  LP\([a,b]\) with parameters \([[24,5,3]]\) \cite{arxiv:2306.16400}.


# If the total row weight \(W \equiv \wgt(a)+\wgt(b)\) is at most four and the code is non-trivial, then necessarily \(\wgt(a)=\wgt(b)=2\), and each connected component is equivalent to a rotated \hyperref[code:galois_topological]{Galois-qudit surface code} \cite{arxiv:2306.16400}.

protection: |
  Some upper and lower bounds on parameters and many examples of 2BGA codes are given in Ref. \cite{arxiv:2306.16400}.
  When the support groups generated by \(a\) and \(b\) intersect trivially, the code is equivalent to a square-matrix Galois-qudit hypergraph-product code and its distance reduces to \(d=\min(d_A^{\perp},d_B^{\perp})\); classical finite-rate group-algebra codes therefore yield finite-rate 2BGA families with \(d=\mathcal{O}(n^{1/2})\) \cite{arxiv:2306.16400}.

features:
  transversal_gates:
    - 'Logical Pauli operators and fold-transversal gates have been studied \cite{arxiv:2407.03973,arxiv:2409.18175}.'

  general_gates:
    - 'Certain qubit 2BGA codes can admit a cup product structure and can thus have logical gates in the \term{Clifford hierarchy} implemented by constant-depth Clifford circuits \cite{arxiv:2410.16250}.'

  rate: |-
    The 2BGA construction gives some of the best short codes with small stabilizer weights.

    Exhaustive enumeration in \cite{arxiv:2306.16400} covered inequivalent connected 2BGA codes with row weight
    \(W\le 8\), up to length \(n\le 100\) for Abelian groups and \(n\le 200\) for non-Abelian groups.
    Among the resulting codes with \(kd\ge n\) are GB codes with parameters
    \([[70,8,10]]\) and \([[72,10,9]]\), Abelian 2BGA codes over groups such as
    \(\mathbb{Z}_m\times \mathbb{Z}_2\) (index-four quasi-cyclic codes) with parameters
    \([[48,8,6]]\) and \([[56,8,7]]\), and non-Abelian codes with parameters
    \([[64,8,8]]\), \([[82,10,9]]\), \([[96,10,12]]\), and \([[96,12,10]]\).
    All of these examples have stabilizer generators of weight \(W=8\).


notes:
  - 'The idea of generating stabilizers according to a Cayley graph of a group was independently proposed by Hastings \cite{manual:{M. B. Hastings, LR codes, private communication, 2014}}; see Ref. \cite{arxiv:1812.02101}, which contains an error in Prop. 3.2 \cite{manual:{H.-K. Lin and L. P. Pryadko, private communication, 2024}}.'
  - 'A database of 2BGA codes is available in QECDB \cite{preset:QECDB}.'


relations:
  parents:
    - code_id: lifted_product
      detail: |-
        2BGA codes are LP\((a,b)\) codes, constructed from a pair of one-by-one matrices \(a,b\in \mathbb{F}_q[G]\) in a \hyperref[topic:group-algebra]{group algebra}.
    - code_id: coset_code
      detail: |-
        2BGA codes are the coset-based codes \(Q_G^H(a,b)\) for which \(H\) is a normal subgroup of \(G\), in which case the coset actions reduce to the left and right regular actions of the quotient group \(G/H\) \cite{arxiv:2606.17268}.
  cousins:
    - code_id: balanced_product
      detail: |-
        2BGA codes can be formulated directly as balanced product codes \cite[Rem. C.1]{arxiv:2407.03973}.
    - code_id: general_qldpc
      detail: |
        Given \hyperref[topic:group-algebra]{group algebra} elements \(a,b\in \mathbb{F}_q[G]\) with weights \(W_a\) and \(W_b\) (i.e., number of nonzero terms in the expansion), the 2BGA code LP\((a,b)\) has stabilizer
        generators of uniform weight \(W_a+W_b\).
    - code_id: group
      detail: |
        A 2BGA code \(LP(a,b)\) is constructible as a hypergraph-product code when the support subgroups generated by \(a\) and \(b\) are disjoint. In that case, the commuting matrices simultaneously acquire hypergraph-product Kronecker-product form, and the code can be obtained from a pair of classical group-algebra codes \cite[Statements 8 and 12]{arxiv:2306.16400}.
    - code_id: galois_hypergraph_product
      detail: |
        A 2BGA code \(LP(a,b)\) is constructible as a hypergraph-product code when the support subgroups generated by \(a\) and \(b\) are disjoint. In that case, the commuting matrices simultaneously acquire hypergraph-product Kronecker-product form, and the code can be obtained from a pair of classical group-algebra codes \cite[Statements 8 and 12]{arxiv:2306.16400}.
    - code_id: galois_topological
      detail: |
        Any non-trivial 2BGA code with total row weight \(W\leq 4\) is equivalent to a direct sum of rotated Galois-qudit surface codes \cite[Sec. IV.F]{arxiv:2306.16400}.




