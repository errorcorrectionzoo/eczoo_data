code_id: galois_grs
physical: galois
logical: galois

name: 'Galois-qudit GRS code'
short_name: 'Galois GRS'
introduced: '\cite{arxiv:quant-ph/9906129,arxiv:1311.3009}'

description: |
  A true \(q\)-Galois-qudit stabilizer code constructed from GRS codes, or their extended versions, via either the Hermitian construction \cite{arxiv:1311.3009,doi:10.1142/S0219749919500060,doi:10.1109/TIT.2010.2054174} or the Galois-qudit CSS construction \cite{arxiv:quant-ph/9906129,arxiv:0812.4514}.

features:
  rate: 'Concatenations of quantum GRS codes and random stabilizer codes can achieve the \hyperref[topic:quantum-gv-bound]{quantum GV bound} \cite{arxiv:1004.1127}.'


relations:
  parents:
    - code_id: quantum_ag
      detail: 'Galois-qudit GRS codes can be constructed via the CSS construction or the Hermitian construction from GRS codes, which are evaluation AG codes.'
  cousins:
    - code_id: generalized_reed_solomon
      detail: 'Galois-qudit GRS codes are quantum analogues of generalized RS codes.'
    - code_id: quantum_mds
      detail: 'Some Galois-qudit GRS codes are quantum MDS \cite{arxiv:1311.3009}.
        Hermitian self-orthogonal GRS codes yield \([[n,n-2d+2,d]]_q\) quantum MDS codes of length \(n=\lambda\tau\sigma\) for all \(d\) up to a bound linear in \(\lambda\) and \(\tau\) \cite[Thm. 6.1]{arxiv:2501.17010}.
        Here, \(\lambda>1\) divides \(q-1\), \(\tau>1\) divides \(q+1\) and is coprime to \(\lambda\), and \(2\leq\sigma\leq\rho/\kappa\), where \(\rho\) divides \(q+1\) and \(\kappa=\gcd(\lambda,\rho)\gcd(\tau,\rho)\) \cite[Thm. 6.1]{arxiv:2501.17010}.
        For example, the construction yields a \([[45,33,7]]_{11}\) code \cite[Cor. 7.1]{arxiv:2501.17010}.'
    - code_id: stabilizer_over_gfqsq
      detail: 'Galois-qudit GRS codes can be constructed via the CSS construction or the Hermitian construction.'
    - code_id: quantum_concatenated
      detail: 'Concatenations of Galois-qudit GRS codes and random stabilizer codes can achieve the \hyperref[topic:quantum-gv-bound]{quantum GV bound} \cite{arxiv:1004.1127}.'
    - code_id: random_stabilizer
      detail: 'Concatenations of Galois-qudit GRS codes and random stabilizer codes can achieve the \hyperref[topic:quantum-gv-bound]{quantum GV bound} \cite{arxiv:1004.1127}.'


