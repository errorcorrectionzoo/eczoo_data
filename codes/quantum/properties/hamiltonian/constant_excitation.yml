code_id: constant_excitation
# includes Galois, modular, oscillators, and groups

name: 'Constant-excitation (CE) code'
short_name: CE
introduced: '\cite{arxiv:quant-ph/9603022,arxiv:quant-ph/9705044,arxiv:quant-ph/9809081}'

description: |
  Code whose codewords lie in an eigenspace of fixed total energy or fixed total excitation number for the underlying quantum system.
  For qubit codes, such a Hamiltonian is often the \textit{total spin Hamiltonian}, \(H=\sum_i Z_i\).
  For spin-\(S\) codes, this generalizes to \(H=\sum_i J_z^{(i)}\), where \(J_z\) is the spin-\(S\) \(Z\)-operator.
  For bosonic (and, similarly, for fermion) codes, such as Fock-state codes, codewords are often in an eigenspace with eigenvalue \(N>0\) of the \textit{total excitation} or \textit{energy Hamiltonian}, \(H=\sum_i \hat{n}_i\).

protection: |
  CE codewords have to lie in the same excitation subspace in order to protect against changes in the total excitation number.

  Fock-state CE codes lie in the constant-excitation Fock space and are in one-to-one correspondence with points on the \hyperref[topic:discrete-simplex]{discrete simplex}.
  They are protected from identical \hyperref[topic:ad]{AD} acting on all modes because the damping acts on all codewords identically \cite{arxiv:quant-ph/9704002,doi:10.1103/PhysRevA.56.1114}.
  The all-zero \hyperref[topic:ad]{AD} Kraus operator acts identically on every state and so can be exactly correctable in the case of Fock-state CE codes.
  For example, this operator's acting on a Fock state \(|\boldsymbol{m}\rangle\) depends only on the total occupation number \(|\boldsymbol{m}|=\sum_j m_j\) and not on the individual occupation numbers \(m_j\),
  \begin{align}
    E_{0}^{\otimes n}|\boldsymbol{m}\rangle=\left(1-\gamma\right)^{|\boldsymbol{m}|/2}|\boldsymbol{m}\rangle~.
  \end{align}
  This effect extends to the damping portion, \(\left(1-\gamma\right)^{\hat{n}/2}\), of any \(\ell\neq 0\) \hyperref[topic:ad]{AD} Kraus operators.
  Under \hyperref[topic:ad]{AD}, the probability that a Fock-state CE codeword with total excitation \(N\) loses at most \(t\) particles is the binomial tail \(\mathrm{Pr}[\mathrm{Bin}(N,\gamma)\leq t]\), independent of the code \cite[Prop. 3]{arxiv:2603.15190}.
  A Fock-state CE code therefore has to correct a number of losses linear in \(N\) to protect against \hyperref[topic:ad]{AD} with a constant loss rate \(\gamma\) as \(N\to\infty\) \cite[Sec. 3.1]{arxiv:2603.15190}.

  In similar fashion, qubit CE codes are protected from coherent noise in the form of transversal \(Z\)-rotations because such rotations act identically on all codewords \cite{doi:10.1109/ISIT45174.2021.9518206,arxiv:2011.00197}.
  In the case of CSS codes, all codes oblivious to such rotations are CE codes \cite{doi:10.1109/ISIT45174.2021.9518206,arxiv:2011.00197}.
  Stabilizer codes can be extended to codes that are protected against such coherent noise via an enlargement procedure \cite{arxiv:2011.00197}.

features:
  rate: 'Fock-state CE codes can be used in a protocol that achieves the two-way quantum capacity of the \hyperref[topic:ad]{AD} Gaussian channel \cite{arxiv:2203.13924}. For every \(K,t \geq 2\), there are explicitly constructible \(K\)-dimensional Fock-state CE codes with \(q=N=(K-1)t(t+1)\) modes, total excitation \(N\), and distance \(t+1\); there also exist families with logical dimension \(K = o(2^N)\) and distance of \hyperref[topic:asymptotics]{order} \(o(N/\log N)\) \cite{arxiv:2509.20545}. Asymptotically good Fock-state CE codes, with distance linear in \(N\) and positive rate relative to the constant-excitation space, exist on \(\alpha N\) modes with per-mode occupancy of \hyperref[topic:asymptotics]{order} \(O(\log N)\) \cite[Thm. 12]{arxiv:2603.15190}.'

  decoders:
    - |
      Modified Shor syndrome extraction measures a weight-\(2w\) or \((2w-1)\) stabilizer of a CE CSS code with the \(w\)-CE cat state \(\frac{1}{\sqrt{2}}(|01\rangle^{\otimes w}+|10\rangle^{\otimes w})\) \cite[Thm. 9]{arxiv:2507.10395}.
      The \(j\)th ancilla qubit controls a Pauli on the \(j\)th data qubit of the support, with zero-controlled gates at even \(j\) \cite[Alg. 1]{arxiv:2507.10395}.
    - 'Modified Steane syndrome extraction for dual-rail-concatenated CE CSS codes, in which each transversal CNOT gate is followed by the Pauli correction \(\prod_j X_{2j}\) \cite[Thm. 12]{arxiv:2507.10395}.'

  fault_tolerance:
    - |
      Weakly fault-tolerant error correction (in the sense of Ref. \cite{arxiv:2208.05601}) for distance-three CE CSS codes under circuit-level noise interleaved with layers of collective coherent \(Z\) rotations \cite[Thm. 11]{arxiv:2507.10395}.
      It combines modified Shor extraction with a conditional control flow that uses at most two syndrome-measurement rounds per stabilizer type \cite{arxiv:2507.10395}.

relations:
  parents:
    - code_id: hamiltonian
      detail: 'Constant-excitation codes are associated with a Hamiltonian governing the total excitations of the system.'
  cousins:
    - code_id: ampdamp
      detail: 'Fock-state and qubit CE codes exactly protect against the \hyperref[topic:ad]{AD} Kraus operator \(E_{0}^{\otimes n}\) because it acts identically on all Fock (and qubit) states with the same excitation number \cite{arxiv:quant-ph/9704002,doi:10.1103/PhysRevA.56.1114}.'
    - code_id: qubit_css
      detail: |
        Qubit CE codes are protected from coherent noise in the form of transversal \(Z\)-rotations because such rotations act identically on all codewords \cite{doi:10.1109/ISIT45174.2021.9518206,arxiv:2011.00197}.
        In the case of qubit CSS codes, all codes oblivious to such rotations are CE codes \cite{doi:10.1109/ISIT45174.2021.9518206,arxiv:2011.00197}.
        Any \([[n,k,d]]\) CSS code can be made into an \([[mn,k,>d]]\) CE code \cite{doi:10.1109/ISIT45174.2021.9518206}.
        Concatenating the dual-rail code with an inner \([[n,k,d]]\) qubit stabilizer code yields a degenerate \([[2n,k,d]]\) constant-excitation stabilizer code that avoids coherent phase errors and is equivalent to a Pauli-rotated repetition-concatenated stabilizer code \cite{arxiv:2010.00538}. CSS structure is preserved when the original code is CSS \cite{arxiv:2507.10395}.
    - code_id: stab_5_1_3
      detail: 'The five-qubit code can be concatenated with a particular decoherence-free subspace (DFS) \cite{arxiv:quant-ph/9807004,arxiv:quant-ph/9902041,arxiv:quant-ph/9908064,arxiv:quant-ph/0007013} to yield a 20-qubit CE code \cite{arxiv:quant-ph/9809081,arxiv:quant-ph/9907096}. Dual-rail concatenation of the five-qubit code yields a \([[10,1,3]]\) CE stabilizer code \cite{arxiv:2507.10395}.'
    - code_id: qubit_stabilizer
      detail: 'Concatenating the dual-rail code with an inner \([[n,k,d]]\) qubit stabilizer code yields a degenerate \([[2n,k,d]]\) constant-excitation stabilizer code that avoids coherent phase errors and is equivalent to a Pauli-rotated repetition-concatenated stabilizer code \cite{arxiv:2010.00538}. CSS structure is preserved when the original code is CSS \cite{arxiv:2507.10395}.'


