code_id: qltc

name: 'Quantum locally testable code (QLTC)'
short_name: 'QLTC'
introduced: '\cite{arxiv:1301.3407,arxiv:1310.5664}'

description: |
  A local commuting-projector Hamiltonian-based block quantum code which has a nonzero average-energy penalty for creating large errors. Informally, states that are far away from the codespace of a QLTC have to be excited states of a number of the code's local projectors that scales linearly with \(n\).

  The average-energy penalty is quantified by the code's \textit{soundness} \(R\). Typically, one looks at how \(R\) scales with increasing code size for infinite families of codes, defining QLTC families as those for which the soundness is asymptotically constant. QLTC families that also have asymptotically constant distance, rate, and weight of local projectors are called \(c^3\)\textit{-QLTCs}.
  \(c^3\)-QLTCs were constructed concurrently in Refs. \cite{arxiv:2609.28028,arxiv:2609.20780}, the former being \hyperref[code:rs_cubical_sheaf]{Reed-Solomon cubical sheaf codes}.

  More technically, a QLTC is a code \(\mathsf{C}\) defined as the ground-state space of a commuting-projector Hamiltonian \(H\) consisting of a sum of \(r\) local projectors (where \(r\) typically scales linearly with \(n\)), each of which acts on exactly \(u\) qubits (for some constant \(u\)). Such a code is a \((u,R)\)-QLTC with soundness function \(R(\delta)\in[0,1]\) if
  \begin{align}
  \label{eq:qltc}
    \forall \delta > 0,|\psi\rangle~:~\text{dist}(|\psi\rangle,C) \geq \delta n \Rightarrow \frac{1}{r}\langle\psi|H|\psi\rangle\geq R(\delta)~,
  \end{align}
  where \(\text{dist}(|\psi\rangle,\mathsf{C})\) is a particular distance function between the state \(|\psi\rangle\) and the codespace \(\mathsf{C}\) \cite[Def. 13]{arxiv:1310.5664}. The locality parameter \(u\) is called the \textit{query complexity} of the code.

  A qubit, modular-qudit, or Galois-qudit stabilizer code that is locally testable is called a \textit{stabilizer locally testable code (SLTC)}. In other words, the code admits a set of \(r\) \(u\)-local stabilizer generators \(S_i\) whose corresponding code Hamiltonian \(H=\frac{1}{2}\sum_{i=1}^r (I-S_i)\) satisfies the requirement of being a QLTC.

  For example, the \([[n=2L^2,k=2,d=L]]\) toric code on an \(L\times L\) lattice is \textit{not} a QLTC because of the following argument. Let \(|\psi\rangle\) be a ground state that is excited by \(L/3\) Pauli strings, each of length \(L/2\). In order to fit on the lattice, such strings can, e.g., be horizontal and aligned next to each other in the vertical direction. The distance function \(\text{dist}(|\psi\rangle,\mathsf{C})\) is the weight of the smallest Pauli string that multiplies \(|\psi\rangle\) to yield a state in the codespace. In this case, that weight is the same as the weight of the perturbing string, i.e., \(L^2/6\), requiring \(\delta = 1/12\) to satisfy \eqref{eq:qltc}. There are \(2L/3\) violated Hamiltonian terms because each of the \(L/3\) strings violates only two stabilizer generators. However, there are \(r = 2(L^2-1)\) stabilizer generators, so the implication of \eqref{eq:qltc} is not satisfied for nonzero soundness as \(L\to\infty\) because \(\frac{1}{r}\langle\psi|H|\psi\rangle = \frac{2L/3}{2(L^2-1)}\to 0\).


protection: |
  The \textit{robustness} \(r(\delta)\) of a stabilizer LTC is the fraction of the maximum possible number of generators violated by a Pauli error of weight \(\delta n\) \cite[Def. 8]{arxiv:1301.3407}.
  The maximum is \(D_R\delta n\), where \(D_R\) is the number of \(k\)-local generators acting on each qudit, and weights are taken modulo the centralizer of the stabilizer group.
  For codes on \(d\)-dimensional qudits with distance at least two, \(r(\delta)\leq\alpha(d)=1-1/(d^2-1)\) for \(\delta\leq 1/(k^3 D_R)\) \cite[Fact 5]{arxiv:1301.3407}.
  This \textit{single-error robustness} arises because the most common Pauli on a qudit commutes with at least a \(1/(d^2-1)\) fraction of the generators acting on it.
  For \(k\geq 4\), distance at least \(k\), and no nontrivial stabilizer-group element of weight below \(k\), the robustness is strictly below this bound \cite[Thm. 4]{arxiv:1301.3407}.
  Namely, \(r(\delta^{\prime})\leq\alpha(d)(1-\gamma_{\text{gap}})\) with \(\gamma_{\text{gap}}(k)\geq\min\{10^{-3},0.01/k\}\) for some \(\delta^{\prime}\) within one percent of any \(\delta\leq\min\{\delta_C/2,\eta/10\}\), where \(\delta_C\) is the relative distance and \(\eta=k^{-(2k+1)}D_R^{-(2k-1)}\).
  Good small-set expansion of the generators' bipartite interaction graph forces low robustness \cite[Thm. 3]{arxiv:1301.3407}.
  If every set \(S\) of at most \(k\) qudits is acted on by at least \((1-\epsilon)D_R|S|\) generators for some \(\epsilon<1/2\), then \(r(\delta)\leq 2\epsilon\) for all \(\delta<\min\{1/(k^3 D_R),\delta_C/2\}\).
  The error attaining this bound acts on one qudit of each of \(\delta n\) mutually distant generators with that generator's own Pauli.
  Such an error commutes with every generator that meets the chosen generator only at that qudit \cite[Sec. 4.3]{arxiv:1301.3407}.

  Distance balancing and weight reduction are useful for constructing QLTCs.
  For CSS code families with \(w_X,w_Z,q_X,q_Z=O(\log n)\), Hastings' weight-reduction construction yields a QLDPC family whose soundness parameters \(\epsilon_X,\epsilon_Z\) deteriorate by at most polylogarithmic factors \cite[Lemmas 6 and 7]{arxiv:1611.03790}.
  Analogous scaling for a generalized distance-balancing scheme \cite{arxiv:2004.07935} is proven in \cite[Thm. 1.1]{arxiv:2305.00689}.
  Weight reduction can be used to construct codes of constant locality out of CSS QLTCs \cite[Thm. 1.1]{arxiv:2309.05541}.

  \emph{Soundness amplification} \cite[Thm. 1.2]{arxiv:2309.05541} can be used to obtain a constant-soundness (i.e., \(R = \Omega(1)\)) QLTC family from a CSS family with a sub-constant value, with the former's locality being at most polynomial in \(1/R\).

  AEL distance amplification \cite{doi:10.1109/SFCS.1995.492581,doi:10.1109/18.556669} can be used to convert an \([[n^{\prime},k,d,w]]\) soundness-\(R\) CSS LTC family into one with the same dimension, linear distance, and block length differing by at most a constant factor, with \(w\) and \(R\) differing by at most a polynomial factor in \(w\) and \(n/d\) \cite[Thm. 1.3]{arxiv:2309.05541}.

notes:
  - 'It was shown in Ref. \cite{arxiv:1510.02082} that existence of a QLTC with constant parameters would imply resolution of the \textit{No low-energy trivial states} (NLTS) conjecture \cite{arxiv:1301.1363} (see also \cite{arxiv:2311.09503}). QLTCs are believed to also be useful for solving the quantum PCP conjecture \cite{arxiv:1309.7495}.'

