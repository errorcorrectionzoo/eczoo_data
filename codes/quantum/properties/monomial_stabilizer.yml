code_id: monomial_stabilizer

name: 'Monomial stabilizer code'
introduced: '\cite{arxiv:1108.0531}'

alternative_names:
  - 'M-space code'
  - 'Monomial unitary stabilizer code'

description: |
  Code whose codespace is the joint \(+1\) eigenspace of a set of monomial unitary operators, i.e., unitary operators \(PD\) that are each a product of a permutation matrix \(P\) and a diagonal matrix \(D\) in a distinguished basis.
  The stabilizing operators need not commute.
  Codespaces are called \textit{M-spaces}, and states admitted by one-dimensional codespaces are called \textit{M-states} \cite{arxiv:1108.0531}.

  Monomial stabilizer descriptions exist for many states and codes outside of the Pauli stabilizer formalism.
  Examples include XP stabilizer codes \cite{arxiv:2203.00103}, quantum-double codes, the ground space of the AKLT model, W and Dicke states, and coset states (i.e., CSS-type states) of finite Abelian groups \cite{arxiv:1108.0531}.
  Further examples include locally maximally entanglable (LME) states \cite{arxiv:0808.3862}, states encoding output distributions of probabilistic classical circuits \cite{arxiv:0806.1746}, and the Laughlin wavefunction at unit filling \cite{arxiv:1108.0531}.

  A monomial stabilizer group \(\mathcal{G}\) is an extension of the permutation group \(\mathcal{P}\) formed by the permutation parts of its elements by the normal subgroup formed by its diagonal elements.
  For example, the \(n\)-qubit Pauli group is an extension of its \(X\)-type permutation image by the diagonal subgroup generated by \(Z\)-type strings and phases.

  The results below hold when the stabilizing operators generate a finite group \(\mathcal{G}\), which is the setting of the original formalism \cite{arxiv:1108.0531}.
  The defining joint-eigenspace condition applies verbatim to infinite groups, and many of the results naturally extend \cite{arxiv:1108.0531}.
  For compact stabilizer groups, averages over \(\mathcal{G}\) can be taken with respect to the Haar measure.
  For continuous configuration spaces, the distinguished basis becomes a generalized basis of delta-function normalized states, and joint eigenspaces can be spanned by non-normalizable states.
  In this way, the formalism accommodates the finite, compact, and sufficiently well-behaved locally compact Abelian (LCA) groups underlying general-group quantum-double codes, group-GKP codes, and stabilizer codes, with the LCA case including mixed stabilizer codes.
  For such \(\mathcal{G}\), the projector onto the codespace is the average of the elements of \(\mathcal{G}\).
  In other words, the codespace is the isotypic component of the trivial irrep of \(\mathcal{G}\), and the multiplicity of that irrep is the codespace dimension.

  Every monomial stabilizer code with finite stabilizer group admits a canonical orthonormal basis, the \textit{orbit basis}, containing one basis state per orbit of \(\mathcal{P}\) lying in the codespace support \cite{arxiv:1108.0531}.
  The orbit state determined by a distinguished-basis state \(|x\rangle\) in the support is
  \begin{align}
    |\psi_{x}\rangle=\frac{1}{\sqrt{|\mathcal{O}_{x}|}}\sum_{|y\rangle\in\mathcal{O}_{x}}\xi_{x}(y)|y\rangle~,
  \end{align}
  where \(\mathcal{O}_{x}\) is the \(\mathcal{P}\)-orbit of \(|x\rangle\), and where \(\xi_{x}(y)\) are phases determined by the stabilizer group.
  An orbit lies in the support if and only if every stabilizer group element mapping an orbit representative to itself does so with unit phase \cite{arxiv:1108.0531}.
  As a result, the codespace dimension is the number of such orbits and is at most the total number of orbits of \(\mathcal{P}\).

  Deciding whether the codespace of a monomial stabilizer code is nonzero is \(NP\)-hard, already for diagonal stabilizer generators acting on at most three qubits each \cite{arxiv:1108.0531}.
  Sampling the distribution underlying a codeword of a one-dimensional code and estimating codeword expectation values of single-qubit observables are \(NP\)-hard under randomized reductions, via the satisfiability problem with a promised unique satisfying assignment \cite{arxiv:1108.0531}.
  Efficient classical algorithms for sampling and for estimating expectation values of few-body observables exist whenever orbit membership, uniform orbit sampling, and the phases \(\xi_{x}(y)\) are efficiently computable \cite{arxiv:1108.0531}.
  Nearly all of the example families above satisfy these conditions \cite{arxiv:1108.0531}.


relations:
  parents:
    - code_id: frustration_free
      detail: 'Any monomial stabilizer codespace is the ground-state subspace of the frustration-free Hamiltonian \(\sum_{i}(I-P_{i})\), where \(P_{i}\) is the projector onto the \(+1\) eigenspace of the \(i\)th stabilizing operator. The projectors need not commute, with the AKLT model being a prominent example \cite{arxiv:1108.0531}.'
  cousins:
    - code_id: group_representation
      detail: 'The projector onto a monomial stabilizer codespace with finite stabilizer group is the average of the elements of the group \cite{arxiv:1108.0531}. In other words, the projection is onto the trivial-isotypic sector of the stabilizer group. Group-representation codes instead project onto a selected irrep sector of a group of distinguished unitary operations.'
    - code_id: knill
      detail: 'Knill codes and monomial stabilizer codes are overlapping generalizations of stabilizer codes, with neither family containing the other. Knill codes project onto an irrep of a normal subgroup of the group formed by a \hyperref[topic:nice-error-basis]{nice error basis}, and such bases need not consist of monomial matrices \cite{arxiv:quant-ph/0301078}. Conversely, monomial stabilizer groups need not form nice error bases.'
    - code_id: vbs
      detail: 'The ground space of the spin-1 AKLT model, which underlies the earliest VBS codes, is the joint \(+1\) eigenspace of non-commuting two-body monomial operators \cite{arxiv:1108.0531}. Its orbit basis for open boundary conditions consists of the four standard matrix-product ground states \cite{arxiv:1108.0531}.'
    - code_id: clifford_hierarchy
      detail: 'Clifford-hierarchy stabilizer codes whose stabilizing operators are products of Pauli strings and diagonal Clifford-hierarchy gates \cite{arxiv:2511.02900} are monomial stabilizer codes \cite{arxiv:1108.0531}.'


