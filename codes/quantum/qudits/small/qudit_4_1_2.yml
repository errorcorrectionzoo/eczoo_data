code_id: qudit_4_1_2
physical: qudits
logical: qudits

name: '\([[4,1,2]]_5\) ququint RM code'
short_name: '\([[4,1,2]]_5\)'
introduced: '\cite{arxiv:1205.3104}'

alternative_names:
  - '\(\mathcal{QRM}_{5}(1)\) code'

description: |
  A \([[4,1,2]]_5\) \hyperref[topic:quantum-weight-enumerator]{pure} prime-qudit CSS code on four ququints, i.e., five-dimensional qudits, that is the smallest known non-trivial ququint stabilizer code with a transversal non-Clifford gate \cite{arxiv:1205.3104}.
  Analogous qubit and qutrit quantum RM codes require 15 and 8 qudits, respectively \cite{arxiv:1205.3104}.

  A stabilizer tableau for the code is \cite[Def. 6]{arxiv:1205.3104}
  \begin{align}
  \begin{array}{cccc}
    X & X^{2} & X^{3} & X^{4} \\
    Z & Z^{2} & Z^{3} & Z^{4} \\
    Z & Z^{4} & Z^{4} & Z
  \end{array}~.
  \end{align}
  The \(X\)-type generator spans the shortened first-order GRM code of length four, and the \(Z\)-type generators span the dual of the code generated by \((1,2,3,4)\) and the all-ones vector \cite{arxiv:1205.3104}.

  The code admits the codewords
  \begin{align}
    |\overline{j}\rangle = \frac{1}{\sqrt{5}} \sum_{a=0}^{4} |a+j,\,2a+j,\,3a+j,\,4a+j\rangle~,
  \end{align}
  where \(j\in\mathbb{Z}_5\) labels the logical ququint and where addition is modulo five.


features:
  transversal_gates:
    - 'Logical Pauli operators are \(\overline{X} = X^{\otimes 4}\) and \(\overline{Z} = (Z^{\dagger})^{\otimes 4}\) \cite[Def. 6]{arxiv:1205.3104}.'
    - |
      Applying the diagonal gate
      \begin{align}
        M = \mathrm{diag}\left(\omega^{3},\omega,\omega^{-1},\omega^{-2},\omega^{-1}\right)~,\quad\quad \omega = e^{2\pi i/5}
      \end{align}
      to every ququint implements the logical \(\overline{M}^{\dagger}\) \cite[Sec. IV.A]{arxiv:1205.3104}.
      This non-Clifford gate lies in the third level of the \hyperref[topic:qudit-clifford-hierarchy]{qudit Clifford hierarchy} \cite{arxiv:1205.3104}.
      It is Clifford-equivalent to the modular-qudit \(T\) gate \cite{arxiv:1206.1598,arxiv:1406.3055}.

  magic_scaling_exponent: 'Magic-state yield parameter \(\gamma = \log_D (n/k) = \log_2 4 = 2\) for distance \(D=2\) \cite[Table I]{arxiv:1205.3104}.'


  threshold:
    - 'Magic-state distillation threshold of \(\epsilon^{*}_{\mathrm{dep}} \approx 0.363\) against depolarizing noise and \(\epsilon^{*} \approx 0.312\) against arbitrary noise, assuming noiseless Clifford operations \cite[Sec. V.D]{arxiv:1205.3104}. Both thresholds refer to the error probability \(\epsilon = 1-\langle M_0|\rho|M_0\rangle\) of the input magic states \(|M_0\rangle = M|+\rangle\). The depolarizing-noise threshold corresponds to a depolarizing rate of about \(0.45\) \cite[Sec. V.B]{arxiv:1205.3104}.'


relations:
  parents:
    - code_id: polynomial
      detail: 'The \([[4,1,2]]_5\) ququint RM code is the prime-qudit RS code with \(n=4\), \(k=1\), \(g=1\), and evaluation points \(\{1,2,3,4\}\). Its codewords are superpositions of the evaluations of the degree-one polynomials \(j+ax\), where \(j\) is the logical coefficient \cite{arxiv:1205.3104}.'
    - code_id: qudit_triorthogonal
      detail: 'The \([[4,1,2]]_5\) ququint RM code is the triorthogonal code of the \(2\times 4\) matrix over \(\mathbb{Z}_5\) with rows \((1,2,3,4)\) and \((1,1,1,1)\). The self-orthogonal first row yields the \(X\)-type stabilizer generator, and the second row yields the logical \(\overline{X}\) \cite{arxiv:1205.3104,arxiv:1811.08461}.'
    - code_id: small_distance_quantum
  cousins:
    - code_id: stab_15_1_3
      detail: 'The \([[15,1,3]]\) quantum RM code is the smallest qubit stabilizer code with distance at least three and a strongly transversal non-Clifford gate \cite{arxiv:2210.14066}. Both codes belong to a family of CSS codes on \(p^m-1\) qudits of prime dimension \(p\) whose \(X\)-type stabilizers form shortened first-order GRM codes \cite{arxiv:1205.3104}.'


