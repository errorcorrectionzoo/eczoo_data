code_id: three_qutrit_permutation_invariant
physical: qudits

name: '\(((3,2,2))_3\) Three-qutrit single-deletion code'
introduced: '\cite{arxiv:2509.20545}'

description: |
  Three-qutrit PI code that is the smallest qutrit PI code to correct one deletion error.

  The code admits the following logical codewords:
  \begin{align}
    |\overline{0}\rangle &\propto|000\rangle+|111\rangle+|222\rangle\\
    |\overline{1}\rangle &\propto|012\rangle+|021\rangle+|102\rangle+|120\rangle+|201\rangle+|210\rangle~.
  \end{align}

protection: |
  Detects any single-qutrit error and corrects one deletion error \cite{arxiv:2509.20545}.

features:
  transversal_gates:
    - 'Single-qubit Pauli group via transversal \(\Sigma(72\phi)\) gates \(g^{\otimes 3}\) \cite[Sec. VI.B.1]{arxiv:2403.08999}.'
    - 'Transversal qutrit Clifford gates \(g^{\otimes 3}\), with \(g\in\Sigma(216\phi)\), also preserve the code \cite[Sec. VI.B.4]{arxiv:2403.08999}.'

relations:
  parents:
    - code_id: qudits_into_qudits
    - code_id: permutation_invariant
    - code_id: t_group
      detail: 'The \(((3,2,2))_3\) twisted \(1\)-group code of \(\Sigma(72\phi)\subset SU(3)\) \cite[Sec. VI.B.1]{arxiv:2403.08999} is the three-qutrit single-deletion code.'
  cousins:
    - code_id: four_qubit_permutation_invariant
      detail: 'The four-qubit (three-qutrit) single-deletion code is the smallest PI qubit (qutrit) code to correct one deletion error.'
    - code_id: wasilewski-banaszek
      detail: 'The three-qutrit single-deletion code maps to the Wasilewski-Banaszek code via the \hyperref[topic:qudit-dicke]{simplex mapping} \cite{arxiv:2509.20545}.'


