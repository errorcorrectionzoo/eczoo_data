code_id: qudit_xcube
physical: qudits
logical: qudits

name: 'Qudit X-cube model code'
introduced: '\cite{arxiv:1701.00762,arxiv:2504.09847}'

alternative_names:
  - '\(\mathbb{Z}_q\) X-cube model'

description: |
  Generalization of the X-cube model code to modular qudits \cite{arxiv:1701.00762}.
  Qudits lie on the edges of a cubic lattice.
  Cube stabilizers are products of \(Z\) and \(Z^{\dagger}\) over the twelve edges of a cube.
  Vertex stabilizers are products of \(X\) and \(X^{\dagger}\) over the four coplanar edges at a vertex, one for each lattice plane \cite{arxiv:1701.00762}.

  The code arises from three orthogonal stacks of modular-qudit surface codes sharing two qudits per edge, with each pair coupled by a strong \(X\)-type term \cite{arxiv:1701.00762}.
  The coupling condenses composite flux loops, i.e., quartets of fluxes in orthogonal layers.
  The star operators survive as the vertex stabilizers, and the product of the six plaquette operators around a cube survives as the cube stabilizer \cite{arxiv:1701.00762}.

  For prime \(q\) and \(L = q^n - 1\), the ground-state degeneracy on the length-\(L\) three-torus is \(q^{6L-3}\) \cite{arxiv:1701.00762}.
  A planar pair of fractons of magnetic charge \(a\) has mutual statistics phase \(e^{2\pi i ab/q}\) with a lineon of electric charge \(b\) in its plane \cite{arxiv:1701.00762}.

  With only the \(X\)-type layer coupling, the transition from decoupled layers into the qudit X-cube phase is direct and first order for \(q<5\).
  For \(q\geq 5\), an intermediate gapless phase dual to the Coulomb phase of \((3+1)\)D \(\mathbb{Z}_q\) lattice gauge theory intervenes \cite{arxiv:1701.00762}.

  The model is the \(a_x=a_y=a_z=1\) member of a family of qudit X-cube models with stabilizer exponents set by integers \((a_x,a_y,a_z)\) \cite{arxiv:2504.09847}.


relations:
  parents:
