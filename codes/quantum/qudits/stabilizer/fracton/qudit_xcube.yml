    - code_id: cage_net
      detail: 'A field-theoretic description of the qudit X-cube model can be obtained by coupling layers of 2D \(\mathbb{Z}_q\) gauge theory \cite{arxiv:2505.13604}. For three orthogonal foliations with \(\mathbb{Z}_q\) layers, the string-membrane-net model is equivalent to the qudit X-cube model code \cite{arxiv:1812.01613}. String-membrane-net models are phase-equivalent to cage-net models under generalized local unitaries \cite{arxiv:2505.13604}.'
  cousins:
    - code_id: qudit_surface
      detail: 'The qudit X-cube model code is obtained from three orthogonal stacks of modular-qudit surface codes sharing two qudits per edge \cite{arxiv:1701.00762}. A strong \(X\)-type coupling of each pair condenses composite flux loops and yields the X-cube stabilizers \cite{arxiv:1701.00762}. A field-theoretic description of the qudit X-cube model can be obtained by coupling layers of 2D \(\mathbb{Z}_q\) gauge theory \cite{arxiv:2505.13604}.'
    - code_id: qudit_3d_surface
      detail: 'Three orthogonal stacks of modular-qudit surface codes sharing two qudits per edge yield the modular-qudit 3D surface code when composite charges condense \cite{arxiv:1701.00762}. The same layers yield the qudit X-cube model code when composite flux loops condense. The transition from decoupled layers into the qudit X-cube phase is dual to the flux-loop condensation transition out of the modular-qudit 3D surface-code phase \cite{arxiv:1701.00762}.'


