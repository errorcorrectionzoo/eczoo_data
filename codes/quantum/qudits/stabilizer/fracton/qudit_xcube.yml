code_id: qudit_xcube
physical: qudits
logical: qudits

name: 'Qudit X-cube model code'
introduced: '\cite{arxiv:1701.00762,arxiv:2504.09847}'

alternative_names:
  - '\(\mathbb{Z}_q\) X-cube model'

description: |
  Generalization of the X-cube model code to modular qudits on the edges of a cubic lattice \cite{arxiv:1701.00762}.
  Each cube stabilizer applies \(Z\) and \(Z^{\dagger}\) to alternate edges in each set of four parallel cube edges.
  Each vertex carries three stabilizers, one per coordinate plane, applying \(X\) and \(X^{\dagger}\) to the two opposite edges along each in-plane axis \cite[Fig. 7]{arxiv:1701.00762}.

  The code is obtained from three orthogonal stacks of modular-qudit surface codes with two qudits per edge, one from each layer containing it \cite{arxiv:1701.00762}.
  A strong \(X\)-type coupling of the two qudits on each edge condenses composite flux loops, i.e., quartets of fluxes in orthogonal layers.
  The star operators survive as the vertex stabilizers, and the six plaquette operators around a cube combine into the cube stabilizer \cite{arxiv:1701.00762}.

  On an \(L_x\times L_y\times L_z\) three-torus, the ground-state degeneracy is \(q^{2(L_x+L_y+L_z)-3}\) \cite{arxiv:2504.09847} (see Ref. \cite{arxiv:1701.00762} for prime \(q\) and \(L_x=L_y=L_z=q^n-1\)).
  A planar pair of fractons of magnetic charge \(m\) has mutual statistics phase \(e^{2\pi i mc/q}\) with a lineon of electric charge \(c\) in its plane \cite{arxiv:1701.00762}.
  With only the \(X\)-type coupling and \(q\geq 5\), an intermediate gapless phase separates the decoupled layers from the qudit X-cube phase \cite{arxiv:1701.00762}.
  This phase is dual to the Coulomb phase of \((3+1)\)D \(\mathbb{Z}_q\) lattice gauge theory \cite{arxiv:1701.00762}.

  The model is the \(a_x=a_y=a_z=1\) member of a family of qudit X-cube models with stabilizer exponents set by integers \((a_x,a_y,a_z)\) \cite{arxiv:2504.09847}.


relations:
  parents:
    - code_id: qudit_css
    - code_id: fracton
    - code_id: cage_net
      detail: 'A field-theoretic description of the qudit X-cube model can be obtained by coupling layers of 2D \(\mathbb{Z}_q\) gauge theory \cite{arxiv:2505.13604}. For three orthogonal foliations with \(\mathbb{Z}_q\) layers, the string-membrane-net model is equivalent to the qudit X-cube model code \cite{arxiv:1812.01613}. String-membrane-net models are phase-equivalent to cage-net models under generalized local unitaries \cite{arxiv:2505.13604}.'
  cousins:
    - code_id: qudit_surface
      detail: 'The qudit X-cube model code is obtained from three orthogonal stacks of modular-qudit surface codes with two qudits per edge, one from each layer containing it \cite{arxiv:1701.00762}. A strong \(X\)-type coupling of each pair condenses composite flux loops and yields the X-cube stabilizers \cite{arxiv:1701.00762}. A field-theoretic description of the qudit X-cube model can be obtained by coupling layers of 2D \(\mathbb{Z}_q\) gauge theory \cite{arxiv:2505.13604}.'
    - code_id: qudit_3d_surface
      detail: 'Three orthogonal stacks of modular-qudit surface codes with two qudits per edge, one from each layer containing it, yield the modular-qudit 3D surface code when composite charges condense \cite{arxiv:1701.00762}. The same layers yield the qudit X-cube model code when composite flux loops condense. With only the \(X\)-type coupling, the transition from decoupled layers into the qudit X-cube model phase is dual to flux-loop condensation out of the modular-qudit 3D surface-code phase \cite{arxiv:1701.00762}.'


