      detail: 'Hybrid cat codewords consist of a bosonic mode in either coherent or cat states.'
    - code_id: rbh
      detail: 'Hybrid cat codes can be concatenated with RBH codes \cite{arxiv:2401.00450}.'
    - code_id: oscillators_concatenated
      detail: 'Hybrid cat codes can be concatenated with RBH codes \cite{arxiv:2401.00450}.'




