code_id: hybrid_cat
physical: groups
logical: groups

name: 'Hybrid cat code'
introduced: '\cite{arxiv:1112.0825,arxiv:1906.04864,arxiv:2011.04209,arxiv:2401.00450}'

description: |
  A mixed oscillator code admitting codewords that are tensor products of a single-qubit (e.g., photon polarization) state with either a cat state or a coherent state.
   
  Codewords of the coherent-state version \cite{arxiv:1112.0825} are \(|\alpha\rangle|+\rangle\) and \(|-\alpha\rangle|-\rangle\), i.e., hyper-entangled states of the occupation-number and polarization degrees of freedom of a photon.
  Codewords of the cat-state version \cite{arxiv:1712.10206,arxiv:2401.00450} are proportional to \((\left|\alpha\right\rangle +\left|-\alpha\right\rangle )|+\rangle\) and \((\left|i\alpha\right\rangle -\left|-i\alpha\right\rangle )|-\rangle\).
  Codewords of the squeezed-cat version \cite{arxiv:2502.19778} are proportional to \((|\alpha,\xi\rangle+|-\alpha,\xi\rangle)|+\rangle\) and \((|\alpha,\xi\rangle-|-\alpha,\xi\rangle)|-\rangle\), where \(|\pm\alpha,\xi\rangle\) are squeezed coherent states.

features:
  general_gates:
    - 'Linear-optical universal gate set for the squeezed-cat version, with \(X\) and \(Z(\theta)\) gates by wave plates and displacements, and Hadamard and CNOT gates by gate teleportation \cite{arxiv:2502.19778}.'
  fault_tolerance:
    - 'Photonic architecture based on concatenation with RBH codes \cite{arxiv:2401.00450}.'

notes:
  - 'See reviews \cite{arxiv:1409.3719,arxiv:2407.10381} for introductions to mixed oscillator platforms.'

relations:
  parents:
    - code_id: hybrid_qudit_oscillator
  cousins:
