code_id: 2d_stabilizer
physical: groups
# includes both Galois and modular

name: '2D lattice stabilizer code'

description: |
  Lattice stabilizer code in two Euclidean dimensions, using either the ordinary block notion of locality or the fermionic/Majorana notion of locality.

  Any translation-invariant 2D prime-qudit lattice stabilizer code can be converted to several copies of the prime-qudit 2D surface code along with some trivial codes \cite{arxiv:1812.11193}.
  Any 2D topological order requires weight-four Hamiltonian terms, i.e., it cannot be stabilized via weight-two or weight-three terms on 2D lattices of qubits or qutrits \cite{arxiv:quant-ph/0308021,arxiv:1102.0770,arxiv:1803.02213}.

  Translation-invariant 2D prime-qudit lattice stabilizer codes are equivalent to several copies of the prime-qudit surface code and a trivial code via a local constant-depth Clifford circuit \cite{arxiv:1812.11193}.
  There is an algorithm that checks the topological order condition of a 2D translationally invariant modular-qudit stabilizer code for any qudit dimension, including nonprime dimensions \cite{arxiv:2312.11170}.
  It then extracts the anyon string operators, fusion rules, topological spins, and braiding relations of the code \cite{arxiv:2312.11170}.
  Anyons are equivalence classes of syndrome patterns modulo the syndromes of local Pauli operators, and their string operators are solutions of an \textit{anyon equation} in the \hyperref[topic:quantum-polynomial-mapping]{polynomial representation} \cite{arxiv:2312.11170}.
  Fusion rules follow from the Smith normal form of the relations among anyons, and topological spins from a T-junction process \cite{arxiv:2312.11170}.
  Another algorithm determines boundaries and twist defects \cite{arxiv:2410.11942}.

  On a finite torus, an anyon whose translation period does not divide the torus lengths is absent \cite{arxiv:2503.03827}.
  The ground-state degeneracy can then be smaller than the number of anyon types of the underlying topological order \cite{arxiv:2211.00299,arxiv:2503.03827,arxiv:2503.04699}.
  For 2D translation-invariant qubit CSS codes with two qubits per unit cell, the number of logical qubits on any torus, including twisted tori, is twice the dimension of a quotient of the Laurent polynomial ring \cite[Thm. 3]{arxiv:2503.03827}.
  The quotient is by the ideal generated by the two check polynomials and the two torus relations \cite[Thm. 3]{arxiv:2503.03827}.
  See the \hyperref[code:qcga]{BB code} entry for details.

features:
  encoders:
    - 'The geometric entanglement measure of a 2D stabilizer codeword with sufficiently high distance \(d\) scales as \hyperref[topic:asymptotics]{order} \(\Omega(d^2)\) \cite{arxiv:2405.07970}.'
  decoders:
    - 'Renormalization group (RG) decoder \cite{arxiv:1006.1362}.'
    - 'Tensor-network based decoder for 2D codes subject to correlated noise \cite{arxiv:1809.10704}.'
    - 'Standard stabilizer-based error correction can be performed even in the presence of perturbations to the codespace \cite{arxiv:2211.09803,arxiv:2401.06300,arxiv:2402.14906}; see also Refs. \cite{arxiv:0807.0287,arxiv:0911.3843,arxiv:1107.3940}.'
    - 'Real-time geometrically local decoder based on introducing an ancillary buffer and confining spacetime interactions between anyons  \cite{arxiv:2510.08056}.'
  code_capacity_threshold:
    - 'Noise thresholds can be formulated as anyon \hyperref[topic:code-switching]{condensation} transitions in a topological field theory \cite{arxiv:2301.05687}, generalizing the mapping of the effect of noise on a code state to a statistical mechanical model \cite{arxiv:quant-ph/0110143,arxiv:1208.2317,arxiv:1311.7688,arxiv:1809.10704}.
    Namely, the noise threshold for a noise channel \(\cal{E}\) acting on a 2D stabilizer state \(|\psi\rangle\) can be obtained from the properties of the resulting (mixed) state \(\mathcal{E}(|\psi\rangle\langle\psi|)\) \cite{arxiv:2301.05238,arxiv:2301.05687,arxiv:2301.05689,arxiv:2309.11879, arxiv:2401.17359}.'


relations:
  parents:
    - code_id: translationally_invariant_stabilizer
  cousins:
    - code_id: surface
      detail: 'Translation-invariant 2D qubit lattice stabilizer codes are equivalent to several copies of the Kitaev surface code via a local constant-depth qudit Clifford circuit \cite{arxiv:1103.4606,arxiv:1107.2707,arxiv:1607.01387}.'
    - code_id: quantum_double_abelian
      detail: 'Translation-invariant 2D prime-qudit lattice stabilizer codes are equivalent to several copies of the prime-qudit surface code and a trivial code via a local constant-depth qudit Clifford circuit \cite{arxiv:1812.11193}.'
    - code_id: holographic
      detail: '2D lattice stabilizer codes admit a bulk-boundary correspondence similar to that of holographic codes, namely, the boundary Hilbert space of the former cannot be realized via local degrees of freedom \cite{arxiv:2312.04617}.'
    - code_id: qldpc
      detail: 'Chain complexes describing qubit QLDPC codes can be converted to 2D lattice stabilizer codes \cite{arxiv:2408.01769}.'


