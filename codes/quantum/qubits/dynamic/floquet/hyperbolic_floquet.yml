code_id: hyperbolic_floquet
physical: qubits
logical: qubits

name: 'Hyperbolic Floquet code'
introduced: '\cite{arxiv:2110.05348,arxiv:2308.03750,arxiv:2309.10033}'

description: |
  Floquet code whose check operators correspond to edges of a trivalent, face-3-colorable tiling of a closed hyperbolic surface, such as an \(\{8,3\}\) tessellation.
  Qubits sit on vertices, and each edge takes the color missing from its two adjacent faces.
  \(XX\), \(YY\), and \(ZZ\) checks are measured on the three edge colors in turn \cite{arxiv:2308.03750,arxiv:2602.22906}.

  The product of the edge checks around a \(p\)-gon face is an inferred weight-\(p\) stabilizer, and a genus-\(g\) surface yields \(k=2g\) logical qubits \cite{arxiv:2308.03750,arxiv:2602.22906}.
  \textit{Semi-hyperbolic} Floquet codes are obtained by fine-graining, i.e., subdividing each triangle of the dual lattice into \(\ell^2\) triangles, which multiplies \(n\) by \(\ell^2\) while preserving \(k\) \cite{arxiv:2308.03750,arxiv:2602.22906}.

protection: |
  Code distance is at most \(O(\log n)\) due to the hyperbolic qubit geometry \cite{arxiv:2110.05348}, but semi-hyperbolic lattices yield \(O(\sqrt{n})\) distance \cite{arxiv:2308.03750}.

  The \textit{embedded distance} is the distance of the stabilizer code inside the subspace fixed by the outcomes of the weight-two checks \cite{arxiv:2308.03750}.
  It equals the minimum weight of a homologically nontrivial cycle or cocycle in the three restricted lattices, each obtained from the dual triangulation by deleting the vertices of one color \cite{arxiv:2308.03750,arxiv:2602.22906}.
  Level-five fine-graining turns the 16-qubit, \(k=4\) Bolza-surface code with embedded distance two into a 400-qubit code with embedded distance seven \cite{arxiv:2308.03750,arxiv:2602.22906}.

features:
  rate: 'Finite encoding rate whose value depends on the hyperbolic lattice. The asymptotic rate is \(1/8\) for \(\{8,3\}\) tessellations \cite{arxiv:2309.10033}, and \(1/5\) and \(1/4\) for \(\{10,3\}\) and \(\{12,3\}\) tessellations \cite{arxiv:2602.22906}.'
  decoders:
    - 'Syndrome structure allows for MWPM decoding \cite{arxiv:2308.03750,arxiv:2602.22906}.'
  threshold:
    - 'EM3 noise (correlated Pauli and measurement-flip errors on each pair measurement): \(1.5\%\) to \(2\%\) for semi-hyperbolic families on \(\{8,3\}\) tessellations \cite{arxiv:2308.03750}, and \(\sim 1.5\%\) for semi-hyperbolic families on \(\{10,3\}\) and \(\{12,3\}\) tessellations \cite{arxiv:2602.22906}.'
    - 'SDEM3 noise (EM3 with Pauli and measurement-flip errors sampled independently): \(1.0\%\) to \(1.2\%\) for semi-hyperbolic families on all three tessellations \cite{arxiv:2602.22906}.'
    - 'SPOQC-2 heralded photon-loss model \cite{arxiv:2410.07065} with erasure-aware MWPM decoding: single-photon loss rate of \(8.5\%\) to \(9\%\) for the semi-hyperbolic \(\{8,3\}\) family \cite{arxiv:2602.22906}. The semi-hyperbolic \(\{10,3\}\) and \(\{12,3\}\) families reach \(7\%\) to \(8\%\) and \(6.5\%\) to \(8\%\), respectively \cite{arxiv:2602.22906}.'
    - 'Phenomenological noise with depolarizing and measurement errors: \(0.1\%\) for \(\{8,3\}\) base codes \cite{arxiv:2309.10033}, and \(1.0\%\) to \(1.3\%\) for semi-hyperbolic families on \(\{8,3\}\), \(\{10,3\}\), and \(\{12,3\}\) tessellations \cite{arxiv:2602.22906}.'

notes:
  - 'Performance in distributed settings is studied in Refs. \cite{arxiv:2501.14029,arxiv:2602.17969}.'
  - 'See Ref. \cite[Tables 2 and 3]{arxiv:2602.22906} for parameters of explicit codes on \(\{8,3\}\), \(\{10,3\}\), and \(\{12,3\}\) tessellations and of their fine-grained variants.'

relations:
  parents:
    - code_id: floquet
  cousins:
    - code_id: honeycomb_floquet
      detail: 'Hyperbolic Floquet codes are defined on hyperbolic color-code tilings in the same way that the honeycomb Floquet code, up to local Clifford gates, is defined on the 6.6.6 tiling \cite{arxiv:2308.03750}.'
    - code_id: two_dimensional_hyperbolic_surface
      detail: |
        After the checks of one color are measured, the ISG of a hyperbolic Floquet code embeds a 2D hyperbolic surface code on the restricted lattice, obtained from the dual triangulation by deleting the vertices of that color \cite{arxiv:2308.03750}.
        For an \(\{8,3\}\) tiling, the restricted lattice is an \(\{8,4\}\) tessellation \cite{arxiv:2308.03750}.
        The fine-graining that yields semi-hyperbolic surface codes \cite{arxiv:1703.00590} also yields semi-hyperbolic Floquet codes \cite{arxiv:2308.03750}.


