code_id: nonlocal_lowdepth
physical: qubits
logical: qubits

name: 'Brown-Fawzi Clifford-circuit code'
short_name: 'Brown-Fawzi'
introduced: '\cite{arxiv:1312.7646}'

description: |
  An \([[n,k]]\) stabilizer code whose encoder is a random \hyperref[topic:clifford]{Clifford circuit} of \hyperref[topic:asymptotics]{polylogarithmic} depth, with two-qubit gates acting on randomly chosen pairs of qubits.
  The gates are applied either one at a time to random pairs \cite{arxiv:1312.7646} or in parallel layers on random perfect matchings \cite{arxiv:2608.18536}.

  An \(n\)-qubit encoding circuit with \(O(n \log^2 n)\) random two-qubit \hyperref[topic:clifford]{Clifford gates} applied to randomly chosen pairs yields a code with distance at least \(d+1\) with probability \(1 - O(1/n^8)\) \cite{arxiv:1312.7646}.
  This holds provided that \begin{equation}
    \frac{k}{n} < 1 - \frac{d}{n}\log_2 3 - h\left(\frac{d}{n}\right)~,
  \end{equation}
  where \(h\) is the entropy function.
  Since two gates acting on disjoint qubits can be executed simultaneously, the depth of a circuit of this size is typically of order \(O(\log^3 n)\).

  Random matching circuits attain the same tradeoff at depth \(O(\log n)\) \cite[Thm. 2.3]{arxiv:2608.18536}.
  Each layer pairs the qubits by a uniformly random perfect matching and applies an independent random two-qubit Clifford gate to each pair.
  The gates can be CNOTs sandwiched between independent random single-qubit Cliffords drawn from \(\{I, HS, (HS)^2\}\), for \(O(n \log n)\) CNOT gates in total \cite[Cor. 1.3]{arxiv:2608.18536}.
  The same holds for any gate distribution invariant under local Clifford twirls acting transitively on \(\{X,Y,Z\}\) up to sign, containing an entangling gate, and symmetric under inversion \cite[Def. 2.1]{arxiv:2608.18536}.
  Each layer multiplies the expected weight of a low-weight Pauli operator by a constant factor, so logical operators spread to linear weight after \(O(\log n)\) layers \cite[Lem. 3.7]{arxiv:2608.18536}.
  This depth is the minimum possible for linear distance by a light-cone argument \cite{arxiv:2608.18536}.

features:
  rate: 'Achieves the \hyperref[topic:quantum-gv-bound]{quantum GV bound}, i.e., the asymptotic rate-distance tradeoff of a code whose encoder is a random (not necessarily log-depth) Clifford unitary \cite{arxiv:1312.7646,arxiv:2608.18536}.'
  encoders:
    - 'Random \hyperref[topic:clifford]{Clifford circuit} of depth \(O(\log^3 n)\) with gates on random pairs of qubits \cite{arxiv:1312.7646}.'
    - 'Random matching circuit of depth \(O(\log n)\) built from CNOT gates and single-qubit Clifford twirls \cite{arxiv:2608.18536}.'


