code_id: cpc
physical: qubits
logical: qubits

name: 'Coherent-parity-check (CPC) code'
short_name: 'CPC'
introduced: '\cite{arxiv:1611.08012,arxiv:1709.01866,arxiv:2009.07752}'

description: |
  A qubit stabilizer code for which two binary linear codes are used to directly construct encoding and decoding circuits against \(X\)- and \(Z\)-type errors, respectively, via ZX calculus \cite{doi:10.1007/978-3-540-70583-3_25,arxiv:0906.4725}.
  CPC codes can be obtained from numerical search \cite{arxiv:1709.01866}.

relations:
  parents:
    - code_id: qubit_stabilizer
      detail: 'CPC codes are a type of stabilizer code.
      A teleported version of the CPC construction, the Clifford noise reduction (CliNR) scheme, can reduce noise in \hyperref[topic:clifford]{Clifford circuits} with Pauli measurements using \(3n+1\) qubits for an \(n\)-qubit circuit \cite{arxiv:2407.06583,arxiv:2504.13356}.
      Single-fault propagation yields a quality metric for ranking Pauli flag gadgets for \hyperref[topic:clifford]{Clifford circuits} \cite[Sec. II.D]{arxiv:2009.07752}.'
  cousins:
    - code_id: binary_linear
      detail: 'The CPC construction uses two binary linear codes.'
    - code_id: hamming
      detail: 'Any \([n,k,3]\) Hamming code with \(k>2\) yields a \([[2n-k+1,k-1,3]]\) \textit{tripartite} CPC code via the CPC construction \cite[Thm. 4]{arxiv:1611.08012}.'


