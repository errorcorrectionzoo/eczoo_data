code_id: quadric_tower
physical: qubits
logical: qubits

name: 'Quadric tower code'
introduced: '\cite{arxiv:2608.05688}'

description: |
  Family of self-dual CSS codes, one for each \(j\geq 3\), whose qubits are the points of an elliptic quadric in \(\mathbb{F}_2^{2j}\) and whose \(X\)- and \(Z\)-type stabilizer generators are both supported on the order-\((j-2)\) RM code punctured to that quadric.
  The qubit permutation automorphism group contains the symplectic group \(Sp(2j,\mathbb{Z}_2)\) acting in its minimal-degree faithful permutation representation.

  Fix an elliptic quadratic form \(Q_0\) on \(V=\mathbb{F}_2^{2j}\), i.e., one of Arf invariant one, and take its zero set \(Z(Q_0)=Q_0^{-1}(0)\) as the qubits.
  Both classical codes are the restrictions to \(Z(Q_0)\) of all Boolean functions of algebraic degree at most \(j-2\),
  \begin{align}
    C_X=C_Z=\text{RM}(j-2,2j)\big|_{Z(Q_0)}~,
  \end{align}
  yielding the family
  \begin{align}
    QT_j=[[2^{2j-1}-2^{j-1},\,k_j,\,2^{j-1}]]~,\qquad k_j=14,48,166,584,2092,\ldots
  \end{align}
  for \(j=3,4,5,6,7,\ldots\), with \(k_j=V_{j-1}-V_{j-2}\) in terms of the alternating binomial sums \(V_r=S_r-S_{r-2}+S_{r-4}-\cdots\) and \(S_a=\sum_{i\leq a}\binom{2j}{i}\).
  The first two members are \(QT_3=[[28,14,4]]\) and \(QT_4=[[120,48,8]]\).

  Writing \(B\) for the polar form of \(Q_0\), the map \(a\mapsto Q_0+B(a,\cdot)\) identifies the qubits with one Arf class of quadratic forms on \(\mathbb{F}_2^{2j}\).
  The symplectic group permutes that class, acting affinely on the quadric coordinates, and the class is the smallest set on which \(Sp(2j,\mathbb{Z}_2)\) can act faithfully \cite{doi:10.1515/crll.1941.183.148,doi:10.1007/BF02761072}.
  For \(j=3\), the classical code is the \([28,7,12]\) code whose automorphism group is \(Sp(6,\mathbb{Z}_2)\) \cite{doi:10.3336/gm.49.2.01}.

protection: |
  The distance is \(d_j=2^{j-1}\approx\sqrt{n_j/2}\), verified for \(j\leq 6\) and holding in general modulo a degree-sharpness condition on the associated Koszul complex \cite{arxiv:2608.05688}.
  A lower bound follows by multiplying a Boolean function \(g\) of degree at most \(j-1\) by \(1+Q_0\), which turns restriction weights on the quadric into ambient weights and places the product in \(\text{RM}(j+1,2j)\), whose minimum distance is \(2^{j-1}\).
  The same argument applied one layer down shows that every nonidentity stabilizer element has weight at least \(2^j\), so the codes are \hyperref[topic:quantum-weight-enumerator]{pure}.
  Quadric tower codes saturate an automorphism-group bound on permutation degree \cite{arxiv:2604.15111}, since their qubits form the smallest set on which \(Sp(2j,\mathbb{Z}_2)\) acts faithfully \cite{doi:10.1515/crll.1941.183.148,doi:10.1007/BF02761072}.
  Self-orthogonality and doubly-evenness of the classical code both follow from the Ax-Katz theorem applied to point counts on the quadric.

features:
  rate: 'The rate \(k_j/n_j\) takes the values \(0.50, 0.40, 0.335, 0.29,\ldots\) and behaves as \(\Theta(1/\sqrt{j})=\Theta(1/\sqrt{\log n})\).'

  transversal_gates:
    - 'CNOT gate between two blocks because the code is CSS, transversal Hadamard because the code is self-dual, and transversal \(S\) because the underlying classical code is doubly even.'
    - 'Qubit permutations realizing \(Sp(2j,\mathbb{Z}_2)\) in its minimal-degree action, generated by the linear transvections stabilizing \(Q_0\) together with affine transvections \cite{arxiv:2608.05688}.'
    - 'Fold-transversal gates for every involution of the permutation action, since the underlying classical code is self-orthogonal \cite{arxiv:2608.05688}.'
    - 'Two-fold transversal gates generate the full logical Clifford group for the first two members, namely \(Sp(28,\mathbb{Z}_2)\) for \(QT_3=[[28,14,4]]\) and \(Sp(96,\mathbb{Z}_2)\) for \(QT_4=[[120,48,8]]\) \cite{arxiv:2608.05688}.'


relations:
  parents:
    - code_id: self_dual_css
    - code_id: quantum_ag
      detail: |
        The classical code underlying a quadric tower code is the evaluation code of polynomials of degree at most \(j-2\) on the points of a quadric hypersurface, the affine binary case of the RM codes associated to algebraic varieties \cite{doi:10.1007/BFb0087988}.
        The \(j=3\) member is the three-weight \([28,7,12]\) code, whose nonzero weights \(12\), \(16\), and \(28\) place it among the two- and three-weight codes associated to hyperquadrics \cite{doi:10.1016/0012-365X(75)90017-5}; higher members use polynomials of degree above one and are no longer few-weight.
  cousins:
    - code_id: quantum_reed_muller
      detail: 'Quadric tower codes are CSS codes built from RM codes punctured to the zero set of an elliptic quadratic form.'
