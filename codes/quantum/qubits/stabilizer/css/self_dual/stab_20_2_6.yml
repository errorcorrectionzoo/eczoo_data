    - code_id: quantum_logic
      detail: 'The \(AGL(1,5)\) group-algebra core in the Quantum Logic Code construction is permutation-equivalent to the \([[20,2,6]]\) B\&C phantom code \cite{arxiv:2606.13521}.'
  cousins:
