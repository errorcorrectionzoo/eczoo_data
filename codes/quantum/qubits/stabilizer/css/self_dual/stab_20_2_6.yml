      detail: 'The \([[20,2,6]]\) code is equivalent to a group-algebra CSS code with \(c=\{0,1,2,4,6,7,10,16\}\) \cite{arxiv:2606.13521}.'
    - code_id: stab_5_1_3
      detail: 'The \([[20,2,6]]\) code is obtained from the \([[5,1,3]]\) five-qubit code by \hyperref[topic:symplectic-doubling]{concatenated symplectic doubling} \cite[Corr. 1]{arxiv:1004.3791}\cite[Table I]{arxiv:2510.18753}\cite{arxiv:2605.15344}. The same code arises by binarizing the \([[5,1,3]]_4\) Galois-qudit CSS code and concatenating each qubit pair with the \([[4,2,2]]\) code, since that Galois-qudit code is a \hyperref[topic:symplectic-doubling]{symplectic double} of the five-qubit code \cite{arxiv:2601.20927}.'
    - code_id: stab_4_2_2
      detail: 'The \([[20,2,6]]\) code is obtained by concatenating each qubit pair of the \([[10,2,3]]\) binarized code with the \([[4,2,2]]\) code \cite{arxiv:2601.20927,arxiv:2605.15344}.'
    - code_id: stab_10_2_3
      detail: 'The \([[20,2,6]]\) code is obtained by concatenating each qubit pair of the \([[10,2,3]]\) binarized Galois-qudit code with the \([[4,2,2]]\) code \cite{arxiv:2601.20927}.'


