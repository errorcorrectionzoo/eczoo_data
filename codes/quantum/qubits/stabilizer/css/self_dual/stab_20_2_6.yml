code_id: stab_20_2_6
physical: qubits
logical: qubits

name: '\([[20,2,6]]\) B\&C phantom code'
short_name: '\([[20,2,6]]\)'
introduced: '\cite{arxiv:2510.18753,arxiv:2601.20927,arxiv:2605.15344}'

description: |
  Self-dual doubly-even CSS code on 20 physical qubits encoding two logical qubits with distance 6.
  The code is obtained by binarizing the \([[5,1,3]]_4\) code in the self-dual normal basis \(\{\omega,\omega^2\}\) to the \([[10,2,3]]\) binarized Galois-qudit code and then concatenating each qubit pair with the \([[4,2,2]]\) code \cite{arxiv:2601.20927}.
  Equivalently, the code is the \hyperref[topic:symplectic-doubling]{concatenated symplectic double} of the \([[5,1,3]]\) five-qubit code \cite[Corr. 1]{arxiv:1004.3791}\cite[Corr. 2]{arxiv:2605.15344}.

  Physical qubits are arranged in five blocks of four, where block \(j\) corresponds to the \(j\)-th \(\mathbb{F}_4\) qudit of the \([[5,1,3]]_4\) code.
  Using the concatenation convention of the Zoo, the \([[10,2,3]]\) code is the inner code and the \([[4,2,2]]\) code is the outer code.
  Stabilizer generators of the \([[4,2,2]]\) outer code on each block are \(ZZZZ\) and \(XXXX\); the inner stabilizers are the lifted images of the eight stabilizer generators of the \([[10,2,3]]\) code using the logical-operator map
  \(X^\omega\mapsto XXII\), \(X^{\omega^2}\mapsto XIXI\), \(Z^\omega\mapsto IZIZ\), \(Z^{\omega^2}\mapsto IIZZ\) within each block.

  A stabilizer tableau for the code is \cite{arxiv:2601.20927}
  \begin{align}
  \begin{smallmatrix}
    Z & Z & Z & Z & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & Z & Z & Z & Z & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & Z & Z & Z & Z & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & Z & Z & Z & Z & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & Z & Z & Z & Z \\
    I & Z & I & Z & I & Z & I & Z & I & Z & I & Z & I & Z & I & Z & I & I & I & I \\
    I & I & Z & Z & I & I & Z & Z & I & I & Z & Z & I & I & Z & Z & I & I & I & I \\
    I & I & I & I & I & Z & I & Z & I & Z & Z & I & I & I & Z & Z & I & Z & I & Z \\
    I & I & I & I & I & I & Z & Z & I & Z & I & Z & I & Z & Z & I & I & I & Z & Z \\
    X & X & X & X & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & X & X & X & X & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & X & X & X & X & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & X & X & X & X & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & I & X & X & X & X \\
    X & X & I & I & X & X & I & I & X & X & I & I & X & X & I & I & I & I & I & I \\
    X & I & X & I & X & I & X & I & X & I & X & I & X & I & X & I & I & I & I & I \\
    I & I & I & I & X & X & I & I & X & I & X & I & I & X & X & I & X & X & I & I \\
    I & I & I & I & X & I & X & I & I & X & X & I & X & X & I & I & X & I & X & I
  \end{smallmatrix}~.
  \end{align}
  Rows 1--5 are the \(Z\)-type outer stabilizers of each \([[4,2,2]]\) block; rows 6--9 are the lifted inner \(Z\)-type stabilizers; rows 10--14 are the \(X\)-type outer stabilizers; rows 15--18 are the lifted inner \(X\)-type stabilizers.
  This code is equivalent, up to qubit permutations and single-qubit Clifford gates, to three \([[20,2,6]]\) self-dual CSS codes in QECDB \cite[ID 672e6e9c34d5954e0cb7d1b7]{preset:QECDB}\cite[ID 67a388ef9d65c7b409826879]{preset:QECDB}\cite[ID 67a3890a9d65c7b40982687b]{preset:QECDB}.

protection: |
  Detects errors on up to 5 qubits and corrects errors on up to 2 qubits.

features:
  encoders:
    - 'Non-fault-tolerant encoding circuits \cite{arxiv:2605.15344}.'
  transversal_gates:
    - 'Logical CNOT gates in both directions between the two logical qubits are realized by qubit permutations within a code block \cite{arxiv:2601.20927,arxiv:2605.15344}.'
    - 'Fold-diagonal logical \(SS\) gates are available from the self-duality of the inner \([[5,1,3]]_4\) code and the outer \([[4,2,2]]\) layer \cite{arxiv:2601.20927}.'
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2510.18753,arxiv:2601.20927,arxiv:2606.13521,arxiv:2608.05688}.'

  fault_tolerance:
    - 'Selective state filtering (post-selection): logical error rates of \(\approx 2\times 10^{-6}\) per round of Steane-style error correction at physical error rate \(p=10^{-3}\), without being fully fault-tolerant \cite{arxiv:2605.15344}.'

