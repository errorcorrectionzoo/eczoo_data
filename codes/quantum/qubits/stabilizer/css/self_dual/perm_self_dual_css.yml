code_id: perm_self_dual_css
physical: qubits
logical: qubits

name: 'Permutationally self-dual (PSD) CSS code'
short_name: 'PSD'

alternative_names:
  - 'PSD CSS code'
  - 'em-symmetric CSS code'
  - 'XZ-dual CSS code'
  - 'Self-ZX-dual CSS code'
  - 'CSS code admitting a ZX duality'

description: |
  A qubit CSS code whose \(X\)- and \(Z\)-type stabilizer groups are exchanged by a permutation of the physical qubits.
  Equivalently, a qubit CSS code for which transversal Hadamard followed by a qubit permutation is a logical operation.

  Let \(C_X\) and \(C_Z\) be the \(X\)- and \(Z\)-type stabilizer spaces of an \([[n,k]]\) CSS code.
  The code is \textit{permutationally self-dual} (PSD) iff there is a permutation \(\pi \in S_n\) with \(\pi(C_X)=C_Z\) and \(\pi(C_Z)=C_X\), equivalently iff the physical operator \(U_\pi H^{\otimes n}\) preserves the stabilizer group \cite{arxiv:2609.19250}.
  Such a \(\pi\) is called an \(XZ\)-duality \cite{arxiv:2202.06647}, and the code is also called em-symmetric \cite{arxiv:2607.21160}.

features:
  transversal_gates:
    - 'An \(XZ\)-duality yields Hadamard-type and phase-type fold-transversal Clifford gates, each realized by one layer of physical Clifford gates together with one qubit permutation \cite{arxiv:2202.06647}.'
    - 'A qubit permutation composed with transversal Hadamard is a logical Clifford gate. In any CSS logical basis, every such self-duality automorphism induces a pure exchange-type logical Clifford, i.e. one whose symplectic representation has vanishing diagonal blocks \cite[Prop. 1]{arxiv:2609.19250}.'
    - 'Permutational self-duality is necessary for exchange-type logical actions. An indecomposable CSS code can host logical \(H^{\otimes k}\), \((SH)^{\otimes k}\), \((HS)^{\otimes k}\), or any mixture of these up to composition with logical \(S\), CX and CZ circuits, implemented by single-qubit Cliffords and qubit permutations in a CSS logical basis, only if the code is PSD \cite{arxiv:2609.19250}.'
    - 'For an indecomposable PSD-but-not-self-dual code, the logical group generated by single-qubit Cliffords and qubit permutations is \(\mathrm{Trans} \rtimes \mathrm{Perm}.2\) \cite{arxiv:2609.19250}.'
    - 'For an indecomposable PSD-but-not-self-dual code, transversal single-qubit Cliffords realize at most \(\mathcal{U}(2\lfloor k/2 \rfloor,2)^2\), acting on two disjoint halves of the logical qubits, so their number is at most \(2^{\lfloor k/2 \rfloor(\lfloor k/2 \rfloor+1)}\) \cite{arxiv:2609.19250}.'
    - 'Qubit permutations of a PSD code realize a logical group that preserves a flag of subspaces of \(\mathbb{F}_2^k\). If the all-ones vector lies in \(C_X+C_Z\), then \(n\), \(k\), and \(k-2m\) are even, where \(m\) measures how far the two stabilizer spaces are from coinciding \cite{arxiv:2609.19250}.'

relations:
  parents:
    - code_id: qubit_css
      detail: 'Permutationally self-dual CSS codes are qubit CSS codes whose stabilizer group is preserved by transversal Hadamard composed with a qubit permutation.'
  cousins:
    - code_id: dual
      detail: 'The \(X\)- and \(Z\)-type stabilizer spaces of a permutationally self-dual CSS code are permutation-equivalent binary linear codes.'


