code_id: lhz
physical: qubits
logical: qubits

name: 'Lechner-Hauke-Zoller (LHZ) code'
short_name: 'LHZ'
introduced: '\cite{doi:10.1126/sciadv.1500838,arxiv:1511.00004,arxiv:2205.09505}'

alternative_names:
  - 'Lechner-Hauke-Zoller (LHZ) parity code'
  - 'Parity-encoding code'
  - 'Complete-graph CSS code'

description: |
  A \([[k(k+1)/2,k]]\) QLDPC CSS code whose physical qubits store logical bits and their pairwise parities.
  It was originally designed to convert the long-range interactions of a quantum annealer into local constraints \cite{doi:10.1126/sciadv.1500838,arxiv:1511.00004}.
  Diagonal logical gates become physical single-qubit \(Z\)-rotations at arbitrary angle \cite{arxiv:2205.09505}.

  Its stabilizer group is generated by \(Z\)-type parity constraints, and each logical \(X\) operator is supported on a \textit{logical line}, the set of all physical qubits whose label contains a given logical index.
  The code becomes a universal quantum computing architecture once a row of \textit{data qubits}, one per logical qubit, is added \cite{arxiv:2205.09505}.
  An extension maps more general models onto the same lattice \cite{arxiv:2105.06233}.

  For \(k\) logical qubits, the layout with data qubits consists of one data qubit per logical qubit and one parity qubit per pair of logical qubits \cite{arxiv:2205.09505,arxiv:2609.19250}.
  The data qubit \((i)\) satisfies \(\overline{Z}_i = Z_i\), while the parity qubit \((ij)\) satisfies \(\overline{Z}_i\overline{Z}_j = Z_{ij}\).
  The stabilizer group is generated by the \(k(k-1)/2\) weight-three checks \(Z_i Z_j Z_{ij}\), one per pair of logical qubits.
  Physical qubits can be identified with the vertices and edges of the complete graph \(K_k\), with one check per edge \cite{arxiv:2609.19250}.
  The original formulation \cite{doi:10.1126/sciadv.1500838} contains only parity qubits, and is the same code with one fewer logical qubit.
  Fixing a reference logical index and identifying each parity qubit whose label contains that index with a data qubit maps the two formulations onto each other.


protection: |
  The \(X\)-distance is the number of physical qubits in the shortest logical line, which is \(k\) for the layout with data qubits \cite{arxiv:2205.09505}.
  Up to \(\lfloor (d_x-1)/2 \rfloor\) simultaneous bit-flip errors can be corrected \cite{arxiv:2205.09505}.
  Every logical \(Z\) operator has a weight-one representative on a data qubit, so phase errors are not protected.

features:
  encoders:
    - 'Arbitrary quantum states \cite{arxiv:2303.08602}.'
    - 'Parity qubits are added or removed one at a time by two CNOT gates from the qubits of the corresponding constraint \cite{arxiv:2205.09505}. This allows partial encoding and decoding during a computation, and switching between layouts with different numbers of parity qubits \cite{arxiv:2205.09505}.'
    - 'Any \(k\)-qubit graph state can be prepared in the LHZ encoding in circuit depth at most \(k+3\) with \(2k(k-1)\) CNOT gates \cite{arxiv:2205.09517}.'
    - 'Encoding circuit of depth \(k+1\), obtained by commuting and cancelling the CNOT gates of the iterative procedure \cite{arxiv:2205.09505}. The reversed sequence decodes.'

  transversal_gates:
    - 'Logical operators are \(\overline{Z}_i = Z_i\) and \(\overline{X}_i = \prod_{A \ni i} X_A\), the product running over every physical qubit whose label contains \(i\).'
    - 'Diagonal logical gates are physical single-qubit \(Z\)-rotations at arbitrary angle \cite{arxiv:2205.09505}. A rotation on the parity qubit \((ij)\) is a logical two-qubit diagonal rotation on logical qubits \(i\) and \(j\). The logical controlled-phase gate is the depth-one product \(\overline{\mathrm{CP}}^{(i,j)}_{\phi}=R_z^{(i)}(\phi/2)R_z^{(ij)}(-\phi/2)R_z^{(j)}(\phi/2)\) \cite{arxiv:2205.09505}.'
    - 'One layer of physical \(S\) gates and their powers realizes every addressable logical \(S\) and CZ gate, with \(\overline{S}_i=S_i\) and \(\overline{\mathrm{CZ}}_{ij}=S_i S_j S_{ij}^{\dagger}\) \cite{arxiv:2609.19250}. The code thus realizes the full group \(\mathcal{U}(2k,2)=\langle S_k,\mathrm{CZ}_k\rangle\) of addressable diagonal Clifford gates by transversal single-qubit Clifford gates, at the minimum possible block length \(n=k(k+1)/2\), of \hyperref[topic:asymptotics]{order} \(\Theta(k^2)\) \cite{arxiv:2609.19250}.'

  general_gates:
    - |
      Logical \(X\)-rotations use a chain of \(2(k-1)\) CNOT gates along a logical line together with one physical \(X\)-rotation \cite{arxiv:2205.09505,arxiv:2205.09517}.
      The circuit depth is \(2\lceil k/2 \rceil+1\) for \(k>4\) \cite{arxiv:2205.09505}.
      Together with logical \(Z\)-rotations and controlled-phase gates, they form a universal gate set \cite{arxiv:2205.09505}.

  decoders:
    - 'BP decoder \cite{arxiv:1511.00004}.'


relations:
  parents:
    - code_id: complete_hypergraph_css
      detail: 'The LHZ code is the rank-two member of the complete-hypergraph CSS code family, storing the parity of every pair of logical qubits \cite{arxiv:2609.19250}.'
    - code_id: qldpc
      detail: 'The LHZ code has weight-three and weight-four \(Z\)-type parity checks arranged on a square lattice, with each physical qubit participating in at most four of them \cite{doi:10.1126/sciadv.1500838,arxiv:2205.09505}.'


