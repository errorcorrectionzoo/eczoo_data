code_id: mapping_cone
physical: qubits
logical: qubits

name: 'Mapping cone code'
introduced: '\cite{arxiv:2507.05361}'

alternative_names:
  - 'Height-\(n\) cone code'

description: |
  A CSS code obtained from an input CSS code, called the \textit{embedded code}, by adding physical qubits and parity checks in a way that guarantees a natural isomorphism between the logical operators of the input and output codes.
  The framework unifies various quantum code embedding procedures, including code concatenation, \hyperref[topic:weight-reduction]{weight reduction}, layer codes, geometrically local codes obtained by subdivision, and gauging-based fault-tolerant logical measurement \cite{arxiv:2507.05361}.

  Formally, a \textit{height-\(n\) cone} is a chain complex \(C\) whose spaces decompose into direct sums, \(C_i = C_i^n \oplus C_i^{n-1} \oplus \cdots \oplus C_i^0\), with a boundary operator that is lower triangular with respect to the decomposition.
  The diagonal blocks \(\partial^s\) define chain complexes \(C^s\) called the \textit{levels} of the cone, while the sub-diagonal blocks \(g_s\), called \textit{gluing maps}, induce maps on homology that assemble the level homologies into the embedded complex \(H_n(\partial^n) \to H_{n-1}(\partial^{n-1}) \to \cdots \to H_0(\partial^0)\).
  If the levels have trivial homology away from the appropriate degrees, a condition called \textit{regularity}, then the logical operators of the cone are naturally isomorphic to those of the embedded code \cite{arxiv:2507.05361}.
  The construction is an iterated application of the mapping cone of homological algebra.
  

protection: |
  A cleaning lemma bounds the \(Z\)-distance of a height-2 cone from below \cite[Sec. I.B]{arxiv:2507.05361}.
  It applies when the top-level boundary operator and the gluing map \(g_2\) satisfy an isoperimetric inequality with coefficient \(\alpha\).
  The \(Z\)-distance is then at least \(\alpha\) times the minimum weight of a middle-level representative of a nontrivial logical operator of the embedded code.
  The lemma yields distance bounds for subdivided square complexes \cite[Sec. IV.B]{arxiv:2507.05361}.
  For gauging-based logical measurement, the lemma shows that the \(Z\)-distance of the cone is at least \(\min(h,1)\) times that of the input code \cite[Sec. V.A]{arxiv:2507.05361}.
  Here, \(h\) is the Cheeger constant of the connected graph used to build the cone.


relations:
  parents:
    - code_id: qubit_css
      detail: 'A mapping cone code is a qubit CSS code equipped with a direct-sum decomposition of its chain complex into levels, with lower-triangular boundary operator, such that the associated embedded code has naturally isomorphic logical operators.'
  cousins:
    - code_id: qubit_concatenated
      detail: 'The mapping cone framework can be regarded as a generalization of code concatenation for CSS codes \cite{arxiv:2507.05361}.'
    - code_id: distance_balanced
      detail: 'The coning step of the \hyperref[topic:weight-reduction]{weight reduction} procedure of Ref. \cite{arxiv:2102.10030} is a height-1 cone \cite[Sec. V.A]{arxiv:2507.05361}. The triangulation and thickening steps used in this procedure are regular height-2 cones \cite[Sec. V.B]{arxiv:2507.05361}.'
    - code_id: good_qldpc
      detail: 'Optimal embeddings of good QLDPC codes into \(D\)-dimensional Euclidean space use layer codes \cite{arxiv:2309.16503} or subdivided square complexes \cite{arxiv:2309.16104}. Both constructions yield regular height-2 cones whose embedded code is the input code \cite[Sec. IV]{arxiv:2507.05361}.'
    - code_id: surface
      detail: 'Surface codes on honeycomb and triangular lattices, with periodic or alternating smooth and rough boundaries, are regular cones whose embedded code is the square-lattice surface code \cite[Sec. III.A]{arxiv:2507.05361}. The planar surface code cannot be realized by any 2D CW complex \cite[Sec. I]{arxiv:2507.05361}.'
    - code_id: higher_dimensional_surface
      detail: 'The barycentric subdivision of an \(n\)-dimensional simplicial complex is a regular height-\(n\) cone whose embedded complex is the original complex \cite[Sec. III.B]{arxiv:2507.05361}. The homological codes of the two complexes therefore have isomorphic logical operators.'
    - code_id: qldpc
      detail: 'Gauging-based logical measurement for QLDPC codes \cite{arxiv:2410.02213} is a regular height-1 cone built from a connected graph \cite[Sec. V.A]{arxiv:2507.05361}. The \(Z\)-type logical operators of this cone are those of the input code modulo the measured one \cite[Sec. V]{arxiv:2507.05361}. Homological measurement is also formulated using height-1 cones \cite{arxiv:2410.02753,arxiv:2507.05361}.'


