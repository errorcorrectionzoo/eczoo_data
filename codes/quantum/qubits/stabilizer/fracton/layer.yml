code_id: layer
physical: qubits
logical: qubits

name: 'Layer code'
introduced: '\cite{arxiv:2309.16503}'

description: |
  Member of a family of geometrically local 3D qubit QLDPC codes obtained by coupling layers of 2D surface codes according to the check-qubit incidence structure of an input QLDPC code.
  Geometric locality is maintained because, instead of being concatenated, each pair of parallel surface-code squares is fused (or quasi-concatenated) with perpendicular surface-code squares via lattice surgery.

  The original CSS construction has stabilizer-generator weight at most six \cite{arxiv:2309.16503}.
  The \hyperref[code:symplectic_cone]{symplectic cone} framework extends the construction to non-CSS QLDPC inputs.
  For an input code of \(n\) qubits and \(n_S\) checks, the output lies in a 3D grid \([n_S]\times[O(wq)n]\times[n_S]\) with at most three qubits per edge.
  Its maximum stabilizer-generator weight is nine, its total qubit degree is at most eight, and its distance is \hyperref[topic:asymptotics]{order} \(\Omega(n_S/(wq))\) times the input distance, where \(w\) and \(q\) are the input check weight and total qubit degree \cite[Thm. 43]{arxiv:2608.16995}.
  The generalization also applies to the 4D and 5D layer codes \cite{arxiv:2605.18961,arxiv:2608.16995}.


features:
  rate: 'Layer codes achieve the 3D \hyperref[topic:bpt-bound]{BPT bound}, with parameters \([[n,\Theta(n^{1/3}),\Theta(n^{2/3})]]\), when asymptotically good QLDPC codes are used in the construction.'

  decoders:
    - 'Decoders against stochastic and adversarial noise \cite{arxiv:2510.06659}.'

relations:
  parents:
    - code_id: symplectic_cone
      detail: 'Layer codes are height-2 symplectic cones whose embedded column complex is the input QLDPC code; CSS Layer codes reduce to ordinary mapping cones, while the non-CSS construction uses a defect map to preserve symplectic commutation \cite{arxiv:2507.05361,arxiv:2608.16995}.'
    - code_id: qldpc
      detail: 'Layer codes are QLDPC codes constructed by coupling layers of 2D surface codes according to the check-qubit incidence structure of a QLDPC input code \cite{arxiv:2309.16503,arxiv:2608.16995}.'
  cousins:
    - code_id: mapping_cone
      detail: 'CSS Layer codes are height-2 mapping cones whose levels are stacks of 2D surface codes and whose string defects implement the chain homotopy; non-CSS Layer codes require the symplectic cone generalization \cite{arxiv:2507.05361,arxiv:2608.16995}.'
    - code_id: topological_abelian
      detail: 'The Layer code realizes 2D layers of \(\mathbb{Z}_2\) gauge theory coupled along defects.'
    - code_id: fracton
      detail: 'Layer codes are non-translation invariant 3D lattice stabilizer codes that can be viewed as fracton topological defect networks \cite{arxiv:2309.16503}.'
    - code_id: good_qldpc
      detail: 'Layer codes achieve the 3D \hyperref[topic:bpt-bound]{BPT bound}, with parameters \([[n,\Theta(n^{1/3}),\Theta(n^{2/3})]]\), when asymptotically good QLDPC codes are used in the construction.'
    - code_id: qubit_concatenated
      detail: 'Each pair of surface-code squares in a layer code is fused (or quasi-concatenated) with perpendicular surface-code squares via lattice surgery.'
    - code_id: self_correct
      detail: 'The energy barrier of excitations for layer codes constructed using asymptotically good QLDPC codes scales as \hyperref[topic:asymptotics]{order} \(\Theta(n^{1/3})\) \cite{arxiv:2309.16503}. Layer codes are partially self-correcting quantum memories \cite{arxiv:2510.06659,arxiv:2510.09218}. Layer codes constructed from random CSS codes have near-optimal scaling of code parameters and a polynomial energy barrier, exhibiting behavior consistent with partial self-correction \cite{arxiv:2510.06659}.'


