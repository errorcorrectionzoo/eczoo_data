code_id: css-t
physical: qubits
logical: qubits

name: 'CSS-T code'
introduced: '\cite{arxiv:2001.04887}'

description: |
  A CSS code for which a physical transversal \(T\) gate is either the identity (up to a global phase) or a logical gate.
  CSS-T codes are constructed from a pair of linear binary codes via the CSS construction, with the pair satisfying certain conditions \cite{arxiv:2312.17518}.

  The \(X\)-type stabilizers come from \(C_2\), the \(Z\)-type stabilizers from \(C_1^{\perp}\) with \(C_2\subseteq C_1\), and a character vector \(y\) fixes the \(Z\)-type stabilizer signs.
  The pair must satisfy \(C_2 * C_1\subseteq C_1^{\perp}\), where \(*\) is the entrywise product \cite{arxiv:2312.17518}\cite[Cor. 15]{arxiv:2601.08568}.
  This condition is not sufficient: a pair of length-36 codes satisfies it but yields no CSS-T code for any \(y\) \cite[Ex. 16]{arxiv:2601.08568}.
  Doubling any CSS code, i.e., repeating \(C_1\) and \(C_2\) twice, with \(y\) all ones on one copy and all zeros on the other, yields a CSS-T code whose transversal \(T\) gate realizes the logical identity \cite[Lemma 19]{arxiv:2601.08568}.

notes:
  - 'A database of CSS-T codes is available in QECDB \cite{preset:QECDB}.'

features:
  rate: |
    Asymptotically good CSS-T codes exist \cite{arxiv:2412.08586}.
    Puncturing, shortening, and doubling asymptotically good doubly even self-dual codes yields asymptotically good CSS-T codes in which the transversal \(T\) gate realizes the logical transversal \(S^{\dagger}\) gate \cite[Thm. 11]{arxiv:2601.08568}.
    These codes are not LDPC \cite[Rem. 9]{arxiv:2601.08568}.
  transversal_gates:
    - 'A physical transversal \(T\) gate is either the identity (up to a global phase) or a logical gate \cite{arxiv:1910.09333}.'
    - |
      The transversal \(T\) gate realizes the logical identity iff \(\operatorname{wt}(w)-2\operatorname{wt}(w*y)\equiv 0\pmod 8\) for every coset representative \(w\) of \(C_1/C_2\) \cite[Thm. 17]{arxiv:2601.08568}\cite[Lemma 3]{arxiv:2204.13176}.
      It realizes the logical transversal \(T\) gate without Clifford correction iff \(\operatorname{wt}(w_a)-2\operatorname{wt}(w_a*y)\equiv\operatorname{wt}(a)\pmod 8\) for every \(a\in\mathbb{F}_2^k\), where \(w_a=\bigoplus_{i} a_i w_i\) for a basis \(w_1,\dots,w_k\) of \(C_1/C_2\) \cite[Thm. 18]{arxiv:2601.08568}\cite[Thm. 5]{arxiv:2204.13176}.

relations:
  parents:
    - code_id: weakly_divisible_css
      detail: |
        CSS-T codes are weakly eight-divisible CSS codes that satisfy the stronger coset-divisibility condition at \(\Delta=8\).
        A strongly transversal \(T\) gate preserves the code space if and only if \(\operatorname{wt}(x)-2\operatorname{wt}(x*z)\equiv0\pmod 8\) for every \(x\in C_2\) and every \(z\in C_1+y\) \cite[Thm. I.1]{arxiv:2408.12752}.
        Here \(*\) is the entrywise product and \(y\) is the character vector.
        The identity \(\operatorname{wt}(x+z)-\operatorname{wt}(z)=\operatorname{wt}(x)-2\operatorname{wt}(x*z)\) makes this coset divisibility at \(\Delta=8\).
  cousins:
    - code_id: binary_linear
      detail: 'CSS-T codes are constructed from a pair of linear binary codes via the CSS construction, with the pair satisfying certain conditions \cite{arxiv:2312.17518}.'
    - code_id: binary_cyclic
      detail: 'Binary cyclic and extended cyclic codes can be used to construct CSS-T codes via the CSS construction \cite{arxiv:2312.17518}.'
    - code_id: quantum_reed_muller
      detail: 'Certain quantum RM codes are CSS-T codes \cite{arxiv:2305.06423,arxiv:2310.16504,arxiv:2312.17518}.'


