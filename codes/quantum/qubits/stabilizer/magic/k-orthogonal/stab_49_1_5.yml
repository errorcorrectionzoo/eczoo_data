code_id: stab_49_1_5
physical: qubits
logical: qubits

name: '\([[49,1,5]]\) triorthogonal code'
introduced: '\cite[Appx. B]{arxiv:1209.2426}'

description: |
  Triorthogonal and quantum divisible code which is the smallest distance-five stabilizer code to admit a transversal \(T\) gate \cite{arxiv:1012.4134}\cite[Appx. B]{arxiv:1209.2426}.
  It is one example of a level-three generalized divisible code obtainable from the doubling transformation \cite[Sec. VI.D]{arxiv:1709.08658}.
  Its \(X\)-type stabilizers form a triply even linear binary code in the \hyperref[topic:binary-symplectic-representation]{symplectic representation}.

features:
  magic_scaling_exponent: 'The code yields an exponent \(\gamma = \log 49 / \log 5 \approx 2.42\).'

  transversal_gates:
    - 'The code admits a transversal \(T\) gate \cite[Appx. B]{arxiv:1209.2426}.'


relations:
  parents:
    - code_id: quantum_triorthogonal
    - code_id: quantum_divisible
      detail: 'The \(X\)-type stabilizer space of the \([[49,1,5]]\) triorthogonal code is triply even, and its logical generator is the all-ones vector \cite[Appx. B]{arxiv:1209.2426}.
      The choice \(t=(1,\ldots,1)\) makes the joint matrix satisfy the level-three quantum divisible conditions \cite[Sec. VI.D]{arxiv:1709.08658}.'
    - code_id: css-t
      detail: 'The two logical cosets of the \([[49,1,5]]\) code have weights congruent to zero and one modulo eight, respectively, because the \(X\)-type stabilizer space is triply even and the logical generator is the all-ones vector.
      A strongly transversal \(T\) gate therefore realizes a logical \(T\) gate with trivial Clifford correction \cite[Appx. B]{arxiv:1209.2426}.'
    - code_id: small_distance_qubit_stabilizer
  cousins:
    - code_id: doubled_color
      detail: 'The \([[49,1,5]]\) triorthogonal code can be viewed as a (gauge-fixed) doubled color code obtained from the \([[17,1,5]]\) 4.8.8 color code via the doubling transformation \cite{arxiv:1509.03239}.'
    - code_id: stab_17_1_5
      detail: 'The \([[49,1,5]]\) triorthogonal code can be viewed as a (gauge-fixed) doubled color code obtained from the \([[17,1,5]]\) 4.8.8 color code via the doubling transformation \cite{arxiv:1509.03239}.'
    - code_id: divisible
      detail: 'The \([[49,1,5]]\) triorthogonal code stabilizer generator matrix can be obtained from a triply even linear binary code \cite[Appx. B]{arxiv:1209.2426}.'


