code_id: quantum_k-orthogonal
physical: qubits
logical: qubits

name: '\(k\)-orthogonal code'
introduced: '\cite{arxiv:1503.08800,arxiv:1906.11394,arxiv:2210.14066}'
# 1906.11394 also defines ell-orthogonal

description: |
  Qubit stabilizer code for which the binary space \(S_X\) of \(X\) components of stabilizers is \(k\)-orthogonal in the \hyperref[topic:binary-symplectic-representation]{symplectic representation}.
  In other words, the overlap of any \(j\) vectors in \(S_X\) is even for every \(1\leq j\leq k\) \cite[Def. 4]{arxiv:2210.14066}.
  This definition applies to general qubit stabilizer codes and does not require a CSS presentation.
  This entry is formulated for qubits, but an extension exists for modular qudits \cite{arxiv:1503.08800}.

  Equivalently, a generator matrix for \(S_X\) is \(k\)-orthogonal if
  \begin{align}
    |x^1|&\equiv 0 \mod 2 \\
    |x^1\cdot x^2|&\equiv 0 \mod 2 \\
    |x^1\cdot x^2\cdot x^3|&\equiv 0 \mod 2 \\
    &\vdots \\
    |x^1\cdot x^2\cdot x^3\cdot\ldots\cdot x^k|&\equiv 0 \mod 2 
  \end{align}
  for all vectors \(x^j\) in its row space, where the generalized dot-product notation means a sum of products of the respective coordinates of all vectors.
  
features:
  transversal_gates:
    - 'For every fixed \(k\geq 3\), there exist explicit asymptotically good binary CSS codes with a \(k\)-orthogonal generator matrix for which \(R_k^{\otimes N}\), where \(R_k=\operatorname{diag}(1,e^{2\pi i/2^k})\), followed by a diagonal correction from the \((k-1)\)st level of the Clifford hierarchy, acts as logical \(\overline{R}_k^{\otimes K}\) \cite[Cor. 5.6]{arxiv:2609.08203}.'
    - 'There also exist explicit asymptotically good binary CSS codes with \(2^{k-1}\)-orthogonal generator matrices for which \(R_k^{\otimes N}\) acts directly as logical \(\overline{R}_k^{\otimes K}\), without a subsequent correction \cite[Cor. 6.7]{arxiv:2609.08203}.'

relations:
  parents:
    - code_id: qubit_stabilizer
  cousins:
    - code_id: qudit_color
      detail: 'The notion of \(k\)-orthogonality can be extended to modular-qudit codes and is known as \(k^{\star}\)-orthogonality \cite[Def. 2]{arxiv:1503.08800}.
      Modular-qudit lattice color codes defined on lattices in \(D\) spatial dimension whose \(X\)-type stabilizers are placed on cells of dimension \(\nu \leq D\) are \(k^{\star}\)-orthogonal for all \(k \leq \nu\) \cite[Lemma 5]{arxiv:1503.08800}.'


