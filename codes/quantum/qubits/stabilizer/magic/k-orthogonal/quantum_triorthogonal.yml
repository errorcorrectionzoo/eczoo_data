code_id: quantum_triorthogonal
physical: qubits
logical: qubits

name: 'Triorthogonal code'
introduced: '\cite[Secs. III-IV]{arxiv:1209.2426}'

description: |
  Qubit CSS code whose \(X\)-type logicals and stabilizer generators form a triorthogonal matrix (defined below) in the \hyperref[topic:binary-symplectic-representation]{symplectic representation}.
  A \textit{generalized triorthogonal} code keeps every overlap involving a stabilizer row even but allows odd overlaps among its logical rows, which realize diagonal non-Clifford gates other than \(T\) \cite[Appx. D]{arxiv:1606.01904}\cite[Sec. 2.3]{arxiv:1709.02832}.

  An \(m \times n\) binary matrix is triorthogonal if its rows \(r_1, \ldots, r_m\) satisfy \(|r_i \cdot r_j| = 0\) and \(|r_i \cdot r_j \cdot r_k| = 0\) modulo \(2\), with binary addition and multiplication.
  The triorthogonal CSS code associated with the matrix is constructed by mapping nonzero entries in even-weight rows to \(X\)-type stabilizer generators, odd-weight rows to \(X\)-type logical operators, and \(Z\) operators for each row in the orthogonal complement.

  The parities of the weights, pair overlaps, and triple overlaps of the logical rows form a symmetric trilinear form \cite[Sec. 2.3]{arxiv:1709.02832}\cite{arxiv:2609.30860}.
  This form determines the logical gate realized by transversal \(T\) up to a diagonal Clifford correction, namely a product of \(T\), \(CS\), and \(CCZ\) gates on the logical qubits \cite{arxiv:2609.30860}.
  A CSS code with three logical qubits realizes a logical \(CCZ\) gate by \(T^{\otimes n}\) followed by a diagonal Clifford correction if and only if it is generalized triorthogonal with a particular logical block \cite[Thm. 3.3]{arxiv:2610.09341}.
  The logical rows must have even weight, even pair overlaps, and odd triple overlap.
  These are the nine \textit{Campbell-Howard conditions} \cite{arxiv:1606.01904}.

protection: |
  Weight \(t\) Pauli errors, where \(t\) depends on the family. For example, Ref. \cite[Sec. VII]{arxiv:1209.2426} provides a family of distance \(2\) codes.

  Generalized triorthogonal matrices with at most seven rows yield \(T\)-to-\(T\) distillation protocols of distance at most three and \(T\)-to-\(CCZ\) protocols of distance at most two \cite[Sec. V]{arxiv:2606.07734}.

features:
  encoders:
    - 'Encoder for magic states for the code constructed in \cite{arxiv:1209.2426}.'

  transversal_gates:
    - 'Transversal action of \(T\) gates on all qubits, followed by a particular pattern of \(CZ\) and \(S\) gates, will realize a logical \(T\) gate \cite[Lemma 2]{arxiv:1209.2426}\cite[Rem. I.2.2]{arxiv:2408.12752}. When an additional condition on logical-\(X\) operators is satisfied, the \(CZ\) and \(S\) gates are no longer necessary \cite[Thm. 14]{arxiv:1910.09333}.'
    - 'Triorthogonality is necessary but not sufficient for physical transversal \(T\) gates on each qubit to realize the identity logical gate \cite[Thm. 12]{arxiv:1910.09333}.'
    - 'Certain codes realize controlled-controlled-\(Z\) gates \cite{arxiv:1304.3709}, realized via physical \(CCZ\) gates on three code blocks.'
    - 'Triorthogonal codes realizing logical \(T\) gates using only physical \(T\) gates can be paired up with self-dual CSS codes to yield a transversal CNOT gate \cite{arxiv:2510.05708}.'

  decoders:
    - 'Steane error correction \cite{arxiv:2510.05708}.'

  fault_tolerance:
    - 'Universal fault-tolerant gates can be performed without magic-state distillation \cite{arxiv:1304.3709,arxiv:2210.14074}.'
    - 'Universal fault-tolerant gates can be achieved by pairing with a self-dual CSS code and using Steane error correction \cite{arxiv:2510.05708}.'

notes:
  - 'Reference \cite{arxiv:2107.09684} presents a classification of triorthogonal codes up to \(n + k \leq 38\) by associating each triorthogonal code with a RM code polynomial.'
  - 'Reference \cite{arxiv:2609.30860} classifies generalized triorthogonal codes with \(n\leq54\) and \(d_Z\geq3\) through a classification of unital triorthogonal spaces, i.e., triorthogonal binary spaces containing the all-ones vector.
  See Ref. \cite[Table II]{arxiv:2609.30860} for the resulting Pareto-optimal distillation protocols and \href{https://doi.org/10.6084/m9.figshare.33717319}{Figshare} for their matrices.'
  - 'See Ref. \cite[Tables I and II]{arxiv:2606.07734} for tables of single-output \(T\)- and \(CCZ\)-state distillation protocols.'
  - 'See Ref. \cite[Table 3]{arxiv:2610.09341} for codes with a \(T/T^\dagger\) logical \(CCZ\) gate whose \(X\)-type stabilizer columns are subspace complements in \(PG(s-1,2)\) for \(s\leq9\).'
  - 'A database of triorthogonal codes is available in QECDB \cite{preset:QECDB}.'

relations:
  parents:
    - code_id: quantum_k-orthogonal
      detail: 'The \(X\)-type stabilizer space of a triorthogonal code is 3-orthogonal.
      Triorthogonal codes additionally have a CSS presentation with logical-\(X\) rows whose pair and triple overlaps with the stabilizer rows are even \cite[Secs. III-IV]{arxiv:1209.2426}\cite[Sec. 2.3]{arxiv:1709.02832}.'
  cousins:
    - code_id: qudit_triorthogonal
      detail: 'Prime-qudit triorthogonal codes reduce to triorthogonal codes when \(p=2\).
      Generalized triorthogonal codes with odd overlaps among their logical rows lie outside the prime-qudit definition.'
    - code_id: quantum_reed_muller
      detail: 'Classification of triorthogonal codes yields a connection to RM code polynomials \cite{arxiv:2107.09684}.'
    - code_id: self_dual
      detail: 'Self-dual binary codes can be used to construct triorthogonal codes \cite{arxiv:2408.09685}.'
    - code_id: css-t
      detail: 'Triorthogonal and CSS-T codes overlap, but neither is a subset of the other \cite{arxiv:2408.12752}. CSS-T codes reduce to triorthogonal codes when the logical action of the physical transversal \(T\) gate is a logical \(T\) gate on all encoded qubits. Triorthogonality is necessary for physical transversal \(T\) gates on each qubit to realize the identity logical gate \cite[Thm. 12]{arxiv:1910.09333}. The \(X\)-type stabilizer generator matrix for a CSS-T code is always triorthogonal \cite[Corr. 5]{arxiv:2312.17518}.'


