code_id: stab_47_3_3
physical: qubits
logical: qubits

name: '\([[47,3,3]]\) \(CCZ\) distillation code'
introduced: '\cite[Sec. V.C]{arxiv:2606.07734}'

# The shortening statement at the end of the description was verified by computation on the matrices of arXiv:2606.07734, App. D; it is not stated in the papers.
description: |
  A \([[47,3,3]]\) generalized triorthogonal CSS code that distills a \(CCZ\) magic state from 47 noisy \(T\) states at distance three \cite[Sec. V.C]{arxiv:2606.07734}.
  Its columns come from a nine-qubit circuit of 47 \(Z\)-type Pauli-product \(\pi/8\) rotations that implements \(CCZ\) \cite[Sec. V.C]{arxiv:2606.07734}.
  One of the three \(CCZ\) qubits is encoded in a seven-qubit phase-flip repetition code \cite[Secs. III.D and V.C]{arxiv:2606.07734}.
  It is the smallest known CSS code with three logical qubits, \(d_Z\geq3\), and a quasi-transversal \(CCZ\) gate \cite{arxiv:2610.09341}.

  Its generalized triorthogonal matrix has three logical rows and six \(X\)-type stabilizer rows with distinct nonzero stabilizer columns, and it satisfies the nine Campbell-Howard conditions \cite[App. D]{arxiv:2606.07734}\cite[Ex. 3.7]{arxiv:2610.09341}.

  The same construction yields a 48-qubit code with three logical qubits and seven \(X\)-type stabilizer generators whose \(CCZ\)-state distillation protocol has distance four and output error \(2816p^4\) \cite[Sec. V.C and App. D]{arxiv:2606.07734}.
  The \([[47,3,3]]\) code is a shortening of this \([[48,3,4]]\) code.

protection: |
  Distance three, with \(d_X=16\) and \(d_Z=3\) \cite[Ex. 3.7]{arxiv:2610.09341}.
  No CSS code with three logical qubits, \(d_Z\geq3\), and a quasi-transversal \(CCZ\) gate exists for \(n\leq38\) \cite[Thm. 4.5]{arxiv:2610.09341}.
  Its \(T\)-count 47 and nine matrix rows form the only Pareto-optimal point for distance-three \(CCZ\)-state distillation among generalized triorthogonal codes with \(n\leq54\) \cite[Table II]{arxiv:2609.30860}.

features:
  transversal_gates:
    - 'Logical \(CCZ\) gate from physical \(T\) gates followed by a diagonal Clifford correction \cite[Ex. 3.7]{arxiv:2610.09341}. No pattern of single-qubit \(T\) and \(T^\dagger\) gates implements the logical \(CCZ\) gate, so the correction must contain entangling \(CZ\) gates \cite[Ex. 3.7]{arxiv:2610.09341}.'

  general_gates:
    - 'Output error \(236p^3\) for input error \(p\) \cite[Sec. V.C]{arxiv:2606.07734}.'

relations:
  parents:
    - code_id: quantum_triorthogonal
      detail: 'The \([[47,3,3]]\) \(CCZ\) distillation code is a generalized triorthogonal code \cite[Ex. 3.7]{arxiv:2610.09341}.
      Its three logical rows have even weight, even pair overlaps, and odd triple overlap, which realizes a logical \(CCZ\) gate \cite[Ex. 3.7]{arxiv:2610.09341}.'
