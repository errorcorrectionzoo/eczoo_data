code_id: quantum_divisible
physical: qubits
logical: qubits

name: 'Quantum divisible code'
introduced: '\cite{arxiv:1302.3240,arxiv:1709.02832}'

description: |
  A level-\(\nu\) quantum divisible code is a generalized quantum divisible code whose coefficient vector \(t\) has entries in \(\{\pm 1\}\) \cite[Def. V.1]{arxiv:1709.08658}.
  Each qubit is rotated about \(Z\) by \(\pi/2^{\nu-1}\), in a direction set by the sign of the corresponding entry of \(t\).
  This transversal rotation implements a gate at the \(\nu\)th level of the \term{Clifford hierarchy} on every logical qubit \cite[Lemma V.3]{arxiv:1709.08658}.

  The coefficient signs partition the qubits into sets \(M^+\) and \(M^-\) that witness weak \(2^\nu\)-divisibility of the \(X\)-type stabilizer space \cite[Defs. I.4 and I.5]{arxiv:2408.12752}.
  If all signs agree, this space is \(2^\nu\)-divisible in the ordinary sense.
  It is therefore doubly even at level two and triply even at level three, while mixed-sign codes need not have either property.

features:
  transversal_gates:
    - 'A level-\(\nu\) quantum divisible code admits a transversal product of \(Z\)-axis rotations by \(\pi/2^{\nu-1}\), with direction set by the coefficient vector.
      This product implements the same level-\(\nu\) rotation on every logical qubit \cite[Lemma V.3]{arxiv:1709.08658}.'

relations:
  parents:
    - code_id: generalized_quantum_divisible
      detail: 'Quantum divisible codes are generalized quantum divisible codes whose coefficient vector has entries in \(\{\pm1\}\) \cite[Def. V.1]{arxiv:1709.08658}.'
    - code_id: weakly_divisible_css
      detail: |
        The signs of the coefficient vector witness weak \(2^\nu\)-divisibility of the \(X\)-type stabilizer space \cite[Def. V.1]{arxiv:1709.08658}.
        Quantum divisible codes additionally constrain the logical \(X\) representatives and all their joint products with stabilizers.
  cousins:
    - code_id: divisible
      detail: 'When all coefficient signs agree, the \(X\)-type stabilizers of a level-\(\nu\) quantum divisible code form a \(\nu\)-even linear binary code.
      Mixed signs instead give weak \(2^\nu\)-divisibility.'


