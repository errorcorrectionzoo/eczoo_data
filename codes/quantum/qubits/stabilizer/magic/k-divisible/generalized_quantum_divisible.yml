code_id: generalized_quantum_divisible
physical: qubits
logical: qubits

name: 'Generalized quantum divisible code'
introduced: '\cite{arxiv:1709.08658}'

description: |
  A level-\(\nu\) generalized quantum divisible code is a CSS code specified by an \(X\)-type stabilizer generator matrix \(S\), a logical generator matrix \(L\), and an odd-integer vector \(t\) \cite[Def. V.1]{arxiv:1709.08658}.
  The matrix \(S\) is \((\nu,t)\)-null, while \(L\) is \((\nu,t)\)-orthonormal.
  The vertically stacked matrix \(G=[L;S]\) is \((\nu,t)\)-orthogonal.
  Such codes admit gates at the \(\nu\)th level of the \term{Clifford hierarchy}.

  The \((\nu,t)\)-norm of a binary vector \(v\) is
  \begin{align}
    \lVert v\rVert_{\nu,t}=\sum_i v_i t_i \pmod {2^\nu}.
  \end{align}
  Two vectors \(v,w\) are \((\nu,t)\)-orthogonal if
  \begin{align}
    \sum_i v_i t_i w_i \equiv 0 \pmod {2^{\nu-1}}.
  \end{align}
  A set of vectors is \((\nu,t)\)-orthogonal if the spans of every two disjoint subsets are \((\nu,t)\)-orthogonal.
  An orthogonal set is null if every vector in its span has zero norm.
  It is orthonormal if each row has norm one.

  Equivalently, \((\nu,t)\)-orthogonality of \(G\) requires
  \begin{align}
    2^{|A|-1}\sum_i t_i\prod_{a\in A}G_{a i}\equiv 0\pmod {2^\nu}
  \end{align}
  for every set \(A\) of at least two and at most \(\nu\) distinct rows \cite[Lemma III.2]{arxiv:1709.08658}.
  The conditions range over the rows of the full matrix \(G\), so they constrain logical \(X\) representatives as well as \(X\)-type stabilizers.
  At level three, all weighted pair products therefore vanish modulo four and all weighted triple products vanish modulo two.

  For positive stabilizer signs and \(t=(1,\ldots,1)\), preservation of the code space by the transversal \(Z\)-rotation by \(\pi/2^{\nu-1}\) requires
  \begin{align}
    2^\nu&\mid \mathrm{wt}(w) &&\text{for all }w\in\operatorname{span}(S),\\
    2^{\nu-1}&\mid \mathrm{wt}(w*z) &&\text{for all }w\in\operatorname{span}(S),\ z\in\operatorname{span}(G),
  \end{align}
  where \(\mathrm{wt}\) is the Hamming weight and \(*\) is the entrywise product \cite[Rem. 13]{arxiv:2109.13481}.

  Generalized quantum divisible codes can be level-lifted from \(\nu\) to \(\nu+1\) \cite[Thm. IV.1]{arxiv:1709.08658}.
  This procedure recursively yields towers from a ground code \cite[Thm. V.6]{arxiv:1709.08658}.


features:
  transversal_gates:
    - 'A level-\(\nu\) generalized quantum divisible code admits a diagonal transversal gate at the \(\nu\)th level of the \term{Clifford hierarchy} \cite[Lemma V.3]{arxiv:1709.08658}.'

relations:
  parents:
    - code_id: qubit_css
      detail: 'Generalized quantum divisible codes are CSS codes.
      Any self-dual CSS code yields a level-three generalized quantum divisible code when level-lifted \cite[Thm. V.6]{arxiv:1709.08658}.'
  cousins:
    - code_id: quantum_triorthogonal
      detail: 'Both generalized quantum divisible codes and triorthogonal codes are CSS codes.
      Every level-three generalized quantum divisible code is a triorthogonal code, while the converse was left open in Ref. \cite[Sec. VI.C]{arxiv:1709.08658}.'
    - code_id: random_stabilizer
      detail: 'Random CSS codes \cite{arxiv:quant-ph/9512032} can be used to construct families of \([[O(d^{\nu−1}), \Omega(d), d]]\) level-\(\nu\) generalized quantum divisible codes \cite[Sec. VI.A]{arxiv:1709.08658}.'


