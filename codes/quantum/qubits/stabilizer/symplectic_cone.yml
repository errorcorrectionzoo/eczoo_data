code_id: symplectic_cone
physical: qubits
logical: qubits

name: 'Symplectic cone code'
introduced: '\cite{arxiv:2608.16995}'

description: |
  Qubit stabilizer code obtained by attaching a CSS ancilla code to an input stabilizer code represented as a \hyperref[topic:symplectic-complex]{symplectic complex}, with the output logical operators determined by an \textit{embedded column complex} \cite{arxiv:2608.16995}.
  \textit{Gluing maps} extend the ancilla \(X\)-type checks onto the input qubits and the input checks onto the ancilla qubits.
  A \textit{defect map} then adds \(Z\)-type support on the ancilla's own qubits to the ancilla \(X\)-type checks so that all extended checks commute.
  The construction generalizes the \hyperref[code:mapping_cone]{mapping cone} framework of quantum code embedding from CSS codes to arbitrary stabilizer codes \cite{arxiv:2608.16995}.

  The generalization extends fault-tolerant logical measurement, geometrically local embedding, and \hyperref[topic:weight-reduction]{weight reduction} to codes and logical operators that admit no CSS structure \cite{arxiv:2608.16995}.
  Formally, a symplectic cone is a height-two cone whose middle level is the input-code symplectic complex \(D\).
  Its top and bottom levels are the cochain complex and the chain complex of the ancilla code \(A\), respectively.
  Its stabilizer map is block lower triangular, with the level maps on the diagonal, the gluing maps below the diagonal, and the defect map in the corner \cite[Eq. (10)]{arxiv:2608.16995}.
  The gluing maps form a chain map compatible with the defect map, and this compatibility is what makes the cone a symplectic complex, i.e., keeps the extended checks commuting \cite{arxiv:2608.16995}.
  If \(H_1(A)=0\), the logical space \(H_1(C)\) is naturally isomorphic to that of the embedded column complex \(H^0(A)\to H_1(D)\to H_0(A)\) \cite[Thm. 2]{arxiv:2608.16995}.
  This column-complex homology need not equal the logical space of the input code \(D\).
  The \hyperref[code:layer]{Layer code} and weight-reduction applications choose the column complex to preserve the input logical space.
  For measurement of one logical operator \(\ell^{\star}\), it instead gives \(H_1(C)\cong[\ell^{\star}]^{\perp}/[\ell^{\star}]\), so the deformed code has one fewer logical qubit \cite[Thm. 32]{arxiv:2608.16995}.
  The ancilla is CSS in isolation, but once glued its \(X\)-type checks are generically dressed with \(Z\)-type support by the defect map.
  The output code is therefore generally non-CSS even when the input code is CSS \cite{arxiv:2608.16995}.

protection: |
  The distance of a symplectic cone code can be lower bounded in terms of the distance of its embedded code via the cleaning lemma of the \hyperref[code:mapping_cone]{mapping cone} framework \cite{arxiv:2507.05361,arxiv:2608.16995}.

features:
  fault_tolerance:
    - |
      A single weight-\(W\) non-CSS logical operator of a QLDPC code can be measured fault-tolerantly using an \(O(W\log W)\)-qubit ancilla \cite[Thm. 32]{arxiv:2608.16995}.
      When the measurement graph has constant expansion, the deformed code retains distance \(\Omega(d)\).
      A spacetime fault complex establishes a threshold for the procedure.
      Native parallel measurement of general commuting non-CSS logical operators remains open \cite{arxiv:2608.16995}.
    - |
      The fast-surgery framework \cite{arxiv:2510.04521} extends conditionally to non-CSS logical measurement when a suitable CSS ancilla with meta-syndromes and relative expansion is available \cite[Appx. D]{arxiv:2608.16995}.

relations:
  parents:
    - code_id: qubit_stabilizer
      detail: 'The symplectic form of a symplectic cone code is that of the input code extended by a mixed form pairing the two ancilla sectors of the cone \cite[Eq. (6)]{arxiv:2608.16995}.'
  cousins:
    - code_id: mapping_cone
      detail: 'Symplectic cone codes generalize height-two CSS mapping cones to arbitrary stabilizer codes, while the mapping-cone family also contains cones of other heights, so neither family contains the other \cite{arxiv:2507.05361,arxiv:2608.16995}.'
    - code_id: qldpc
      detail: 'For a QLDPC input and a bounded-degree expanding measurement graph, the symplectic-cone construction remains QLDPC \cite{arxiv:2608.16995}. It measures a single non-CSS logical operator without first converting it to a CSS representative by a local Clifford circuit \cite{arxiv:2608.16995}.'
    - code_id: surface
      detail: 'Measurement of a logical \(Y\) operator of the surface code is an example of non-CSS surgery \cite[Fig. 1]{arxiv:2608.16995}. The defect map dresses the attached CSS ancilla such that the deformed code is non-CSS \cite[Fig. 1]{arxiv:2608.16995}.'
    - code_id: distance_balanced
      detail: |
        Symplectic cones extend \hyperref[topic:weight-reduction]{weight reduction} to non-CSS input codes \cite[Thm. 53]{arxiv:2608.16995}.
        For an \(n\)-qubit input of check weight \(w\) and total qubit degree \(q\), the output has block length \(O(w^4q^4)n\).
        Its maximum stabilizer-generator weight is nine and its total qubit degree is at most eight \cite[Thm. 53]{arxiv:2608.16995}.


