      detail: 'The \hyperref[topic:symplectic-doubling]{symplectic double} of the \([[36,6,6]]\) mirror code is the half-gross code \cite{manual:{V. V. Albert, unpublished computation, 2026}}. The other symplectic halves of the half-gross code have parameters \([[36,6,5]]\) and \([[36,6,3]]\).'


