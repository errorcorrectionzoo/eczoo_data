code_id: dlv
physical: qubits
logical: qubits

name: 'Dinur-Lin-Vidick (DLV) code'
short_name: 'DLV'
introduced: '\cite{arxiv:2402.07476}'

description: |
  Member of a family of CSS codes defined by the degree-\(k\) cochains of a tensor-product sheaf on a \(t\)-dimensional cubical complex \cite{arxiv:2402.07476}.
  The complexes are \(t\)-order extensions of those underlying expander codes (\(t=1\)) and expander lifted-product codes (\(t=2\)).

  The vertices of the complex are the elements of a finite set paired with a color in \(\{0,1\}^t\).
  The edges of each of the \(t\) directions are generated by an inverse-closed set of permutations.
  Permutations from different directions commute either pairwise \cite[Sec. 3]{arxiv:2402.07476} or as sets with unique factorization \cite[Def. 2.5]{arxiv:2609.28028}, so that one edge in each of several directions at a vertex determines a unique cube.
  Each direction carries a local classical code, the same at every vertex up to a permutation and rescaling of coordinates \cite[Prop. 4.6]{arxiv:2609.28028}.
  A cell spanning the directions in \(I\) carries the tensor product of the local codes of the directions outside \(I\).
  Qubits sit on the degree-\(k\) cochains, with \(X\) and \(Z\) checks given by the coboundary maps out of and into degree \(k\).
  For \(2\leq k\leq t-2\), sufficient spectral expansion of the complex, together with product expansion of the local codes and their duals, yields linear distance and constant soundness \cite{arxiv:2402.07476,arxiv:2609.28028}.

  The strict definition of Ref. \cite[Sec. 3]{arxiv:2402.07476} takes the pairwise-commuting option and one fixed local code at every vertex in each direction.
  The explicit construction takes the complex to be an Abelian lift of a product of expander graphs \cite[Sec. 3.5]{arxiv:2402.07476}.
  Its directional graphs split into disjoint expanders and so expand only on sets of inverse-polylogarithmic density \cite[Sec. 3.5]{arxiv:2402.07476}.
  For \(t=4\), this yields a quantum locally testable family with linear dimension and inverse poly-logarithmic relative distance and soundness \cite{arxiv:2402.07476}.
  Applying weight reduction yields \hyperref[topic:asymptotics]{order} \(\Omega(1/\text{polylog}n)\) soundness, \(\Omega(n/\text{polylog}n)\) distance and dimension, and constant locality \cite[Table 4]{arxiv:2309.05541}.
  Applying distance amplification and soundness amplification yields asymptotically constant soundness, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) distance, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) dimension, but poly-logarithmic locality \cite[Table 4]{arxiv:2309.05541}.

