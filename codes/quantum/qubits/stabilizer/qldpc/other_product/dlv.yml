code_id: dlv
physical: qubits
logical: qubits

name: 'Dinur-Lin-Vidick (DLV) code'
short_name: 'DLV'
introduced: '\cite{arxiv:2402.07476}'

description: |
  Member of a family of CSS codes defined by the degree-\(k\) cochains of a tensor-product sheaf on a \(t\)-dimensional cubical complex \cite{arxiv:2402.07476}.
  The complexes are \(t\)-order extensions of those underlying expander codes (\(t=1\)) and expander lifted-product codes (\(t=2\)).

  The vertices of the complex are the elements of a finite set paired with a color in \(\{0,1\}^t\).
  The edges of each of the \(t\) directions are generated by an inverse-closed set of permutations.
  Permutations from different directions commute either pairwise \cite[Sec. 3]{arxiv:2402.07476} or as sets with unique factorization \cite[Def. 2.5]{arxiv:2609.28028}, so that one edge in each of several directions at a vertex determines a unique cube.
  Each direction carries a local classical code, the same at every vertex up to a permutation and rescaling of coordinates \cite[Prop. 4.6]{arxiv:2609.28028}.
  Ref. \cite[Sec. 2]{arxiv:2609.20780} allows any regular cubical complex, with local codes given in local coordinate charts and depending on the endpoint color in each direction.
  A cell spanning the directions in \(I\) carries the tensor product of the local codes of the directions outside \(I\).
  Qubits sit on the degree-\(k\) cochains, with \(X\) and \(Z\) checks given by the coboundary maps out of and into degree \(k\).
  For \(2\leq k\leq t-2\), sufficient spectral expansion of the complex, together with product expansion of the local codes and their duals, yields linear distance and constant soundness \cite{arxiv:2402.07476,arxiv:2609.28028}.

  The strict definition of Ref. \cite[Sec. 3]{arxiv:2402.07476} takes the pairwise-commuting option and one fixed local code at every vertex in each direction.
  The explicit construction takes the complex to be an Abelian lift of a product of expander graphs \cite[Sec. 3.5]{arxiv:2402.07476}.
  Its directional graphs split into disjoint expanders and so expand only on sets of inverse-polylogarithmic density \cite[Sec. 3.5]{arxiv:2402.07476}.
  For \(t=4\), this yields a quantum locally testable family with linear dimension and inverse poly-logarithmic relative distance and soundness \cite{arxiv:2402.07476}.
  Applying weight reduction yields \hyperref[topic:asymptotics]{order} \(\Omega(1/\text{polylog}n)\) soundness, \(\Omega(n/\text{polylog}n)\) distance and dimension, and constant locality \cite[Table 4]{arxiv:2309.05541}.
  Applying distance amplification and soundness amplification yields asymptotically constant soundness, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) distance, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) dimension, but poly-logarithmic locality \cite[Table 4]{arxiv:2309.05541}.

  Sheaves of the strict definition are locally acyclic, so Poincaré duality for sheaf codes relates the degree-\(k\) code with dual local codes to the degree-\((t-k)\) code \cite[Sec. 1.2 and Thm. 3.17]{arxiv:2512.21922}.
  A cap product with a fundamental class identifies the \(X\)-type logical operators of the former with the \(Z\)-type logical operators of the latter \cite[Thm. 4.18]{arxiv:2512.21922}.
  The \(X\)-distance, cocycle expansion, and decoders of the former match the \(Z\)-distance, cycle expansion, and decoders of the latter up to constant factors \cite[Thm. 3.17]{arxiv:2512.21922}.
  Evaluating the cup product of their cochains on the fundamental class gives a perfect pairing between the \(X\)-type logical operators of the two codes \cite[Cor. 4.21]{arxiv:2512.21922}.

features:
  transversal_gates:
    - 'Transversal logical \(CZ\) gates on \(\Theta(n)\) disjoint logical-qubit pairs between a four-dimensional, degree-two Abelian-lift DLV code and the DLV code with dual local codes \cite[Thm. 4.23]{arxiv:2512.21922}. The physical gates evaluate the cup-product pairing and are transversal after a repetition encoding, and the codes are QLTCs with \([[n,\Theta(n),\Theta(n/\log^3 n)]]\) and soundness \(1/\log^3 n\) \cite[Thm. 4.23]{arxiv:2512.21922}.'
    - 'For every \(r\geq 2\), cup-product logical \(C^{r-1}Z\) gates on \(r\) Abelian-lift DLV codes whose local codes are built from two-way product-expanding punctured Reed-Solomon codes \cite[Thm. 1.1 and Sec. 5.3]{arxiv:2604.01874}. The gate is not the logical identity, is transversal after a repetition encoding, and acts on \([[n,\Theta(n),\Theta(n/\log^{r-1}n)]]\) QLDPC codes or on QLTCs with soundness \(\Theta(1/\log^{2r-1}n)\) \cite[Thm. 1.1]{arxiv:2604.01874}.'

relations:
  parents:
    - code_id: qubit_generalized_homological_product_css
      detail: 'DLV codes are quantum generalized homological product CSS codes whose underlying chain complex is a cubical chain complex, i.e., a \(t\)-order extension of the complexes underlying expander codes (\(t=1\)) and expander lifted-product codes (\(t=2\)) \cite{arxiv:2402.07476}.'
  cousins:
    - code_id: qltc
      detail: 'DLV codes with Abelian-lift complexes have linear dimension and inverse poly-logarithmic relative distance and soundness \cite{arxiv:2402.07476}.
        Such QLTCs admit transversal logical \(CZ\) gates on \(\Theta(n)\) disjoint logical-qubit pairs with the DLV codes having dual local codes \cite[Thm. 4.23]{arxiv:2512.21922}.
        With punctured Reed-Solomon local codes, they admit nontrivial transversal logical \(C^{r-1}Z\) gates for every \(r\geq 2\) \cite[Thm. 1.1]{arxiv:2604.01874}.
        Applying distance amplification and soundness amplification yields asymptotically constant soundness, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) distance, \hyperref[topic:asymptotics]{order} \(\Theta(n)\) dimension, but poly-logarithmic locality \cite[Table 4]{arxiv:2309.05541}.'


