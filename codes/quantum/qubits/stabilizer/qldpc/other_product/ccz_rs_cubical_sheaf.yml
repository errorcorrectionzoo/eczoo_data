code_id: ccz_rs_cubical_sheaf
physical: qubits
logical: qubits

name: 'Transversal-\(CCZ\) Reed-Solomon cubical sheaf code'
introduced: '\cite{arxiv:2609.26691}'

description: |
  One of three degree-two Reed-Solomon cubical sheaf codes on a common six-dimensional complex, which together admit \(\Theta(N)\) (\(N^{\Omega(1)}\) in an earlier arXiv version) addressable and parallel transversal logical \(CCZ\) gates for block length \(N\) \cite{arxiv:2609.26691}.
  The physical gate applies a phase given by the cup product of the three blocks' degree-two cochains, evaluated on a degree-six cycle.

  The phase is invariant under adding coboundaries, so it acts on logical classes \cite[Prop. 2.10]{arxiv:2609.26691}.
  The gate's logical classes in block \(a\in\{1,2,3\}\) are supported on two-cells spanning directions \(2a-1\) and \(2a\), where that block's local codes have lower degree \cite[Secs. 3.1 and 3.3]{arxiv:2609.26691}.
  Since these pairs partition the six directions, one cup-product term contributes on each six-cell \cite[Sec. 3.2]{arxiv:2609.26691}.
  Multiplying a fixed degree-two cocycle of each block by \(\Omega(N)\) global sections of an auxiliary sheaf yields logical classes that Poincaré-dual cycles pair diagonally \cite[Thm. 3.11]{arxiv:2609.26691}.
  The choice of cycle selects which logical triples receive a \(CCZ\) gate \cite[Sec. 3.3]{arxiv:2609.26691}.

features:
  rate: 'Constant rate in all three blocks \cite[Sec. 3.4]{arxiv:2609.26691}.'

  transversal_gates:
    - 'Logical \(CCZ\) gates on any subset of \(m=\Omega(N)\) logical triples within a logical subspace, so the logical trilinear form has subrank at least \(m\) \cite[Sec. 3.3]{arxiv:2609.26691}. After a fixed repetition encoding, each addressed product of logical \(CCZ\) gates is one layer of disjoint physical \(CCZ\) gates \cite[Sec. 3.4]{arxiv:2609.26691}.'

  magic_scaling_exponent: 'Magic-state yield parameter \(\gamma=\log(M/k)/\log d=o(1)\) for \(CCZ\)-state distillation, where \(k=\Omega(N)\) logical \(CCZ\) gates use \(M=O(N)\) physical ones and \(d=\Theta(N)\) \cite[Sec. 3.5]{arxiv:2609.26691}.'

  decoders:
    - 'Constant-depth single-shot decoder based on parallel local flips for the construction of an earlier arXiv version of Ref. \cite{arxiv:2609.26691} \cite[Lemmas 6.8 and 6.11]{arxiv:2609.28461}.'

  fault_tolerance:
    - 'Fault-tolerant quantum computation against locally stochastic noise with strictly logarithmic time and constant space overheads for sufficiently wide circuits, for an earlier arXiv version of Ref. \cite{arxiv:2609.26691} \cite[Thm. 3.12 and Cor. 3.13]{arxiv:2609.28461}. A width-\(W\), depth-\(D\) circuit runs in depth \(O(D\log(WD/\varepsilon))\), and only stabilizer resource states require separate preparation \cite{arxiv:2609.28461}.'

relations:
  parents:
    - code_id: rs_cubical_sheaf
      detail: 'Transversal-\(CCZ\) Reed-Solomon cubical sheaf codes are degree-two Reed-Solomon cubical sheaf codes on six-dimensional complexes, taken in triples whose blocks use lower-degree local codes in distinct pairs of directions \cite[Sec. 3.1]{arxiv:2609.26691}. The cup product of their cochains yields a linear number of addressable transversal logical \(CCZ\) gates \cite[Thm. 1.1]{arxiv:2609.26691}.'
  cousins:
    - code_id: good_qldpc
      detail: 'The transversal-\(CCZ\) Reed-Solomon cubical sheaf construction yields good QLDPC codes with \(\Theta(N)\) addressable and parallel transversal logical \(CCZ\) gates \cite[Thm. 1.1]{arxiv:2609.26691}.'
    - code_id: single_shot
      detail: 'In the construction of an earlier arXiv version of Ref. \cite{arxiv:2609.26691}, transversal-\(CCZ\) Reed-Solomon cubical sheaf codes admit a constant-depth single-shot decoder based on parallel local flips \cite[Lemmas 6.8 and 6.11]{arxiv:2609.28461}.'
    - code_id: galois_polynomial
      detail: 'In the construction of an earlier arXiv version of Ref. \cite{arxiv:2609.26691}, a fixed punctured Galois-qudit RS distillation circuit can be applied recursively to inputs encoded in transversal-\(CCZ\) Reed-Solomon cubical sheaf codes of geometrically increasing length \cite[Thm. 7.5]{arxiv:2609.28461}. For sufficiently wide circuits, this yields fault-tolerant quantum computation with constant space overhead and strictly logarithmic time overhead \cite[Thm. 7.8]{arxiv:2609.28461}.'


