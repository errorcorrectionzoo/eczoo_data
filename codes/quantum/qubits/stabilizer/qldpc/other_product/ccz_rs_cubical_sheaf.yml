code_id: ccz_rs_cubical_sheaf
physical: qubits
logical: qubits

name: 'Transversal-\(CCZ\) Reed-Solomon cubical sheaf code'
introduced: '\cite{arxiv:2609.26691}'

description: |
  One of three Reed-Solomon cubical sheaf codes on a common six-dimensional complex that together admit \(\Theta(N)\) addressable and parallel transversal logical \(CCZ\) gates for block length \(N\) \cite{arxiv:2609.26691}.
  The physical gate applies a phase given by the cup product of the three blocks' degree-two cochains, evaluated on a degree-six cycle.

  Each term of this phase is a physical \(CCZ\) gate on one qubit per block \cite[Sec. 2.4]{arxiv:2609.26691}.
  The phase is invariant under adding coboundaries, so it acts on logical classes \cite[Prop. 2.10]{arxiv:2609.26691}.
  Block \(a\in\{1,2,3\}\) uses lower-degree projective Reed-Solomon local codes in directions \(2a-1\) and \(2a\) than in the other four \cite[Sec. 3.1]{arxiv:2609.26691}.
  Multiplying a fixed degree-two cocycle of each block by \(\Omega(N)\) global sections of an auxiliary sheaf yields logical classes that Poincaré-dual cycles pair diagonally \cite[Thm. 3.11]{arxiv:2609.26691}.
  The choice of cycle thus selects which logical triples receive a \(CCZ\) gate \cite[Sec. 3.3]{arxiv:2609.26691}.

protection: 'Each block is an \([[N,\Theta(N),\Theta(N)]]\) code (using \hyperref[topic:asymptotics]{asymptotic notation}) with bounded check weight and qubit degree and with constant soundness \cite[Thm. 1.1 and Sec. 3.4]{arxiv:2609.26691}.'

features:
  transversal_gates:
    - 'Logical \(CCZ\) gates on any subset of \(m=\Omega(N)\) logical triples within a logical subspace, so the logical trilinear form has subrank at least \(m\) \cite[Sec. 3.3]{arxiv:2609.26691}. After a fixed repetition encoding, each such gate is one layer of disjoint physical \(CCZ\) gates \cite[Sec. 3.4]{arxiv:2609.26691}.'

  magic_scaling_exponent: 'Magic-state yield parameter \(\gamma=\log(M/k)/\log d=o(1)\) for \(CCZ\)-state distillation, where \(k=\Omega(N)\) logical \(CCZ\) gates use \(M=O(N)\) physical ones and \(d=\Theta(N)\) \cite[Sec. 3.5]{arxiv:2609.26691}.'

  decoders:
    - 'Constant-depth single-shot decoder based on parallel local flips, which corrects exactly from noiseless syndromes after \(O(\log N)\) rounds \cite[Lemmas 6.8 and 6.11]{arxiv:2609.28461}.'

  fault_tolerance:
    - |
      Transversal-\(CCZ\) Reed-Solomon cubical sheaf codes yield fault-tolerant quantum computation with constant space overhead and strictly logarithmic time overhead under locally stochastic noise \cite[Thm. 3.12]{arxiv:2609.28461}.
      Logical qubits stored densely in full blocks are moved in batches, by \hyperref[topic:code-switching]{code switching}, into the active subspaces on which the transversal \(CCZ\) gate acts \cite{arxiv:2609.28461}.
      Only stabilizer resource states then require separate preparation \cite{arxiv:2609.28461}.
      For sufficiently wide circuits of polynomial depth and inverse-polynomial target error \(\varepsilon\), a width-\(W\), depth-\(D\) circuit is simulated in depth \(O(D\log(WD/\varepsilon))\) with \(O(W)\) physical qubits \cite[Thm. 3.12, Cor. 3.13]{arxiv:2609.28461}.

relations:
  parents:
    - code_id: rs_cubical_sheaf
      detail: 'Transversal-\(CCZ\) Reed-Solomon cubical sheaf codes are degree-two Reed-Solomon cubical sheaf codes on six-dimensional complexes, taken in triples whose blocks use lower-degree local codes in distinct pairs of directions. The cup product of cochains from the three blocks then yields a linear number of addressable transversal logical \(CCZ\) gates \cite{arxiv:2609.26691}.'
  cousins:
    - code_id: good_qldpc
      detail: 'The transversal-\(CCZ\) Reed-Solomon cubical sheaf construction yields good QLDPC codes with a linear number of addressable and parallel transversal logical \(CCZ\) gates \cite[Thm. 1.1]{arxiv:2609.26691}.'
    - code_id: single_shot
      detail: 'Transversal-\(CCZ\) Reed-Solomon cubical sheaf codes admit a constant-depth single-shot decoder based on parallel local flips \cite[Lemmas 6.8 and 6.11]{arxiv:2609.28461}.'
    - code_id: galois_polynomial
      detail: 'A fixed punctured Galois-qudit RS distillation circuit can be applied recursively to inputs encoded in transversal-\(CCZ\) Reed-Solomon cubical sheaf codes of geometrically increasing length \cite[Thm. 7.5]{arxiv:2609.28461}. This yields fault-tolerant quantum computation with constant space overhead and strictly logarithmic time overhead \cite[Thm. 7.8]{arxiv:2609.28461}.'


