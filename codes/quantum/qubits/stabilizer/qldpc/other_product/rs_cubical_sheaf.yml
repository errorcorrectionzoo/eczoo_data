code_id: rs_cubical_sheaf
physical: qubits
logical: qubits

name: 'Reed-Solomon cubical sheaf code'
introduced: '\cite{arxiv:2609.28028}'

description: |
  DLV code whose cubical complex is an arithmetic quotient of a product of \(r\) Bruhat-Tits trees and whose local codes are Reed-Solomon codes on the projective line \cite{arxiv:2609.28028}.
  For \(r=4\) and \(k=2\), the family is an asymptotically good binary \(c^3\)-QLTC, with constant rate, linear distance, constant soundness, and bounded check weight \cite[Thm. 1.2]{arxiv:2609.28028}.

  The complex is a congruence quotient of a product of \((q_i+1)\)-regular trees by a quaternionic lattice over \(\mathbb{F}_2(y)\) \cite{arxiv:1808.03290,arxiv:2504.15087}.
  Its parallel-face graphs are Ramanujan at every size, with normalized second eigenvalue at most \(\max_i 2\sqrt{q_i}/(q_i+1)\) \cite[Prop. 4.3]{arxiv:2609.28028}.
  The \(q_i+1\) edges in direction \(i\) at a vertex are indexed by \(\mathbb{P}^1(\mathbb{F}_{q_i})\).
  The direction-\(i\) local code consists of evaluations of homogeneous polynomials of degree \(d_i\) at these points.
  A Frobenius twist of the local codes at vertices of one color, with \(\sqrt{q_i}-1\) dividing \(d_i\), makes the product sheaf equivariant under the lattice.
  The sheaf therefore descends to the quotient \cite[Prop. 4.6]{arxiv:2609.28028}.

  The local codes are monomially equivalent to Reed-Solomon codes on the norm-one sets \(\{z\in\mathbb{F}_{q_i^2}:z^{q_i+1}=1\}\) with \(q_i=2^{2(A+i)}\).
  Any tuple of such codes with relative redundancies at least \(\beta\) is product expanding with a constant \(c_r\beta^r\) independent of the code lengths \cite[Thm. 5.4]{arxiv:2609.28028}.
  Increasing \(A\) thus improves the spectral expansion of the complex without degrading the local coboundary expansion of the sheaf and its dual.
  This removes the polylogarithmic losses of the Abelian-lift DLV construction.

protection: |
  For fixed \(r\geq 4\) and \(2\leq k\leq r-2\), the degree-\(k\) codes form an explicit polynomial-time computable family with \(K=\Omega(N)\), \(D=\Omega(N)\), and soundness \(\rho=\Omega(1)\) \cite[Thm. 6.2]{arxiv:2609.28028}.
  The soundness bound holds for both \(H_X\) and \(H_Z\), whose rows and columns have uniformly bounded weight.
  For \(r=4\) and \(k=2\), the family is binary with \(K\geq\alpha N\), \(D\geq\delta N\), and soundness \(\rho\) for absolute constants \(\alpha,\delta,\rho>0\) \cite[Thm. 1.2]{arxiv:2609.28028}.

features:
  rate: 'Rate \(K/N\geq 1/(2\binom{r}{k}2^{r-k})\), obtained by giving \(k\) directions small local dimension and the remaining directions the complementary dimension \cite[Prop. 6.1 and Thm. 6.2]{arxiv:2609.28028}.'

