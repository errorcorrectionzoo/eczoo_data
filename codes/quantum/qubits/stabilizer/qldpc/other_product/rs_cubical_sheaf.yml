code_id: rs_cubical_sheaf
physical: qubits
logical: qubits

name: 'Reed-Solomon cubical sheaf code'
introduced: '\cite{arxiv:2609.20780,arxiv:2609.28028}'

description: |
  DLV code on the degree-\(k\) cochains of a sheaf with projective Reed-Solomon local codes over an arithmetic quotient of a product of \(r\) Bruhat-Tits trees.
  Its degrees, field sizes, and quotient are chosen so that Ramanujan expansion and uniform product expansion of the local codes make the codes binary \(c^3\)-QLTCs \cite{arxiv:2609.20780,arxiv:2609.28028}.

  The edges at a vertex in each direction are indexed by a projective line over the residue field.
  The local code evaluates homogeneous polynomials of a fixed degree on that line.
  Reindexing the local codes by a Frobenius automorphism at one endpoint type makes them compatible with the arithmetic identifications, so they glue into a sheaf on the quotient \cite{arxiv:2609.20780,arxiv:2609.28028}.

  In Ref. \cite{arxiv:2609.28028}, the quotient is by a congruence subgroup of a quaternionic lattice over \(\mathbb{F}_2(y)\) \cite{arxiv:1808.03290,arxiv:2504.15087}, and the residue fields are \(\mathbb{F}_{q_i}\) with \(q_i=2^{2(A+i)}\).
  The Frobenius twist acts at color-0 vertices and requires \(\sqrt{q_i}-1\) to divide the local degree \(d_i\) \cite[Lemma 4.4 and Prop. 4.6]{arxiv:2609.28028}.
  The local codes are then monomially equivalent to Reed-Solomon codes on the norm-one sets \(\{z\in\mathbb{F}_{q_i^2}:z^{q_i+1}=1\}\), whose product-expansion constant \(c_r\beta^r\) at relative redundancy at least \(\beta\) is independent of \(A\) \cite[Thm. 5.4]{arxiv:2609.28028}.

protection: |
  Binary code families with \(K=\Omega(N)\), \(D=\Omega(N)\), soundness \(\rho=\Omega(1)\), and bounded check weight and qubit degree \cite{arxiv:2609.20780,arxiv:2609.28028}.
  In Ref. \cite{arxiv:2609.28028}, such families exist for every fixed \(r\geq4\) and degree \(2\leq k\leq r-2\) \cite[Thm. 6.2]{arxiv:2609.28028}.

features:
  rate: 'In Ref. \cite{arxiv:2609.28028}, the rate satisfies \(K/N\geq 1/(2\binom{r}{k}2^{r-k})\), obtained by giving \(k\) directions small local dimension and the remaining directions the complementary dimension \cite[Prop. 6.1 and Thm. 6.2]{arxiv:2609.28028}.'

relations:
  parents:
    - code_id: dlv
      detail: 'Reed-Solomon cubical sheaf codes are DLV codes with projective Reed-Solomon local codes on an arithmetic quotient of a product of Bruhat-Tits trees, whose generating sets commute only setwise. Uniform product expansion of the local codes and Ramanujan expansion of the quotient remove the polylogarithmic losses in distance and soundness of the Abelian-lift DLV construction \cite{arxiv:2609.20780,arxiv:2609.28028}.'
    - code_id: qltc
      detail: 'Reed-Solomon cubical sheaf codes form binary \(c^3\)-QLTC families with constant rate, linear distance, constant soundness, and bounded check weight \cite{arxiv:2609.20780}\cite[Thm. 6.2]{arxiv:2609.28028}.'
  cousins:
    - code_id: good_qldpc
      detail: 'Reed-Solomon cubical sheaf constructions yield asymptotically good QLDPC codes that are also \(c^3\)-QLTCs \cite{arxiv:2609.20780,arxiv:2609.26691}\cite[Thm. 6.2]{arxiv:2609.28028}.'
    - code_id: reed_solomon
      detail: 'The local codes of Reed-Solomon cubical sheaf codes are projective Reed-Solomon codes, which are monomially equivalent to Reed-Solomon codes on the norm-one set \(\{z\in\mathbb{F}_{q^2}:z^{q+1}=1\}\) \cite[Lemmas 4.4 and 4.5]{arxiv:2609.28028}.'


