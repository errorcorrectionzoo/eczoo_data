code_id: recursive_3d_self_correct
physical: qubits
logical: qubits

name: 'Recursive 3D self-correcting code'
introduced: '\cite{arxiv:2605.10943}'

description: |
  Family of geometrically local 3D CSS codes, each encoding one logical qubit, whose stabilizer Hamiltonians are self-correcting \cite{arxiv:2605.10943}.
  The codes are built from the \hyperref[code:stab_5_1_2]{\([[5,1,2]]\) rotated surface code} by alternating two iterations that double the syndrome weight of \(X\)-type and \(Z\)-type errors, respectively.
  Because the iterations alternate, this doubling occurs at all length scales and for both error types.

  Each code is represented by its Tanner square complex, the Tanner graph with squares \((x,q,z,q')\) attached for pairs of qubits shared by checks \(x\) and \(z\) \cite{arxiv:2408.01769}.
  An iteration scales the embedding of this complex in \(\mathbb{R}^3\) by a constant of order \(\ell\) and randomly perturbs its vertices to lower the density of squares.
  It then replaces every square by a copy of a fixed square complex, \(U_X\) or \(U_Z\), with neighboring copies glued together.
  Both complexes consist of two parallel \(\ell\times\ell\) layers joined by a transverse strip of thickness two.
  The complex \(U_X\) resembles a piece of a thickness-one \hyperref[code:3d_surface]{3D surface code} slab whose front and back boundaries condense \(X\)-type membranes, and \(U_Z\) is its \(Z\)-type counterpart \cite[Remark 3.7]{arxiv:2605.10943}.
  A randomized algorithm finds the local embedding in expected polynomial time \cite[Thm. 3.16]{arxiv:2605.10943}.

protection: |
  Each code encodes one logical qubit \cite[Thm. 3.16]{arxiv:2605.10943}, and its distance scales as a power of \(n\) \cite[Sec. 1.1]{arxiv:2605.10943}.
  Each iteration multiplies the number of qubits by a constant factor, so \(n=\exp(\Theta(k))\) after \(2k\) iterations (using \hyperref[topic:asymptotics]{asymptotic notation}) \cite[Sec. 3.3]{arxiv:2605.10943}.

features:
  decoders:
    - 'Renormalization-group-like decoder whose locally computable coarse-graining maps apply a correction at one level and pass the residual syndrome to the previous level \cite[Sec. 4]{arxiv:2605.10943}. For \(X\)-type errors, coarse-graining halves the syndrome weight across an \(X\)-iteration and does not increase it across a \(Z\)-iteration \cite[Thms. 4.6 and 4.7]{arxiv:2605.10943}.'

relations:
  parents:
    - code_id: qubit_css
      detail: 'Recursive 3D self-correcting codes are CSS codes whose Tanner square complexes are generated by recursively replacing each square with a fixed local square complex \cite{arxiv:2605.10943}.'
    - code_id: qldpc
      detail: 'Recursive 3D self-correcting codes are geometrically local in three dimensions, with stabilizer generators of weight at most seven and each qubit in at most seven generators \cite[Lemma 3.14]{arxiv:2605.10943}.'
    - code_id: self_correct
      detail: 'The recursive 3D self-correcting code is a self-correcting quantum code in three dimensions \cite{arxiv:2605.10943}. Below a critical temperature, the memory time of a thermally encoded logical qubit is at least \(\exp(\Theta(n^{\eta}))\) for a constant \(\eta>0\) (using \hyperref[topic:asymptotics]{asymptotic notation}) \cite[Thm. 3.16]{arxiv:2605.10943}. The bound holds for Markovian thermal dynamics with single-qubit Pauli jump operators \cite[Sec. 5]{arxiv:2605.10943}.'
  cousins:
    - code_id: 3d_surface
      detail: 'The local complexes that replace each square in the recursive 3D self-correcting code construction resemble pieces of thickness-one 3D surface code slabs with membrane-condensing front and back boundaries \cite[Remark 3.7]{arxiv:2605.10943}.'
    - code_id: mapping_cone
      detail: 'Each iteration of the recursive 3D self-correcting code builds the next code as a height-2 cone \cite[Sec. 3.2.2]{arxiv:2605.10943}. The levels of the cone are local complexes attached to the \(X\)-check, qubit, and \(Z\)-check vertices of the Tanner graph of the previous code. A chain map from the previous code induces an isomorphism on first cohomology, so every code in the family encodes one logical qubit \cite[Lemmas 3.10 and 3.13]{arxiv:2605.10943}.'
    - code_id: 3d_stabilizer
      detail: 'The recursive 3D self-correcting code is a geometrically local 3D stabilizer code that is not translationally invariant and is self-correcting \cite{arxiv:2605.10943}. In contrast, 3D translationally invariant qubit stabilizer code families with constant \(k\) support logical string operators and cannot be self-correcting \cite{arxiv:1103.1885}.'
    - code_id: stab_5_1_2
      detail: 'The recursive 3D self-correcting code family is obtained by recursively transforming the \([[5,1,2]]\) rotated surface code, which is its level-zero code \cite[Sec. 3.3]{arxiv:2605.10943}.'


