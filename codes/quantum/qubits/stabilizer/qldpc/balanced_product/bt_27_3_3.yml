code_id: bt_27_3_3
physical: qubits
logical: qubits

name: '\([[27,3,3]]\) bivariate tricycle code'
introduced: '\cite{arxiv:2510.07269}'

alternative_names:
  - '\([[27,3,3]]\) BT code'

description: |
  Tricycle code over \(\mathbb{F}_2[x,y]/(x^3+1,y^3+1)\) with binomial elements \(a=x^2y+x^2y^2\), \(b=1+xy^2\), and \(c=x+x^2y\) \cite[Table III]{arxiv:2510.07269}.
  Its 2D component code, obtained by dropping \(c\), is the \([[18,2,3]]\) \hyperref[code:qcga]{BB code} \cite{arxiv:2510.07269}.
  Since \(c=a+xb\) lies in the ideal \((a,b)\), a one-way transversal CNOT from the tricycle code couples the two BB logical qubits one-to-one to two of the three tricycle logical qubits \cite[Appx. C]{arxiv:2510.07269}.

  The two qubit blocks of the BB code are the \(a\)- and \(b\)-blocks of the tricycle code.
  The CNOT acts between each tricycle qubit in these blocks and its BB partner \cite{arxiv:2510.07269}.
  One-bit teleportation through this CNOT switches logical qubits between the two codes \cite{arxiv:2510.07269}.
  The nine \(X\)-type checks have weight six, and the 27 \(Z\)-type checks have weight four.
  An equivalent presentation uses \(a=xy^2+x^2\), \(b=x^2+x^2y\), and \(c=y^2+xy\) \cite[Fig. 3]{arxiv:2510.07269}.
  The three qubit blocks can be placed on a triangular lattice on a \(3\times 3\) torus \cite[Appx. D]{arxiv:2510.07269}.
  All \(X\)-type checks are then translates of a single check, and so are the \(Z\)-type checks within each of the three rows of \(H_Z\) \cite[Appx. D]{arxiv:2510.07269}.

protection: 'The distance \(d=3\) is the \(Z\)-distance, and the \(X\)-distance is larger \cite[Appx. F]{arxiv:2510.07269}.'

features:
  general_gates:
    - 'A depth-two circuit of physical \(CCZ\) gates across three code blocks realizes a nontrivial logical \(CCZ\) circuit via the cup product \cite{arxiv:2510.07269}.'

  fault_tolerance:
    - |
      Magic states are prepared by single-shot logical \(|+\rangle\) preparation on three code blocks, the depth-two \(CCZ\) circuit, and postselection on the final \(X\)-type detectors \cite{arxiv:2510.07269}.
      At circuit-level depolarizing noise of strength \(10^{-3}\), with the \(CCZ\) gates replaced by approximate Pauli error channels, the postselected logical error rate is about \(2\times 10^{-6}\) at success probability \(0.7\) \cite[Table II]{arxiv:2510.07269}.

relations:
