code_id: bb108
physical: qubits
logical: qubits

name: '\([[108,8,10]]\) three-quarters-gross code'

introduced: '\cite{arxiv:2308.07915}'


alternative_names:
  - '\([[108,8,10]]\) \(3/4\)-gross code'
  - '\([[108,8,10]]\) BB6 code'
  - '\((9,6)\) BB6 code'

description: |
  A bivariate bicycle (BB) code with parameters \([[108,8,10]]\) and weight-six stabilizer generators \cite{arxiv:2308.07915}.

  One defining presentation uses \((\ell,m)=(9,6)\) with \(x^{\ell}=y^{m}=1\), and
  \(A=x^3+y+y^2\), \(B=y^3+x+x^2\) in \(\mathbb{F}_2[x,y]/(x^{\ell}-1,y^{m}-1)\) \cite[Table 3]{arxiv:2308.07915}.

features:
  rate: 'Ancilla-added encoding rate is \(1/27\), using \(n_a=n=108\) ancilla qubits.'


relations:
  parents:
    - code_id: qcga
      detail: 'The three-quarters-gross code is the \((-1,3,3,-1)\) generalized toric code on the untwisted torus with lattice vectors \((0,9)\) and \((6,0)\) \cite[Table I]{arxiv:2503.03827}.'


