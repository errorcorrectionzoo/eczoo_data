code_id: gross
physical: qubits
logical: qubits

name: '\([[144,12,12]]\) gross code'
introduced: '\cite{arxiv:2308.07915}'

alternative_names:
  - '\((3,3)\) BB6 code'
  # \cite{arxiv:2410.11942}

description: |
  A BB code which requires fewer physical and ancilla qubits (for syndrome extraction) than the surface code with the same number of logical qubits and distance.
  The gross code is a finite-size member of a family of 2D stabilizer codes whose bulk topological order is that of 8 copies of the surface code \cite{arxiv:2410.11942}.
  The name stems from the fact that a gross is a dozen dozen.

  The polynomials \(A=x^3+y+y^2\) and \(B=y^3+x+x^2\) of the \hyperref[code:gross]{gross code} on \(\ell=m=12\) yield an indecomposable \([[288,16,12]]\) code \cite[Table III]{arxiv:2606.02418}.
  A different \([[144,12,12]]\) QLDPC code was introduced as an end-cycle code of a \([[288,12,18]]\) BB code in \cite{arxiv:2407.16336}.
# https://twitter.com/jaygambetta/status/1773099803561381995

protection: |
  Up to equivalence, the gross code is the only qubit \hyperref[code:abelian_2bga]{Abelian 2BGA code} with check weight six and \(n\leq 200\) that reaches \(kd^2/n=12\) \cite{arxiv:2610.13880}.
  It has the largest \(kd^2/n\) among all qubit 2BGA codes with check weight six and \(n\leq 191\) \cite{arxiv:2610.13880}.

features:
  rate: 'An ancilla-added rate of \(1/24\). In contrast, the distance-13 surface code has ancilla-added rate \(1/338\).'
  # 12 logical qubits would require nearly 3000 physical qubits with separate surface-code patches in the comparison of Ref. \cite{arxiv:2308.07915}.

  transversal_gates:
    - 'Logical Pauli operators and fold-transversal gates studied in Ref. \cite{arxiv:2409.18175}.'
    - 'Two-fold transversal gates, i.e., depth-one circuits of two-local code-preserving physical gates, realize a logical group of order at least \(460800\), short of the full logical Clifford group \cite{arxiv:2608.05688}.'

  general_gates:
    - '\hyperref[topic:clifford]{Clifford gates} \cite{arxiv:2407.18393}.'

  decoders:
    - 'The GDG sliding-window decoder \cite{arxiv:2403.18901}, with a realization achieving a worst-case decoding latency of 3ms per window.'
    - 'AC decoder is faster than ordinary BP-OSD with no reduction of fidelity \cite{arxiv:2406.14527}.'
    - 'Transformer-based neural-network decoder \cite{arxiv:2504.13043}.'
    - '\href{https://github.com/aleverrier/frontier}{Frontier decoder}, a pruned dynamic-programming decoder, retains on average fewer than 100 states under circuit-level noise at \(p=10^{-3}\) \cite{arxiv:2606.20513}.'

  fault_tolerance:
    - 'At physical error rate \(p=10^{-3}\) under circuit-level noise, the code suppresses the logical error rate to about \(2\times 10^{-7}\), enough to preserve \(12\) logical qubits for nearly one million syndrome cycles using \(288\) total physical qubits \cite{arxiv:2308.07915}.'
    - 'Fault-tolerant modular quantum computing framework \cite{arxiv:2506.03094}.'
    - |
      Exact syndrome extraction across the cut of the \(12\times 6\) torus into two \(6\times 6\) halves requires \(60\) shared Bell pairs under free local processing \cite[Sec. 4.1]{arxiv:2609.39705}.
      From product ancillas, it requires at least \(30\) crossing two-qubit gates, or \(60\) if all are CNOT gates \cite[Sec. 4.1]{arxiv:2609.39705}.
      The optimum is attained by measuring \(132\) independent original checks, \(36\) supported in each half and \(60\) crossing, and reconstructing the twelve omitted syndrome bits classically \cite[Prop. 4.1]{arxiv:2609.39705}.

  code_capacity_threshold:
    - 'Bit-flip noise: \hyperref[topic:pseudo-threshold]{pseudo-threshold} of \(\approx 5\%\) for the block logical error rate under BP-OSD decoding \cite{arxiv:2606.02418}.'

  threshold:
    - 'Admits a \hyperref[topic:pseudo-threshold]{pseudo-threshold} of \(\approx 0.7\%\) for the circuit-based noise model \cite{arxiv:2308.07915}.'


realizations:
  - 'An FPGA implementation of the Relay-BP decoder \cite{arxiv:2510.21600}.'


relations:
  parents:
    - code_id: qcga
      detail: 'The gross code is the BB code with \(A=1+x+x^{-1}y^3\) and \(B=1+y+x^3y^{-1}\) on the torus with lattice vectors \((0,12)\) and \((6,0)\) \cite[Exam. 3 and Table II]{arxiv:2503.03827}.'
  cousins:
    - code_id: surface
      detail: 'The gross code requires fewer physical and ancilla qubits (for syndrome extraction) than the surface code with the same number of logical qubits and distance. The gross code is a finite-size member of a family of 2D stabilizer codes whose bulk topological order is that of 8 copies of the surface code \cite{arxiv:2410.11942}. An architecture combining the surface and gross codes was proposed in \cite{arxiv:2411.03202}.'


