code_id: bb288
physical: qubits
logical: qubits

name: '\([[288,12,18]]\) double-gross code'
introduced: '\cite{arxiv:2308.07915}'

alternative_names:
  - '\([[288,12,18]]\) two-gross code'
  - '\((12,12)\) BB6 code'

description: |
  A bivariate bicycle (BB) code with parameters \([[288,12,18]]\) and weight-six stabilizer generators \cite{arxiv:2308.07915}.

  One defining presentation uses \((\ell,m)=(12,12)\) with \(x^{\ell}=y^{m}=1\), and
  \(A=x^3+y^2+y^7\), \(B=y^3+x+x^2\) in \(\mathbb{F}_2[x,y]/(x^{\ell}-1,y^{m}-1)\) \cite[Table 3]{arxiv:2308.07915}.
  A different \([[288,12,18]]\) BB code, with polynomials \(x+x^2+y^{-3}\) and \(y+y^2+x^3\) on the same \(12\times 12\) torus, has checks of range three \cite[Exam. 7]{arxiv:2503.03827}.

features:
  rate: 'Ancilla-added encoding rate is \(1/48\), using \(n_a=n=288\) ancilla qubits.'


relations:
  parents:
    - code_id: qcga
      detail: 'The double-gross code belongs to a family of 2D lattice stabilizer codes obtained by holding its Laurent-polynomial check pattern fixed while enlarging the torus \cite{arxiv:2308.07915,arxiv:2412.04181}.'


