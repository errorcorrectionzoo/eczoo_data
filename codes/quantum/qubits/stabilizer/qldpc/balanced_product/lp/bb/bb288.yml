code_id: bb288
physical: qubits
logical: qubits

name: '\([[288,12,18]]\) double-gross code'
introduced: '\cite{arxiv:2308.07915}'

alternative_names:
  - '\([[288,12,18]]\) two-gross code'
  - '\((12,12)\) BB6 code'

description: |
  A bivariate bicycle (BB) code with parameters \([[288,12,18]]\) and weight-six stabilizer generators \cite{arxiv:2308.07915}.

  One defining presentation uses \((\ell,m)=(12,12)\) with \(x^{\ell}=y^{m}=1\), and
  \(A=x^3+y^2+y^7\), \(B=y^3+x+x^2\) in \(\mathbb{F}_2[x,y]/(x^{\ell}-1,y^{m}-1)\) \cite[Table 3]{arxiv:2308.07915}.

features:
  rate: 'Ancilla-added encoding rate is \(1/48\), using \(n_a=n=288\) ancilla qubits.'

  fault_tolerance:
    - 'The syndrome extraction circuit of Ref. \cite{arxiv:2308.07915} has \hyperref[topic:effective-distance]{circuit-level distance} at most \(18\) \cite[Table 1]{arxiv:2308.07915}.'
    - |
      A \textit{uniform} syndrome extraction cycle uses one ancilla per check and only CNOT gates, with one CNOT order and timing shared by all \(X\) checks and another by all \(Z\) checks.
      Each ancilla is prepared, coupled to its six data qubits by one CNOT gate per time step, and measured, so that one cycle takes eight time steps.
      Every uniform cycle, including the circuit of Ref. \cite{arxiv:2308.07915}, has \hyperref[topic:effective-distance]{circuit-level distance} at most \(16\) under circuit-level noise with idle errors \cite{doi:10.5281/zenodo.23630980}.

  code_capacity_threshold:
    - 'Bit-flip noise: \hyperref[topic:pseudo-threshold]{pseudo-threshold} of \(5.28(5)\%\) under the small-size matching decoder \cite[Table III]{arxiv:2603.05402}.'


