code_id: bb288
physical: qubits
logical: qubits

name: '\([[288,12,18]]\) double-gross code'
introduced: '\cite{arxiv:2308.07915}'

alternative_names:
  - '\([[288,12,18]]\) two-gross code'
  - '\((12,12)\) BB6 code'

description: |
  A bivariate bicycle (BB) code with parameters \([[288,12,18]]\) and weight-six stabilizer generators \cite{arxiv:2308.07915}.

  One defining presentation uses \((\ell,m)=(12,12)\) with \(x^{\ell}=y^{m}=1\), and
  \(A=x^3+y^2+y^7\), \(B=y^3+x+x^2\) in \(\mathbb{F}_2[x,y]/(x^{\ell}-1,y^{m}-1)\) \cite[Table 3]{arxiv:2308.07915}.

features:
  rate: 'Ancilla-added encoding rate is \(1/48\), using \(n_a=n=288\) ancilla qubits.'

  fault_tolerance:
    - 'The depth-8 syndrome-extraction circuit introduced with the code has \hyperref[topic:effective-distance]{circuit-level distance} at most \(18\) \cite{arxiv:2308.07915}.'
    - |
      A reconstruction of that circuit has an undetectable logical error made of \(16\) faults \cite{doi:10.5281/zenodo.23630980}.
      Its circuit-level distance is therefore at most \(16\).
      The memory experiment follows Ref. \cite{arxiv:2511.15177}, with ideal initialization, \(18\) noisy syndrome cycles under Z-type circuit noise, and one fault-free cycle.
      Each Pauli component of a noise channel counts as one fault.
    - |
      The same upper bound of \(16\) holds for every circuit in a family of \(22{,}608\) valid depth-8 syndrome-extraction circuits, counted up to a global time shift \cite{doi:10.5281/zenodo.23630980}.
      Each circuit in the family uses one ancilla per check and only CNOT gates.
      Each ancilla is prepared, takes part in its six CNOT gates in six consecutive steps, and is then measured.
      All X checks share one CNOT order and timing, and all Z checks share another.
      The bound is for circuit-level noise in which each single-Pauli fault, including a fault on an idle data qubit, counts as one fault \cite{doi:10.5281/zenodo.23630980}.


