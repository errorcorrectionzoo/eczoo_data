code_id: dhlv
physical: qubits
logical: qubits

name: 'Dinur-Hsieh-Lin-Vidick (DHLV) code'
short_name: 'DHLV'
introduced: '\cite{arxiv:2206.07750}'

description: 'A family of asymptotically good QLDPC codes which are related to expander LP codes in that the roles of the check operators and physical qubits are exchanged.'

features:
  rate: 'Asymptotically good QLDPC codes.'

  transversal_gates:
    - 'Transversal logical \(CZ\) gates on \(\Theta(n)\) disjoint logical-qubit pairs between a DHLV code and the DHLV code with dual local codes, after a repetition encoding \cite[Thm. 4.22]{arxiv:2512.21922}. The physical circuit evaluates the cup product of degree-one cochains on a fundamental class, which Poincaré duality makes a perfect pairing of the two codes'' \(X\)-type logical operators \cite[Cor. 4.21]{arxiv:2512.21922}.'

  decoders:
    - 'Linear-time decoder utilizing the small set-flip decoder \cite{arxiv:1504.00822} for \(Z\) errors and a reconstruction procedure for \(X\) errors \cite{arxiv:2206.07750}.'

relations:
  parents:
    - code_id: qubit_generalized_homological_product_css
    - code_id: lifted_product
      detail: 'DHLV codes are LP codes that can be obtained from a balanced product of two expander codes \cite[Footnote 7]{arxiv:2403.03651}.'
  cousins:
    - code_id: good_qldpc
      detail: 'DHLV code construction yields asymptotically good QLDPC codes. A DHLV code and the DHLV code with dual local codes admit transversal logical \(CZ\) gates on \(\Theta(n)\) disjoint logical-qubit pairs, after a repetition encoding \cite[Thm. 4.22]{arxiv:2512.21922}.'
    - code_id: regular_binary_tanner
      detail: 'Regular binary Tanner codes are used in constructing quantum DHLV codes.'
    - code_id: tensor
      detail: 'Tensor codes are used in constructing quantum DHLV codes.'
    - code_id: topological
      detail: 'DHLV codes are expected to realize topological quantum spin glass order \cite{arxiv:2412.13248}.'


