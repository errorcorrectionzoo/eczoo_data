code_id: mitten
physical: qubits
logical: qubits

name: 'Mitten code'
introduced: '\cite{arxiv:2607.28795}'

description: |
  Member of a family of \hyperref[code:lifted_product]{LP codes} \(\mathrm{LP}(A,B)\) with one-by-two base matrices \(A=[a_0~a_1]\) and \(B=[b_0~b_1]\) whose entries are weight-three elements of the group algebra \(\mathbb{F}_2[G]\) of a non-Abelian group \(G\) \cite{arxiv:2607.28795}.
  The \(G\)-\hyperref[topic:lifting]{lift} of this shape yields five blocks of \(|G|\) data qubits and two blocks each of \(X\)- and \(Z\)-type checks, hence check weight nine and encoding rate at least \(20\%\).
  A non-Abelian \(G\) evades the distance ceiling of Abelian lifts of the same shape, allowing distances of about \(20\) with a few hundred data qubits.

  In the canonical form of the base matrices,
  \begin{align}
    A = [\,g_1+g_2+g_3~~e+g_4+g_5\,]~,\qquad B = [\,h_1+h_2+h_3~~e+h_4+h_5\,]~,
  \end{align}
  \(e\) is the identity and \(g_i,h_i\) are group elements, and the left regular representation of \(a_1\) and the right regular representation of \(b_1\) are required to be full rank \cite{arxiv:2607.28795}.
  Each row of the block check matrices spans five column blocks, four similar ones (the \textit{fingers}) carrying one regular action of \(G\) and a distinguished one (the \textit{thumb}) carrying the other, whence the name.
  The full-rank condition guarantees a canonical logical basis related by the group action, which underlies the modular surgery toolkit \cite{arxiv:2607.28795}.

  Instances include a \([[540,108,18]]\) code over \(C_9 \rtimes C_{12}\) \cite{arxiv:2607.28795}.
  See Ref. \cite[Table I]{arxiv:2607.28795} for eight instances from \([[150,30,10]]\) to \([[975,195,\leq 24]]\) and their lift groups.

protection: |
  For an Abelian lift group, the minimum-weight codeword of the first base matrix produces a logical operator of that weight \cite{arxiv:2607.28795}.
  This caps the distance at the weight of the base matrices, hence at six for this shape.

features:
  rate: 'Every reported instance realizes an encoding rate of exactly \(20\%\) \cite{arxiv:2607.28795}.'

  general_gates:
    - |
      Mitten codes admit a canonical logical basis \cite{arxiv:2607.28795}.
      Its \(X\)-type and \(Z\)-type logical operators each form a single orbit of the group action on the operator labeled by the identity element.
      Each logical operator is supported on only two of the five data blocks, and the supports of a conjugate pair intersect in exactly one data qubit.
      This structure yields a modular logical toolkit based on graph surgery \cite{arxiv:2607.28795}.
      All Clifford operations follow either from bridging two reusable seed surgery gadgets of tens of qubits each, or from a single fixed extractor \cite{arxiv:2607.28795}.
      The extractor can measure any logical Pauli product.
    - |
      Many logical measurements can be executed in parallel by parallel surgery \cite{arxiv:2607.28795}.
      Magic states can be injected into all logical qubits at once, supplying the non-Clifford resource for universal computation \cite{arxiv:2607.28795}.

  decoders:
    - |
      Telescoping decoder, which sends progressively harder shots through successive BP, Relay-BP, and integer-programming stages \cite{arxiv:2607.28795}.

  fault_tolerance:
    - |
      Syndrome-extraction schedules found with sQetch are estimated to preserve circuit-level distance for the reported instances other than the \([[150,30,10]]\) code \cite{arxiv:2607.28795}.
      The best schedule for the \([[150,30,10]]\) code has estimated circuit-level distance eight \cite{arxiv:2607.28795}.
      Surgery schedules are likewise estimated to preserve distance \cite{arxiv:2607.28795}.

  threshold:
    - |
      Circuit-level depolarizing noise with no idling noise: effective finite-size threshold of about \(0.7\%\) for the family as a memory \cite{arxiv:2607.28795}.
    - |
      Under the same noise model and without extrapolation, the \([[300,60,14]]\) code attains a block logical error rate of about \(10^{-11}\) per round at \(0.1\%\) physical error rate \cite{arxiv:2607.28795}.
      At \(0.4\%\), the \([[975,195,\leq 24]]\) code reaches about \(4\times 10^{-8}\), nearly two orders of magnitude below a \([[112320,195,24]]\) stack of rotated surface codes decoded by MWPM \cite{arxiv:2607.28795}.
      The mitten code uses two orders of magnitude fewer physical qubits than the stack.
      Decoding \(15\) billion logical surgery operations on the \([[540,108,18]]\) code at \(0.1\%\) yielded two logical failures \cite{arxiv:2607.28795}.


