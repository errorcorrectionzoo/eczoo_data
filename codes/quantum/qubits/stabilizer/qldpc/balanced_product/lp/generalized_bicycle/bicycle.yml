code_id: bicycle
physical: qubits
logical: qubits

name: 'Bicycle code'
introduced: '\cite{arxiv:quant-ph/0304161}'

description: |
  An even-length CSS code whose stabilizer generator matrix blocks are \(H_{X}=H_{Z}=(A|A^T)\), where \(A\) is a sparse circulant matrix.
  The fact that \(A\) commutes with its transpose ensures that the CSS condition is satisfied.
  Bicycle codes are the first QLDPC codes.

  A notable example is an \([[2^n,2^{(n+1)/2},2^{(n-1)/2}]]\) code constructed from the repetition code and the Cayley graph of \(\mathbb{Z}_2^n\) \cite{arxiv:1206.2656}.

relations:
  parents:
    - code_id: self_dual_css
      detail: 'Bicycle codes use the same check matrix \(H_X=H_Z=(A|A^T)\) for both check types \cite{arxiv:quant-ph/0304161}. Their \(X\)- and \(Z\)-type stabilizer spaces therefore coincide.'
    - code_id: generalized_bicycle
      detail: |
        A GB code whose circulants satisfy \(B = A^T\) reduces to a bicycle code.
    - code_id: mirror
      detail: 'Bicycle codes are mirror codes up to qubit permutations and Hadamard gates \cite[Prop. 3.21]{arxiv:2603.05496}.'


