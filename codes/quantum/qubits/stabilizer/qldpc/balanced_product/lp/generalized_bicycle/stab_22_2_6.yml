code_id: stab_22_2_6
physical: qubits
logical: qubits

name: '\([[22,2,6]]\) shortened Golay code'
short_name: '\([[22,2,6]]\)'
introduced: '\cite{arxiv:1703.07847}'

description: |
  Self-dual doubly even CSS code on 22 physical qubits encoding two logical qubits with distance six.
  The code is constructed from the self-orthogonal \([22,10,8]\) code obtained by shortening the \([24,12,8]\) extended Golay code on two bits \cite[Appx. A.1.5]{arxiv:1703.07847}.
  Since the automorphism group of the extended Golay code is 5-transitive, the code does not depend on which two bits are chosen \cite{arxiv:1703.07847}.
  The code is also a \hyperref[topic:symplectic-doubling]{symplectic double} of a \hyperref[topic:quantum-weight-enumerator]{pure} \([[11,1,3]]\) stabilizer code.

protection: |
  Detects errors on up to five qubits and corrects errors on up to two qubits.

features:
  transversal_gates:
    - 'Code automorphisms and fold-transversal gates generate the full two-qubit \hyperref[topic:clifford]{Clifford group} \cite{arxiv:2606.05044}.'

relations:
  parents:
    - code_id: maximal_cube_root
      detail: 'The \([[22,2,6]]\) shortened Golay code is permutation-equivalent to the MCR code with \(\ell=11\), \(f=x+1\), \(p=1\), and \(q=x^9+x^5+x^4+x^3+x\) \cite{arxiv:2606.05044}.'
    - code_id: self_dual_css
      detail: 'The \([[22,2,6]]\) shortened Golay code is the self-dual CSS code of the doubly even self-orthogonal \([22,10,8]\) code obtained by shortening the extended Golay code on two bits \cite[Appx. A.1.5]{arxiv:1703.07847}.'
    - code_id: bipartite_cyclic_cluster
      detail: 'The \([[22,2,6]]\) shortened Golay code is permutation-equivalent to a BCC code with \(\mathcal{S}=\{1,3,5,9,15\}\), saturating the BCC distance bound \(d\leq|\mathcal{S}|+1\) \cite{arxiv:2509.06865}.'
  cousins:
    - code_id: qubit_golay
      detail: 'The \([[22,2,6]]\) shortened Golay code is obtained by shortening the extended Golay code on two bits, while the qubit Golay code is obtained by shortening on one bit \cite[Appx. A.1.5]{arxiv:1703.07847}.'


