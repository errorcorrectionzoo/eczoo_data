code_id: cyclic_hgp
physical: qubits
logical: qubits

name: 'Cyclic hypergraph product code'
short_name: 'CxC'
introduced: '\cite{arxiv:2511.09683}'

description: |
  Hypergraph product code constructed from two circulant matrices, typically of low weight. The \(\mathrm{C2}\) subfamily is the product of a cyclic LDPC code with itself, while the \(\mathrm{CxR}\) subfamily is the product of the cyclic code with a repetition code \cite{arxiv:2511.09683}.

  The construction of \(\mathrm{C2}\) uses a single generating polynomial \(\sum a_ix^i\) for both factors, while the construction of \(\mathrm{CxR}\) uses the generating polynomial \(\sum a_ix^i\) along with the polynomial \(1+x\), where \(a_i\in\{0,1\}\).

protection: |
  A CxC code built from circulant matrices \(A\) and \(B\) of sizes \(a\) and \(b\) and ranks \(r_a\) and \(r_b\) has parameters \([[2ab,2(a-r_a)(b-r_b),\min(d_A,d_B)]]\), where \(d_A\) and \(d_B\) are the distances of the two classical codes \cite{arxiv:2511.09683}.
  Such codes satisfy \textit{balance criteria}: they have equal numbers of \(X\)- and \(Z\)-type stabilizer generators, \(\text{rank}(H_X)=\text{rank}(H_Z)=(n-k)/2\), and all generators have the same weight \(w(A)+w(B)\).
  This yields near-identical performance in the \(X\) and \(Z\) logical bases, which is not guaranteed for a general HGP code \cite{arxiv:2511.09683}.

features:
  decoders:
    - 'BP-OSD decoder \cite{arxiv:2511.09683}.'


relations:
  parents:
    - code_id: hypergraph_product
      detail: 'A CxC code is a hypergraph product code constructed using two circulant matrices \cite{arxiv:2511.09683}.'
    - code_id: abelian_2bga
      detail: 'A CxC code is an Abelian 2BGA code over \(\mathbb{Z}_{n_1}\times\mathbb{Z}_{n_2}\) whose two group-algebra elements are polynomials in disjoint variables, \(a=a(x)\) and \(b=b(y)\); trivially intersecting supports turn a two-block code into a hypergraph product \cite[Statements 8 and 12]{arxiv:2306.16400}\cite{arxiv:2601.18879}.'
  cousins:
    - code_id: qc_ldpc
      detail: 'A classical cyclic LDPC code with parameters \([n,k,d]\) yields a \(\mathrm{C2}\) code with parameters \([[2n^2,2k^2,d]]\) and a \(\mathrm{CxR}\) code with parameters \([[2nd,2k,d]]\) \cite{arxiv:2511.09683}.'
    - code_id: lacross
      detail: 'Periodic-boundary La-cross codes are CxC codes built from the seed polynomial \(1+x+x^k\); the open-boundary La-cross family instead uses a rectangular full-rank seed \cite{arxiv:2404.13010}.'
    - code_id: generalized_bicycle
      detail: 'CxC codes and GB codes both use circulant matrices as building blocks \cite{arxiv:2511.09683}.'


