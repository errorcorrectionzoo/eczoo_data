code_id: bt_81_3_5
physical: qubits
logical: qubits

name: '\([[81,3,5]]\) bivariate tricycle code'
introduced: '\cite{arxiv:2510.07269}'

alternative_names:
  - '\([[81,3,5]]\) BT code'

description: |
  Tricycle code over \(\mathbb{F}_2[x,y]/(x^3+1,y^9+1)\) with binomial elements \(a=xy^3+x^2y\), \(b=1+xy^8\), and \(c=x^2y^4+x^2y^6\) \cite[Table III]{arxiv:2510.07269}.
  Its 2D component code, obtained by dropping \(c\), is the \([[54,2,6]]\) \hyperref[code:qcga]{BB code} \cite{arxiv:2510.07269}.
  Since \(c=(y^3+y^4)a+(xy^6+xy^7)b\) lies in the ideal \((a,b)\), a one-way transversal CNOT from the tricycle code couples the two BB logical qubits one-to-one to two of the three tricycle logical qubits \cite[Appx. C]{arxiv:2510.07269}.

  The two qubit blocks of the BB code are the \(a\)- and \(b\)-blocks of the tricycle code.
  The CNOT acts between each tricycle qubit in these blocks and its BB partner \cite{arxiv:2510.07269}.
  One-bit teleportation through this CNOT switches logical qubits between the two codes \cite{arxiv:2510.07269}.
  The 27 \(X\)-type checks have weight six, and the 81 \(Z\)-type checks have weight four.
  The three qubit blocks can be placed on a triangular lattice on a \(3\times 9\) torus with translationally invariant checks \cite[Appx. D]{arxiv:2510.07269}.

protection: 'The distance \(d=5\) is the \(Z\)-distance, and the \(X\)-distance is larger \cite[Appx. F]{arxiv:2510.07269}.'

features:
  general_gates:
    - 'A depth-two circuit of physical \(CCZ\) gates across three code blocks realizes a nontrivial logical \(CCZ\) circuit via the cup product \cite{arxiv:2510.07269}.'

  fault_tolerance:
    - |
      Magic states are prepared by single-shot logical \(|+\rangle\) preparation on three code blocks, the depth-two \(CCZ\) circuit, and postselection on the final \(X\)-type detectors \cite{arxiv:2510.07269}.
      At circuit-level depolarizing noise of strength \(10^{-3}\), with the \(CCZ\) gates replaced by approximate Pauli error channels, the postselected logical error rate is about \(2\times 10^{-10}\) at success probability \(0.35\) \cite[Table II]{arxiv:2510.07269}.

relations:
