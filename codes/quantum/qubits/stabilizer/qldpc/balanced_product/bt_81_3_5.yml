      detail: 'The \([[81,3,5]]\) bivariate tricycle code is the tricycle code over \(\mathbb{Z}_3\times\mathbb{Z}_9\) with binomial elements \(a=xy^3+x^2y\), \(b=1+xy^8\), and \(c=x^2y^4+x^2y^6\) \cite[Table III]{arxiv:2510.07269}.'
    - code_id: 2d_stabilizer
      detail: 'The \([[81,3,5]]\) bivariate tricycle code embeds on a triangular lattice on a \(3\times 9\) torus with three qubits per site and translationally invariant \(X\)- and \(Z\)-type checks \cite[Appx. D]{arxiv:2510.07269}.'
  cousins:
    - code_id: qcga
      detail: |-
        The \([[54,2,6]]\) BB code with \(a=xy^3+x^2y\) and \(b=1+xy^8\) is the 2D component code of the \([[81,3,5]]\) bivariate tricycle code \cite{arxiv:2510.07269}.
        A one-way transversal CNOT from the tricycle code to the BB code couples the two BB logical qubits to two of the three tricycle logical qubits \cite{arxiv:2510.07269}.
        One-bit teleportation through it switches logical qubits between the two codes \cite{arxiv:2510.07269}.


