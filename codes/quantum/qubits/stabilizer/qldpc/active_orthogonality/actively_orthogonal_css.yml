code_id: actively_orthogonal_css
physical: qubits
logical: qubits

name: 'Actively orthogonal CSS code'
introduced: '\cite{arxiv:2601.08824,arxiv:2608.07431}'

description: |
  Qubit CSS code whose stabilizer generator matrices are the first \(J\) block rows, the \textit{active} rows, of a pair of block-circulant parent matrices \(\hat{H}_X\) and \(\hat{H}_Z\), with the CSS orthogonality condition imposed only among those rows \cite{arxiv:2601.08824}.
  The discarded \textit{latent} rows need not commute with the active checks of the opposite type, so neither they nor their low-weight combinations automatically become logical operators.
  The distance can therefore exceed the stabilizer generator weight at rate at or above one half.

  If the parents were orthogonal, every latent row would commute with all active checks, and a latent row outside the stabilizer row space would be a logical operator of weight equal to its row weight.
  This caps the distance of any row-deleted fully orthogonal construction at the stabilizer generator weight \cite{arxiv:2601.08824}.
  The parents have \(L/2\) block rows and \(L\) block columns and are assembled by a \(G\)-\hyperref[topic:lifting]{lift}, in which every nonzero entry of a circulant proto-matrix is replaced by a permutation matrix drawn from a group \(G\).
  Each block row of \(\hat{H}_X\) is a cyclic shift of the lifts \(\mathcal{F}=\{F_i\}\) in its left half and of the lifts \(\mathcal{G}=\{G_i\}\) in its right half.
  The matrix \(\hat{H}_Z\) holds the transposed lifts with the two halves exchanged and the shift reversed \cite{arxiv:2601.08824}.
  Because both parents are block circulant, the \((i,j)\) block of \(\hat{H}_X\hat{H}_Z^T\) depends only on the offset \(j-i\) and collects the commutators of all lift pairs whose indices sum to that offset.
  Requiring \([F_i,G_j]=0\) for every index pair \((i,j)\) in a chosen \textit{active set} \(\Gamma\) that covers the offsets between active rows makes these blocks vanish for all \(0 \leq i,j < J\), so the retained rows define a CSS code \cite{arxiv:2601.08824}.
  Commutation is deliberately broken for at least one pair outside \(\Gamma\), which keeps some block between an active and a latent row nonzero.

  \hyperref[code:kasai]{Kasai codes} draw the lifts from the affine permutation group, and \hyperref[code:gala]{GALA codes} from a product of a small non-Abelian \textit{top factor}, which decides the commutation pattern, and an Abelian \textit{bottom factor}, which supplies code automorphisms \cite{arxiv:2601.08824,arxiv:2608.07431}.
  When the top factor is Abelian or trivial, no pair fails to commute and the parent matrices are fully orthogonal \cite{arxiv:2608.07431}.
  Polynomial variants replace a single permutation in each lift entry by a sum of group elements \cite{arxiv:2608.07431}.
  Loose active orthogonality then requires only the aggregate commutator sum at each active offset to vanish, rather than every contributing pair commuting individually \cite{arxiv:2608.07431}.
  These variants remain actively orthogonal, but the pairwise condition above and the sharp monomial bounds below no longer apply.

protection: |
  Retaining \(J\) block rows in each basis yields encoding rate at least \(1-2J/L\), so that \(J \leq L/4\) guarantees rate at least one half \cite{arxiv:2608.07431}.
  Girth eight is attained by the original Kasai code \cite{arxiv:2601.08824} and girth at least six by most of the compact GALA instances \cite{arxiv:2608.07431}.

  Any latent-row combination that commutes with the opposite-type active checks but lies outside the same-type stabilizer row space is a logical operator, and the least weight of such a combination upper bounds the minimum distance \cite{arxiv:2601.08824}.

  The sharpest limitations are proved for strict monomial GALA and Kasai lifts, for which every stabilizer row has weight \(L\) \cite{arxiv:2608.07431}.
  Taking \(J>L/4\) forces full orthogonality of the parents.
  Provided at least one latent row lies outside the retained row space of its type, that row is a weight-\(L\) logical operator and \(d\leq L\).
  If every latent row is already in the retained row space, the retained code equals its fully orthogonal parent and this augmentation argument supplies no distance bound.
  At the other extreme, \(J\leq 2\) gives \(d\leq g/2\), where \(g\) is the Tanner-graph girth.
  Thus a monomial lift can break the weight barrier only in the window \(L\geq 12\) and \(2<J\leq L/4\), apart from the possibility of a block length exponential in the target distance.

