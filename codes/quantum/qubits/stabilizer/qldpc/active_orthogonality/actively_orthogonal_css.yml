    - code_id: two_block_quantum
      detail: 'Retaining the first \(J\) block rows of the parent matrices \(\hat{H}_X=[F|G]\) and \(\hat{H}_Z=[G^{T}|F^{T}]\) gives \(H_X=(A_1,B_1)\) and \(H_Z=(B_2^{T},A_2^{T})\). Here \(A_1,B_1\) are the active block rows of the two block circulants and \(A_2,B_2\) their active block columns. Active orthogonality \(H_XH_Z^{T}=0\) is exactly the two-block condition \(A_1B_2-B_1A_2=0\), and the GALA sectors are defined as two-block CSS codes outright \cite[Defs. 4, 6, and 8]{arxiv:2608.07431}\cite{arxiv:2601.08824}.'
  cousins:
    - code_id: pair_partition_css
      detail: 'Both families impose CSS orthogonality algebraically rather than through a product construction, but by different mechanisms. Pair-partition CPM codes match column types in pairs so that every overlap between an \(X\)-type and a \(Z\)-type generator occurs an even number of times \cite{arxiv:2607.14091}.'
    - code_id: two_branch_css
      detail: 'Both families impose CSS orthogonality algebraically rather than through a product construction, but by different mechanisms. Two-branch coset CSS codes reduce the commutation condition to equalities and disjointness conditions on multiplicative cosets of a finite field \cite{arxiv:2605.23894}.'
    - code_id: lifted_product
      detail: 'LP codes enforce the CSS orthogonality condition as an algebraic identity on all rows, whereas actively orthogonal CSS codes impose it only on the retained rows \cite{arxiv:2601.08824,arxiv:2608.07431}.'


