code_id: pair_partition_css
physical: qubits
logical: qubits

name: 'Pair-partition CPM code'
introduced: '\cite{arxiv:2607.14091,arxiv:2609.30069}'

description: |
  Qubit CSS code whose \(X\)- and \(Z\)-type stabilizer generator matrices are \(J\)-by-\(L\) arrays of \(P\)-by-\(P\) circulant permutation matrices (CPMs), with the CSS condition enforced by pairing up block columns \cite{arxiv:2607.14091,arxiv:2609.30069}.
  Each block of \(H_XH_Z^T\) is a sum of \(L\) CPMs, one per block column.
  A \textit{pair partition}, one per block, splits the block columns into \(L/2\) pairs, and the CPM exponents are constrained so that the two CPMs in each pair coincide and cancel over \(\mathbb{F}_2\).
  CSS orthogonality thereby becomes a homogeneous linear condition on the exponents \cite{arxiv:2607.14091}.

  Fix a column weight \(J\), an even row weight \(L>J\), and a lift size \(P\).
  Let \(C(s)\) be the \(P\)-by-\(P\) CPM with shift \(s\in\mathbb{Z}_P\), and let \((e_{i\ell})\) and \((d_{j\ell})\) be \(J\)-by-\(L\) exponent arrays over \(\mathbb{Z}_P\).
  The generator matrices \(H_X=(C(e_{i\ell}))\) and \(H_Z=(C(d_{j\ell}))\) are \(G\)-\hyperref[topic:lifting]{lifts} of the complete \(J\)-by-\(L\) protograph over the cyclic group of order \(P\), with length \(n=LP\), row weight \(L\), and column weight \(J\).
  A \(J\)-by-\(J\) array \((M_{ij})\) of pair partitions, one for each \(X\)-type block row \(i\) and \(Z\)-type block row \(j\), is fixed before the exponents.
  For each pair \(\{u,v\}\in M_{ij}\), the mixed-difference equation \(e_{iu}-d_{ju}=e_{iv}-d_{jv}\) is imposed.
  It makes the contributions of block columns \(u\) and \(v\) to block \((i,j)\) of \(H_XH_Z^T\) identical.
  The exponents are solutions of the resulting homogeneous system over \(\mathbb{Z}_P\) \cite{arxiv:2607.14091}.
  The rate is at least the design rate \(1-2J/L\) \cite{arxiv:2609.30069}.

  Suppose the exponent arrays satisfy \(d_{j\ell}=\eta\,e_{\rho(j)\sigma(\ell)}+\alpha_j+\beta_\ell\) for a block-row permutation \(\rho\), a fixed-point-free involution \(\sigma\) of the block columns, \(\eta^2\equiv 1 \pmod P\), and offsets with \(\beta_{\sigma(\ell)}=-\eta\beta_\ell\).
  Then the qubit involution \((\ell,t)\mapsto(\sigma(\ell),\eta(t+\beta_\ell))\) exchanges the two check spaces, and the code can be \hyperref[topic:symplectic-doubling]{symplectically halved} into a non-CSS stabilizer code on \(LP/2\) qubits \cite{arxiv:2609.30069}.
  Halved codes reach a given distance at shorter length than pair-partition CPM codes with the same \((J,L)\) \cite[Sec. IV.B]{arxiv:2609.30069}.
  Examples include the \([[90,21,11]]\), \([[140,31,15]]\), and \([[200,43,20]]\) codes with check weight ten \cite[Table II]{arxiv:2609.30069}.

  For odd \(P\), suppose both check matrices have rank \(J\) over each nontrivial field factor of \(R=\mathbb{F}_2[\mathbb{Z}_P]\).
  Then each logical space is the \(R\)-module \(R^{L-2J}\oplus\mathbf{1}^{2J-2}\), i.e., \(L-2J\) regular orbits of the cyclic shift plus \(2J-2\) shift-invariant logical classes \cite{arxiv:2609.30069}.

  Reported instances include the \((3,10)\)-regular \([[2230,896,24]]\) code with \(P=223\) and Tanner girth eight \cite[Table I]{arxiv:2607.14091}.
  See Refs. \cite[Table I]{arxiv:2607.14091}\cite[Table VIII]{arxiv:2609.30069} for lists of instances.

protection: |
  Every CPM lift of the complete \(J\)-by-\(L\) protograph with \(J\geq 2\) and \(L\geq 3\) has Tanner girth at most twelve \cite{arxiv:2607.14091}.
  For odd \(P\), \(J\geq 2\), \(L\geq 2J+1\), and maximal binary ranks \(\operatorname{rank}H_X=\operatorname{rank}H_Z=J(P-1)+1\), permanent-based logical witnesses give the lift-size-independent bound \(d_X,d_Z,d\leq (J+1)!\) \cite{arxiv:2607.14091}\cite[App. A]{arxiv:2609.30069}.

  The thirty-six reported codes have exact distances reaching \(24\) and rates reaching \(0.574\), attained by the \([[1414,812,12]]\) code \cite{arxiv:2607.14091}.
  Twenty-nine of them have Tanner girth six and seven have girth eight \cite[Table I]{arxiv:2607.14091}.

features:
  decoders:
    - 'Sum-product or normalized min-sum BP followed by \textit{CPM-aware residual-syndrome decoding}, a bounded-weight correction search that exploits invariance under simultaneous cyclic shifts \cite[App. F]{arxiv:2609.30069}.'
    - 'Hierarchical decoder with BP, relay-BP, and integer-programming stages \cite{arxiv:2604.16209,arxiv:2609.30069}.'

  fault_tolerance:
    - 'Block-wise scheduling of the protograph gives syndrome-extraction circuits of depth equal to the check weight for the \([[530,216,12]]\) and \([[518,228,16]]\) codes \cite[Sec. VI.B]{arxiv:2609.30069}. Their circuit-level distances are at most \(10\) and \(14\), respectively.'
    - 'Idling-free circuit-level noise of Ref. \cite{arxiv:2604.16209} at \(0.1\%\): per-round logical error rates of \(2.1\times 10^{-9}\) for the \([[530,216,12]]\) code and \(1.5\times 10^{-10}\) for the \([[518,228,16]]\) code \cite[Sec. VI.B]{arxiv:2609.30069}.'

relations:
  parents:
    - code_id: qubit_css
    - code_id: qldpc
      detail: 'Both stabilizer generator matrices are sparse arrays of circulant permutation matrices with constant column weight \(J\) and constant row weight \(L\) \cite{arxiv:2607.14091}. The reported instances have Tanner girth at least six \cite{arxiv:2607.14091}.'
    - code_id: quasi_cyclic_qldpc
      detail: |
        Both stabilizer generator matrices of a pair-partition CPM code are arrays of circulant permutation matrices.
        This structure makes the code invariant under simultaneous cyclic shifts of the lift coordinates.
        This automorphism has order equal to the lift size \(P\) \cite{arxiv:2607.14091}.
  cousins:
    - code_id: two_branch_css
      detail: |
        Both pair-partition CPM codes and two-branch coset CSS codes realize CSS commutation by matching overlaps in pairs \cite{arxiv:2607.14091,arxiv:2605.23894}.
        The pair-partition construction parameterizes the matching as a free combinatorial array of pair partitions solved by linear paired-difference equations.
        The two-branch construction induces the matching from the structure of a multiplicative subgroup of a finite field.
    - code_id: kasai
      detail: |
        Replacing the circulant permutation matrices by affine permutation matrices extends the pair-partition construction.
        A structured subfamily of that extension has the same check matrices as the active rows of Kasai codes.
        A separate condition on the pair partitions reproduces the complementary latent rows \cite{arxiv:2607.14091,arxiv:2601.08824}.
    - code_id: perm_self_dual_css
      detail: |
        A pair-partition CPM code is a PSD code when its exponent arrays satisfy \(d_{j\ell}=\eta\,e_{\rho(j)\sigma(\ell)}+\alpha_j+\beta_\ell\) \cite{arxiv:2609.30069}.
        Here \(\rho\) permutes block rows, \(\sigma\) is a fixed-point-free involution of block columns, \(\eta^2\equiv 1 \pmod P\), and \(\beta_{\sigma(\ell)}=-\eta\beta_\ell\).
        The duality is the fixed-point-free qubit involution \((\ell,t)\mapsto(\sigma(\ell),\eta(t+\beta_\ell))\), so the code is the \hyperref[topic:symplectic-doubling]{symplectic double} of a non-CSS code on \(LP/2\) qubits.


