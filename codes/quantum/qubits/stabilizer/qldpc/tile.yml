code_id: tile
physical: qubits
logical: qubits

name: 'Tile qubit code'
introduced: '\cite{arxiv:2504.08887,arxiv:2504.09171}'

description: |
  Member of a family of two-dimensionally local CSS \hyperref[code:qldpc]{QLDPC} codes on a planar square lattice with open boundaries, generalizing the \hyperref[code:surface]{surface code} by allowing stabilizer generators of weight greater than four whose supports are confined to a box of fixed size \((D+1)\times(D+1)\) rather than to nearest-neighbor edges only. Data qubits sit on the edges of the lattice and stabilizer checks (\textit{tiles}) are placed at its vertices in a translationally invariant fashion in the bulk.

  A tile code is specified by a \textit{local structure}---a pair of \(X\)- and \(Z\)-type stabilizer tiles confined to a box of size \((D+1)\times(D+1)\) and chosen so that any relative placement of an \(X\)- and a \(Z\)-tile has even overlap (ensuring commutativity)---together with a \textit{global structure}, a rectangular layout of bulk-stabilizer positions. Boundary stabilizers are then added on the four sides, after which qubits not supported by any stabilizer and stabilizers with empty support are removed. Under two conditions, the construction yields an \([[n,k,d]]\) code with logical dimension \(k=2D^2\) \cite{arxiv:2511.14589}. The conditions are that the tiles not be confined to a strip of width or height \(D\) and that they give rise to \textit{total topological order}, a strengthening of topological order requiring that any local Pauli operator commuting with all stabilizers included in a quadrant of the plane be a product of included stabilizers \cite{arxiv:2511.14589}. Under the same conditions, the logical operators admit a canonical symplectic basis localized along the lattice boundary and generated by a cellular automaton with \(2D^2\) update rules, making them amenable to lattice-surgery techniques \cite{arxiv:2511.14589}. Boundary layouts that admit commuting corner stabilizers reduce the logical dimension by one per added corner stabilizer. The construction admits higher-dimensional generalizations \cite[Sec. 5.4]{arxiv:2511.14589}, but the term \textit{tile code} refers by default to the two-dimensional case treated here.

  With a \(3\times 3\) box and weight-6 stabilizers, the construction yields a \([[288,8,12]]\) code (first found in Ref. \cite{arxiv:2504.08887}), a fourfold improvement in the code-parameter efficiency \(kd^2/n\) over the \hyperref[code:rotated_surface]{rotated surface code}. Weight-8 stabilizers in a \(3\times 3\) box give a \([[288,8,14]]\) code, and in a \(4\times 4\) box they give \([[288,18,13]]\) and \([[512,18,19]]\) codes \cite{arxiv:2504.09171}. The last of these gains more than a factor of twelve in \(kd^2/n\) over the rotated surface code. The planar (unrotated and rotated) surface code on a square lattice, the two-dimensionally local (pruned) hypergraph-product constructions such as open-boundary \hyperref[code:lacross]{La-cross codes}, and the open-boundary (planar) versions of bivariate bicycle codes are recovered as special cases.

protection: |
  Protects against Pauli noise. Code distance scales with the lattice dimensions provided the stabilizer tiles satisfy the topological-order condition. Distances of explicit examples are estimated with a probabilistic algorithm and then confirmed exactly using integer linear programming \cite{arxiv:2504.09171}.

features:
  rate: 'Logical dimension \(k=2D^2\) for stabilizer tiles confined to a \((D+1)\times(D+1)\) box but not to a strip and satisfying the total-topological-order condition \cite{arxiv:2511.14589}. Boundary layouts admitting commuting corner stabilizers reduce this by one per added corner stabilizer. The code-parameter efficiency \(kd^2/n\) reaches 12.7 for the \([[512,18,19]]\) code, more than twelve times that of the rotated surface code \cite{arxiv:2504.09171}.'

  general_gates:
    - 'For stabilizer tiles not confined to a strip and giving rise to total topological order, derived automorphisms \(T_x\) and \(T_y\) implement products of logical CNOT gates fault-tolerantly and with low overhead by extending the lattice on one side and shrinking it on the other. Their action on the logical space is multiplication by \(x\) or \(y\) on \(\mathbb{F}_2[x^{\pm},y^{\pm}]/(f,g)\) \cite{arxiv:2511.14589}. This operation is trivial for the surface code.'

  decoders:
    - '\hyperref[code:barbell]{Barbell codes}, a subfamily of tile codes tailored to a superconducting chip layout, admit an explicit depth-\((w+4)\) syndrome-extraction cycle for weight-\(w\) stabilizers, based on superdense syndrome extraction \cite{arxiv:2312.08813,arxiv:2606.06062}.'

  fault_tolerance:
    - 'Fault-tolerant logical multi-qubit Pauli measurements, both within a single patch and between two patches, can be performed without additional connectivity requirements via the protocol of Ref. \cite{arxiv:2506.18061}.'


relations:
  parents:
    - code_id: qldpc
      detail: 'Tile codes are two-dimensionally local CSS QLDPC codes on a planar lattice with open boundaries, generalizing the surface code by allowing higher-weight checks confined to a fixed-size box.'
    - code_id: qubit_css
    - code_id: 2d_stabilizer
      detail: 'Tile codes are translationally invariant (in the bulk) 2D lattice stabilizer codes with open boundaries \cite{arxiv:2504.09171,arxiv:2606.06062}.'
  cousins:
    - code_id: surface
      detail: 'Tile codes generalize the surface code. The unrotated surface code is recovered by choosing the surface-code tiles together with an appropriate layout \cite{arxiv:2504.09171}.'
    - code_id: rotated_surface
      detail: 'The rotated surface code is recovered from the tile-code construction using a rotated layout \cite{arxiv:2504.09171}. The most efficient tile codes outperform the rotated surface code in the efficiency \(kd^2/n\) by factors of up to more than 12 \cite{arxiv:2504.09171}.'
    - code_id: qcga
      detail: 'Tile codes are open-boundary (planar) analogues of bivariate bicycle (BB) codes, which arise by tiling a torus with stabilizer tiles \cite{arxiv:2504.09171}. Tile codes instead have open boundaries and thus retain true \(O(1)\)-locality on a planar 2D lattice \cite{arxiv:2504.09171}. Sharing the same bulk stabilizer tiles does not yield the same code: the planar \([[288,8,12]]\) tile code has the same bulk stabilizers as the \((-2,2)\)-BB code, which requires a \(217\times 217\) torus to attain its maximal logical dimension \(k=16\) and yields a \([[98,6,12]]\) code on a \(7\times 7\) torus \cite{arxiv:2504.08887}. The logical dimension of a BB code is determined by the period of the same cellular automaton that generates tile-code logical operators \cite{arxiv:2511.14589}. It is expected that the QEC cycle developed for bivariate bicycle codes \cite{arxiv:2308.07915} can be adapted to tile codes \cite{arxiv:2504.09171}.'
    - code_id: hypergraph_product
      detail: 'Pruned hypergraph-product constructions of planar BB codes are recovered by the tile-code construction using an unrotated bulk-stabilizer layout \cite{arxiv:2504.09171}.'
    - code_id: lacross
      detail: 'Open-boundary La-cross codes are instances of tile codes whose stabilizers are induced by univariate polynomials \cite{arxiv:2511.14589}. La-cross codes with periodic boundary conditions have stabilizers connecting opposite array boundaries \cite{arxiv:2404.13010} and are not tile codes, since tile codes are defined on a finite planar square-lattice layout with open boundaries \cite{arxiv:2504.09171}.'
    - code_id: multivariate_multicycle
      detail: 'Tile codes and MM codes with two polynomials in two variables arise from the same three-term Koszul complex with qubits placed at the middle level: MM codes take the complex over the group algebra \(\mathbb{F}_q[x,y]/\langle x^{\ell_1}-1,y^{\ell_2}-1\rangle\), yielding periodic boundaries, while tile codes take the higher global sections \(R^1\Gamma\) of the corresponding Koszul complex of vector bundles on \(\mathbb{P}^1\times\mathbb{P}^1\), yielding open boundaries \cite{arxiv:2511.14589,arxiv:2601.18879}. The tile-code construction extends to \(t\) spatial dimensions using \((\mathbb{P}^1)^{t}\) and \(t\) polynomials in \(t\) variables, yielding codes that are local in \(t\) rather than two dimensions \cite[Sec. 5.4]{arxiv:2511.14589}. For example, the four-dimensional instance built from four polynomials in \(w,x,y,z\) with \(L=M=N=P=3\) has parameters \([[486,24,d]]\) with \(10\leq d\leq 15\) \cite{arxiv:2511.14589}, the same length and logical dimension as the \([[486,24,12]]\) MM code with \(t=4\) over \(\mathbb{Z}_3^{4}\) \cite{arxiv:2601.18879}.'
    - code_id: topological_abelian
      detail: 'The stabilizer tiles of a tile code have to give rise to topological order in the bulk for the code distance to scale with the layout dimensions \cite{arxiv:2504.09171}, and to the stronger total topological order for the logical dimension to be \(k=2D^2\) \cite{arxiv:2511.14589}. This is an extra assumption and not part of the definition: writing the \(X\)-tile as a pair of Laurent polynomials \(f,g\) over \(\mathbb{F}_2[x^{\pm},y^{\pm}]\), a sufficient algebraic criterion for total topological order is that the restrictions of \(f\) and \(g\) to each quadrant polynomial ring admit no common non-unit factor and satisfy an additional isomorphism condition \cite{arxiv:2511.14589}. Admissible tiles for which \(f\) and \(g\) share a non-unit factor, e.g., \(f=g=1+x+y\) in a \(2\times 2\) box, can yield valid tile codes such as \([[32,2,2]]\) and \([[288,2,2]]\) whose distance does not scale. Planar tile codes can be obtained from bivariate bicycle codes by condensing anyons of the underlying Abelian topological order at the boundary \cite{arxiv:2504.08887}.'


