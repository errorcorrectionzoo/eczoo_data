code_id: 3d_color
physical: qubits
logical: qubits

name: '3D color code'
introduced: '\cite{arxiv:cond-mat/0607736}'
# https://commons.wikimedia.org/wiki/Category:Uniform_tilings_of_Euclidean_3-space

description: |
  Color code defined on a four-valent, four-colorable 3-colex in a 3-manifold.
  In the original colex realization, qubits sit on vertices, \(X\)-type stabilizers are attached to 3-cells, and \(Z\)-type stabilizers are attached to faces \cite{arxiv:cond-mat/0607736}.

  For a closed 3-manifold, the code encodes \(k=3h_1\) logical qubits, where \(h_1\) is the first Betti number over \(\mathbb{Z}_2\) \cite{arxiv:cond-mat/0607736}.
  Logical operators can be represented by colored strings and colored membranes.
  Excitations consist of point-like color charges at cell defects and loop-like color fluxes at face defects; winding a \(p\)-charge around a \(pq\)-flux produces a \(-1\) phase \cite{arxiv:cond-mat/0607736}.
  
  There are 101 different types of boundaries for any uniform tiling \cite{arxiv:2404.05033}; this was shown for the great rhombated cubic honeycomb (a.k.a. cantitruncated cubic honeycomb) uniform tiling, but is valid for general uniform tilings.
# Wikipedia for bitructated cubic honeycomb


protection: |
  On a closed 3-manifold with first Betti number \(h_1\) over \(\mathbb{Z}_2\), the 3D color code encodes \(k=3h_1\) logical qubits \cite{arxiv:cond-mat/0607736}.
  For codes with boundaries, \(Z\)-type logical operators are strings along the borders where two boundaries meet, and \(X\)-type logical operators are membranes covering a boundary.
  The minimum weight of an \(X\)-type logical operator therefore scales as the square of that of a \(Z\)-type logical operator \cite{arxiv:2512.13436}.


features:
  transversal_gates:
    - 'Transversal action of \(T\) gates on color codes on general 3-manifolds realizes a \(CCZ\) gate on three logical qubits and is related to a topological invariant that is called the triple intersection number; this gate is related to the fact that this code admits a cup product structure \cite{arxiv:2310.16982}.'
    - 'Transversal \(S\) gate on color codes on general 3-manifolds corresponds to a higher-form symmetry \cite{arxiv:2310.16982}.'
    - 'Families of 3D color codes on quasi-hyperbolic, fibre-bundle, and Torelli mapping-torus 3-manifolds support collective logical \(CCZ\) gates via transversal \(T\) and individually addressable, parallelizable logical \(CZ\) gates via transversal \(S\) on codimension-1 submanifolds. Their rate-distance scalings are \(O(1/\log n)\) with \(d=O(\log n)\), \(O(1/\log^{1/2} n)\) with \(d=\Omega(\log^{1/2} n)\), and \(O(1)\), respectively \cite{arxiv:2310.16982}.'

  general_gates:
    - 'Universal fault-tolerant computation using transversal gates and lattice surgery \cite{arxiv:2310.16982}.'
    - 'Magic-state distillation protocols \cite{doi:10.7907/059V-MG69}.'
    - 'Non-Clifford gates can be implemented via \hyperref[topic:code-switching]{code switching} \cite{doi:10.7907/059V-MG69}.'

  decoders:
    - 'Decoder that maps 3D color code to three copies of the 3D surface code \cite{arxiv:1606.00960}.'
    - '3D concatenated MWPM decoder for codes with boundaries, which extends the concatenated MWPM decoder for 2D color codes \cite{arxiv:2404.07482} to three dimensions \cite{arxiv:2512.13436}.
    The syndrome restricted to the cells of two colors is first matched with MWPM.
    Two further MWPM rounds on monochrome graphs of the third and fourth colors then lift the matched edges to a set of qubits, which is the correction.
    The lowest-weight correction among the 12 decoding paths, i.e., choices of the two restricted colors and of the lifting order, is applied \cite{arxiv:2512.13436}.
    \(X\) errors are decoded by multiplying face syndromes into cell syndromes, which reduces the effective \(X\) distance to the \(Z\) distance \cite{arxiv:2512.13436}.'
  code_capacity_threshold:
    - 'Bit- and phase-flip noise on the bcc lattice: \(0.77\%\) for point-like and \(13.1\%\) for loop-like excitations under restriction decoder \cite{arxiv:1905.07393}.'
    - 'Bit- and phase-flip noise on the \([[5d^3-12d^2+16,3,d]]\) cubic color code family \cite{arxiv:2404.19005}, whose smallest member is the \hyperref[code:stab_8_3_2]{\([[8,3,2]]\) code}: \(1.55(6)\%\) under the 3D concatenated MWPM decoder \cite{arxiv:2512.13436}.
    The \hyperref[topic:pseudo-threshold]{pseudo-threshold} is \(0.60(6)\%\), and the logical error rate scales as \(p^{d/2}\) below threshold \cite{arxiv:2512.13436}.
    A single decoding path whose restricted graph contains the color whose cells jointly cover every qubit retains this scaling with three MWPM runs, at a threshold of \(1.02(6)\%\) \cite{arxiv:2512.13436}.'

notes:
  - 'The \href{https://pypi.org/project/qCodePlot3D}{qCodePlot3D} Python package visualizes 2D and 3D color codes, error configurations, and decoding paths \cite{arxiv:2512.13436}.'


