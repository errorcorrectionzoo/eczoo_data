code_id: xyz_color
physical: qubits
logical: qubits

name: 'XYZ color code'
introduced: '\cite{arxiv:2203.16534}'

description: |
  A variant of the 6.6.6 color code whose generators are \(XZXZXZ\) and \(ZYZYZY\) Pauli strings associated to each hexagonal in the hexagonal (6.6.6) tiling. 
  A further variation called the \textit{domain wall color code} admits generators of the form \(XXXZZZ\) and \(ZZZXXX\) \cite{arxiv:2307.00054}.
  While such codes are equivalent to CSS color codes with the same distance, other properties like noise-bias performance can differ significantly.

  The \textit{3D XYZ color code} is defined on a four-colorable 3D lattice, with qubits on vertices and one generator per face \cite{arxiv:2509.18324}.
  Each face generator is an \(X\)-, \(Y\)-, or \(Z\)-type Pauli string, depending on the two color labels of the face.
  This code realizes a single copy of the \hyperref[code:3d_fermionic_surface]{3D fermionic surface code} phase \cite{arxiv:2509.18324}.
  The non-CSS model of Ref. \cite{arxiv:1012.0859} is a version of the 3D XYZ color code on a particular lattice \cite{arxiv:2509.18324}.


features:
  decoders:
    - 'Efficient ML decoder at infinite bias \cite{arxiv:2203.16534}.'
    - 'Cellular-automaton decoder \cite{arxiv:2203.16534}.'
  code_capacity_threshold:
    - '\(50\%\) threshold for noise infinitely biased towards \(X\) or \(Y\) or \(Z\) errors using cellular-automaton decoder \cite{arxiv:2203.16534}.'
    - 'Independent \(X,Y\) noise: threshold value of the sum of both noise probabilities is between \(9\%\) and \(14\%\), depending on the noise bias \cite{arxiv:2203.16534}.'


relations:
  parents:
    - code_id: twist_defect_color
  cousins:
    - code_id: triangular_color
      detail: 'The XYZ color code is obtained from the 6.6.6 color code by applying single-qubit Clifford rotations on a subset of qubits such that the \(X\)- and \(Z\)-type generators are mapped to \(XZXZXZ\) and \(ZYZYZY\), respectively.'
    - code_id: xzzx
      detail: 'The XZZX surface (XYZ color) is a non-CSS analogue of the rotated surface (6.6.6 color) code such that the two codes are related by single-qubit Clifford rotations.'
    - code_id: fracton
      detail: 'The XYZ color code resembles a Type-II fracton code in the limit of infinite noise bias \cite{arxiv:2203.16534}.'
    - code_id: 3d_fermionic_surface
      detail: 'The 3D XYZ color code realizes a single copy of the 3D fermionic surface code phase \cite{arxiv:2509.18324}.'


