code_id: three_fermion
physical: qubits
logical: qubits

name: 'Three-fermion (3F) Walker-Wang model code'
short_name: '3F Walker-Wang'
introduced: '\cite{arxiv:1302.7072,arxiv:2011.04693}'

description: |
  A 3D lattice stabilizer code whose bulk realizes a 3D time-reversal SPT order \cite{arxiv:1302.7072} and whose gapped boundary supports the 2D three-fermion (3F) topological order.
  The code can be used as a resource state for fault-tolerant MBQC \cite{arxiv:2011.04693}.

  The code is obtained from two copies of the 3D surface code on a cubic lattice, with qubits \(\sigma\) and \(\tau\) on each edge \cite{arxiv:1302.7072,arxiv:2103.08622}.
  The vertex terms are those of the two copies.
  Each face term is decorated by \(\sigma^x\) and \(\tau^x\) operators on the edges lying over and under the face in a fixed 2D projection \cite[Eq. (2)]{arxiv:2103.08622}.
  A string operator of either copy then leaves a line of the other copy's flux along its length, so point excitations are linearly confined in the bulk \cite{arxiv:2103.08622}.
  Truncating the stabilizers at a smooth boundary yields deconfined boundary string operators realizing the 3F topological order \cite{arxiv:1302.7072,arxiv:2103.08622}.

features:
  encoders:
    - '3F QCA encoder \cite{arxiv:1812.01625,arxiv:2205.09141}, which can be simplified using bosonization \cite{arxiv:2309.15903} and can be extended to SPTs in higher dimensions based on an exact bosonization duality \cite{arxiv:2407.07951}.'

  general_gates:
    - '\hyperref[topic:clifford]{Clifford gates} can be performed by braiding and fusing symmetry defects in the MBQC model.'
  fault_tolerance:
    - 'Fault-tolerant MBQC protocol by encoding in, braiding, and fusing symmetry defects.'

relations:
  parents:
    - code_id: qldpc
    - code_id: 3d_stabilizer
    - code_id: walker_wang
      detail: 'The Walker-Wang model code reduces to the 3F model code when the input category \(\mathcal{C}=3F\) \cite{arxiv:2011.04693}. When treated as ground states of the code Hamiltonian, 3F Walker-Wang model code states realize a 3D time-reversal SPT order \cite{arxiv:1302.7072}, while the gapped boundary supports the 3F anyon theory.'
    - code_id: spt
      detail: 'When treated as ground states of the code Hamiltonian, 3F Walker-Wang model code states realize a 3D time-reversal SPT order \cite{arxiv:1302.7072}. The 3F Walker-Wang QCA encoder \cite{arxiv:1812.01625,arxiv:2205.09141} can be extended to SPTs in higher dimensions based on an exact bosonization duality \cite{arxiv:2407.07951}.'
  cousins:
    - code_id: 3d_bosonization
      detail: 'The 3F Walker-Wang QCA encoder \cite{arxiv:1812.01625,arxiv:2205.09141} can be simplified using bosonization \cite{arxiv:2309.15903}.'
    - code_id: bosonization
      detail: 'The 3F Walker-Wang QCA encoder \cite{arxiv:1812.01625,arxiv:2205.09141} can be extended to SPTs in higher dimensions based on an exact bosonization duality \cite{arxiv:2407.07951}.'
    - code_id: topological_abelian
      detail: 'The gapped boundary of the 3F Walker-Wang model supports the 3F topological order \cite{arxiv:1302.7072,arxiv:2011.04693}.'
    - code_id: 3d_surface
      detail: 'The 3F Walker-Wang model code is obtained from two copies of the 3D surface code on the same cubic lattice \cite{arxiv:1302.7072,arxiv:2103.08622}.
      The copies are twisted together by decorating the face terms with \(X\)-type operators on the edges lying over and under each face \cite{arxiv:2103.08622}.
      Flux of one copy then confines the point excitations of the other \cite{arxiv:2103.08622}.'
    - code_id: symmetry_protected_self_correct
      detail: 'Without symmetry enforcement, the 3F Walker-Wang model code on a \(T^2\times I\) lattice stores no information, even classical, at nonzero temperature \cite{arxiv:2103.08622}.
      Enforcing the one-form symmetry generated by its vertex terms within a distance \(W\) of one boundary forbids string endpoints there \cite{arxiv:2103.08622}.
      A boundary logical string must then be completed by bulk strings carrying linearly confined flux, giving a symmetric energy barrier \(\Delta\sim\min\{L_1,L_2,W\}\) on an \(L_1\times L_2\) boundary torus \cite{arxiv:2103.08622}.
      The two qubits at that boundary thus form a symmetry-protected self-correcting quantum code whenever \(W\), \(L_1\), and \(L_2\) grow without bound \cite{arxiv:2103.08622}.'


