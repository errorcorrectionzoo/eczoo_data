code_id: three_fermion
physical: qubits
logical: qubits

name: 'Three-fermion (3F) Walker-Wang model code'
short_name: '3F Walker-Wang'
introduced: '\cite{arxiv:1302.7072,arxiv:2011.04693}'

description: |
  A 3D lattice stabilizer code whose bulk realizes a 3D time-reversal SPT order \cite{arxiv:1302.7072} and whose gapped boundary supports the 2D three-fermion (3F) topological order.
  The code can be used as a resource state for fault-tolerant MBQC \cite{arxiv:2011.04693}.

  The code consists of two copies of the 3D surface code on a cubic lattice with two qubits, \(\sigma\) and \(\tau\), on each edge \cite{arxiv:1302.7072,arxiv:2103.08622}.
  The vertex terms are the usual products of \(\sigma^x\) or \(\tau^x\) on the edges meeting at a vertex.
  Each face term is a product of \(\sigma^z\) (or \(\tau^z\)) around the face \cite[Eq. (2)]{arxiv:2103.08622}.
  It is decorated with \(\sigma^x\) and \(\tau^x\) operators on the two edges that lie over and under the face in a fixed 2D projection \cite[Eq. (2)]{arxiv:2103.08622}.
  The decoration twists the two copies together \cite{arxiv:1302.7072,arxiv:2103.08622}.
  A bare string of \(\sigma^z\) or \(\tau^z\) operators then creates flux along its length, so point excitations are linearly confined in the bulk \cite{arxiv:2103.08622}.
  Truncating the stabilizers at a smooth boundary yields deconfined boundary string operators and the 3F topological order \cite{arxiv:1302.7072,arxiv:2103.08622}.

features:
  encoders:
    - '3F QCA encoder \cite{arxiv:1812.01625,arxiv:2205.09141}, which can be simplified using bosonization \cite{arxiv:2309.15903} and can be extended to SPTs in higher dimensions based on an exact bosonization duality \cite{arxiv:2407.07951}.'

  general_gates:
    - '\hyperref[topic:clifford]{Clifford gates} can be performed by braiding and fusing symmetry defects in the MBQC model.'
  fault_tolerance:
    - 'Fault-tolerant MBQC protocol by encoding in, braiding, and fusing symmetry defects.'

