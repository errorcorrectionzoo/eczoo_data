code_id: quarter_turn_fermionic
physical: qubits
logical: qubits

name: 'Quarter-turn 3D fermionic surface code'
introduced: '\cite{arxiv:2611.09538}'

description: |
  Family of 3D fermionic surface codes on a quarter-turn flat 3-manifold on which pumping a \(p+ip\) layer through space preserves the codespace exactly \cite{arxiv:2611.09538}.
  By a field-theory formula, the pump acts as a logical \(T\) gate up to logical Clifford gates \cite{arxiv:2311.05674,arxiv:2611.09538}.
  The manifold is the quotient of \(T^2_L\times S^1\) by a quarter turn of the square-torus fiber composed with a translation along the circle, and the code encodes two logical qubits.

  The cover has an even fiber side \(L\) and \(4J\) layers along the circle with \(J\) even, and the deck generator translates by \(J\) layers \cite[Prop. 4.24]{arxiv:2611.09538}.
  Logical basis states are labeled by the spin structures \(s_0+a\tau+bz\) with \(a,b\in\mathbb{Z}_2\) \cite[Prop. 4.24]{arxiv:2611.09538}.
  Here, \(s_0\) is a reference spin structure, \(z\) is pulled back from the circle, and \(\tau\) restricts nontrivially to the fiber.
  On a branched triangulation invariant under the quarter turn, qubits sit on the \(n=24L^2J\) triangles \cite[Sec. 4.11]{arxiv:2611.09538}.

protection: |
  Distance \(d=\Theta(\min(L,J))\) (using \hyperref[topic:asymptotics]{asymptotic notation}) \cite[Prop. 4.24]{arxiv:2611.09538}.
  Members with \((L,J)=(4,2)\) and \((4,4)\) are \([[768,2,9]]\) and \([[1536,2,17]]\) codes, with \(d=4J+1\) attained by a string winding once around the circle \cite[Table 4]{arxiv:2611.09538}.

features:
  general_gates:
    - 'Taking the field-theory action of a \(p+ip\) sweep \cite[Eq. (26)]{arxiv:2311.05674} as input, the gauged pump acts as \(T_\tau^{\pm1}\) up to logical Clifford gates, with the sign set by the chirality \cite[Prop. 4.24]{arxiv:2611.09538}.'
    - 'The pump is a two-step finite-time evolution of quasi-local Hamiltonians, and it is within \(\varepsilon\) of a constant-depth circuit with gates on regions of diameter \(O(\log(n/\varepsilon))\) \cite[Prop. 4.24]{arxiv:2611.09538}.'

relations:
  parents:
    - code_id: 3d_fermionic_surface
      detail: 'The quarter-turn 3D fermionic surface code is the 3D fermionic surface code on the quarter-turn space \(T^2_L\rtimes_{C_4}S^1\) \cite[Prop. 4.24]{arxiv:2611.09538}.'
    - code_id: quotient
      detail: 'The quarter-turn 3D fermionic surface code is the quotient of the 3D fermionic surface code on \(T^2_L\times S^1\) by a free \(\mathbb{Z}_4\) action \cite[Prop. 4.24]{arxiv:2611.09538}. The action is generated by a quarter turn of the fiber composed with a translation along the circle.'


