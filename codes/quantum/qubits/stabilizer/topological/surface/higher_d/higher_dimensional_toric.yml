code_id: higher_dimensional_toric
physical: qubits
logical: qubits

name: '\(D\)-dimensional twisted toric code'
introduced: '\cite{arxiv:quant-ph/0602063,arxiv:quant-ph/0605094,manual:{C. D. Albuquerque et al., On Toric Quantum Codes, Int. J. Pure Appl. Math. 50, 221–-226 (2009)},arxiv:1608.05089}'

description: |
  Extension of the Kitaev toric code to higher-dimensional lattices with regular or shifted (a.k.a. twisted) boundary conditions.
  Such boundary conditions yield qubit geometries that are tori \(\mathbb{R}^D/\Lambda\), where \(\Lambda\) is an arbitrary \(D\)-dimensional lattice.
  Picking a hypercubic lattice yields the ordinary \(D\)-dimensional toric code.

protection: |
  In two dimensions, different choices for the periodic boundary conditions yield higher-rate codes with parameters \([[L^2+1,2,L]]\) for odd \(L\) \cite{arxiv:quant-ph/0605094}, and \([[L^2,2,L]]\) for even \(L\) \cite{manual:{C. D. Albuquerque et al., On Toric Quantum Codes, Int. J. Pure Appl. Math. 50, 221–-226 (2009)}}.
  Cyclic analogs of toric codes with parameters \([[t^2+(t+1)^2,1,2t+1]]\) are constructed in \cite{arxiv:1108.5490}.
  Some higher-dimensional toric codes protect against burst errors \cite{arxiv:2205.13582}.

  It is conjectured that appropriate twisted boundary conditions yield families with sublinear distance scaling of \(n^{1-\epsilon}\) for any \(\epsilon>0\) and logarithmic-weight stabilizer generators \cite{arxiv:1608.05089,arxiv:2505.10403}.
  At finite \(n\), twisting boundary conditions can reduce qubit overhead for a fixed distance \cite{arxiv:2505.10403}.
  Assuming the conjecture, Hastings' weight-reduction construction yields QLDPC families with distance \(\Theta^*(n^{1-\epsilon})\) for any \(\epsilon>0\) \cite{arxiv:1611.03790}.


features:
  encoders:
    - 'Entangled logical states can be prepared by single-shot techniques \cite{arxiv:2505.10403} for twisted toric codes.'
  general_gates:
    - '\(D\) layers of the \(D\)-dimensional \((1,D-1)\) toric code on a hypercubic tessellation admit a topologically protected logical \(C^{D-1}Z\) gate implemented by a constant-depth circuit of physical \(C^{D-1}Z\) gates \cite[Appx. B]{arxiv:2312.09111}.'
    - 'Higher-dimensional toric codes can admit a cup product structure and can thus have logical gates in the \term{Clifford hierarchy} implemented by constant-depth \hyperref[topic:clifford]{Clifford circuits} \cite{arxiv:2410.16250}.'


relations:
  parents:
    - code_id: higher_dimensional_surface
      detail: '\(D\)-dimensional twisted toric codes are higher-dimensional surface codes on cellulations of tori with regular or twisted periodic boundary conditions \cite{arxiv:quant-ph/0602063,arxiv:1608.05089}.'
    - code_id: translationally_invariant_stabilizer
      detail: 'The stabilizer checks on the periodic lattice cellulation are related by translations compatible with the periodicity lattice \cite{arxiv:1608.05089,arxiv:2505.10403}.'
    - code_id: multivariate_multicycle
      detail: 'The \(D\)-dimensional toric code on a torus with arbitrary (twisted) periodic boundary conditions is an MM code with \(t=D\) weight-two elements: presenting the Abelian group via the periodicity lattice and choosing \(a_i = 1+x_i\) yields the code \cite{arxiv:2506.16910}, while decomposing the group into cyclic factors instead yields weight-two binomial polynomials in the Koszul-complex formulation \cite{arxiv:2601.18879}. The ordinary hypercubic case corresponds to single-variable relators.'
  cousins:
    - code_id: multisector_hypergraph
      detail: 'The non-twisted \(D\)-dimensional planar and toric codes on a hypercubic lattice can be obtained from a hypergraph product of \(D\) repetition codes \cite{arxiv:1810.01519}.'


