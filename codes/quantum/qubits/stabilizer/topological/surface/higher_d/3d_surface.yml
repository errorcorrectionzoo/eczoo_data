      detail: 'The 3D planar and toric code on a cubic lattice can be obtained from a hypergraph product of three repetition codes \cite[Exam. A.1]{arxiv:2311.01328}\cite{arxiv:1810.01519}. The Chamon code is an XYZ product of three repetition codes \cite[Sec. 3.4]{arxiv:2011.09746}.'
    - code_id: rotated_surface
      detail: 'There exists a rotated version of the 3D surface code, akin to the (2D) rotated surface code \cite{arxiv:2211.02116}.'
    - code_id: hamiltonian
      detail: 'A tensor-network representation of the 3D surface-code ground state is stable under a generating set of uniform local tensor perturbations \cite{arxiv:2012.15346}. The phase diagram of the perturbed tensor network maps to that of a 3D Ising gauge theory.'
    - code_id: multisector_hypergraph
      detail: 'The 3D planar and toric code on a cubic lattice can be obtained from a hypergraph product of three repetition codes \cite[Exam. A.1]{arxiv:2311.01328}\cite{arxiv:1810.01519}.'
