code_id: 3d_surface
physical: qubits
logical: qubits

name: '3D surface code'
introduced: '\cite{arxiv:quant-ph/0110143,arxiv:cond-mat/0411752}'

alternative_names:
  - '3D toric code'
  - '3D cubic code'
  - 'Bosonic-charge bosonic-loop (BcBl) surface code'
  - 'Solid code'


description: |
  A generalization of the Kitaev surface code defined on a 3D cubic lattice.
  Qubits are placed on edges, \(Z\)-type stabilizer generators are placed on square plaquettes oriented in all three directions, and \(X\)-type stabilizers are placed on the six edges neighboring every vertex \cite{arxiv:1404.4618}.

  \textit{3D toric code} often either refers to the construction on
  the three-dimensional torus or is an alternative name for the general
  construction.
  The construction on surfaces with boundaries is often called the
  \textit{3D planar code}.
  In the open-boundary hypercubic family of \cite{arxiv:1708.09286}, setting one linear dimension of the tesseract construction to \(1\) yields a single-qubit \textit{cubic code} that interpolates between the planar surface code and the 4D tesseract code.
  There exists a rotated version of the 3D surface code, the \textit{3D rotated surface code}, akin to the (2D) rotated surface code \cite{arxiv:2211.02116}.
  The \textit{welded surface code} \cite{arxiv:1208.3496,arxiv:1406.4227} places 3D surface codes on the edges of a 3D cubic lattice and welds their rough boundaries at each vertex.
  \textit{Welding} identifies the qubits of the joined boundaries, keeps all \(X\)-type stabilizers, and takes as \(Z\)-type stabilizers all \(Z\)-type operators commuting with them \cite{arxiv:1208.3496}.
  This first gives a code with no logical qubits, so a welded \(Z\)-type stabilizer generator is then promoted to a logical operator to encode one qubit \cite{arxiv:1208.3496}.
  A \(Z\) error on a welded qubit excites an \(X\)-type stabilizer in every code meeting there, so \(X\)-type excitations split at each weld \cite{arxiv:1208.3496}.
  The string-like \(Z\)-type logical operator becomes a branching string whose energy barrier is lower bounded by that of the Ising model on the lattice \cite{arxiv:1208.3496}.
  In the rectified picture, three 3D surface codes can be supported on the same rectified cubic lattice, and the corresponding cubic-lattice realization is a gauge choice of the 3D Bacon-Shor code \cite{arxiv:1801.04255}.

  Related models \cite{arxiv:cond-mat/0607736} on lattices with certain colorability are equivalent to several copies of the 3D surface code \cite{arxiv:1908.08049}.


protection: |
  The planar 3D surface code family on a cubic lattice of length \(L\) has parameters \([[2L(L-1)^2+L^3,1,d_X=L^2,d_Z=L]]\), while the 3D toric code has parameters \([[3L^3,3,d_X=L^2,d_Z=L]]\).
  Rectangular open-boundary 3D versions furnish single-qubit \([[71,1,6]]\), \([[177,1,9]]\), \([[331,1,12]]\), and \([[616,1,16]]\) codes, illustrating an \(n\propto 3d^2\) tradeoff between the 2D surface and 4D tesseract families \cite{arxiv:1708.09286}.
  Membrane-like logical operators have an energy barrier of \hyperref[topic:asymptotics]{order} \(O(L)\), while string-like logical operators have a constant energy barrier \cite{arxiv:1208.3496}.

  The welded surface code on a cube of side length \(L\) has parameters \([[O(L^3),1,O(L^{4/3})]]\) and an energy barrier of \hyperref[topic:asymptotics]{order} \(O(L^{2/3})\) \cite{arxiv:1208.3496,arxiv:1406.4227}.
  The welded surface code is translation invariant only over a length that grows with system size, which evades the no-go theorems for translationally invariant 3D stabilizer codes \cite{arxiv:1208.3496,arxiv:1406.4227}.

  A tensor-network representation of the 3D surface-code ground state is stable under a generating set of uniform local tensor perturbations \cite{arxiv:2012.15346}.
  The phase diagram of the perturbed tensor network maps to that of a 3D Ising gauge theory.

#  The \textit{Kirigami code} \cite{} consists of three copies of the 3D surface code.

#protection: As a stabilizer code, \([[n=O(d^2), k=O(1), d]]\).

features:
  transversal_gates:
    - 'For a stack of three 3D surface codes on the same rectified cubic lattice, pairwise logical \(CZ\) and triple logical \(CCZ\) gates are transversal \cite{arxiv:1801.04255}.'
  decoders:
    - 'Flip decoder and its modification p-flip \cite{arxiv:2212.06985}.'
    - 'Tensor-network decoder \cite{arxiv:2310.10722}.'
    - 'Local decoder based on Toom''s rule for bit-flip errors and MWPM decoder for phase-flip errors in the 3D toric code, with extensions to welded surface codes \cite{arxiv:1808.03092}.'
    - 'Generalization of linear-time ML erasure decoder \cite{arxiv:1703.01517} to 3D surface codes \cite{arxiv:1808.03092}.'
    - 'Equivariant machine learning decoder \cite{arxiv:2409.04300}.'
  general_gates:
    - 'There is a CZ gate for the 3D toric code on a Klein bottle \(\times S^1\) \cite{arxiv:2211.11764}.'
    - 'Lattice surgery \cite{arxiv:1801.04255}.'
    - 'Single-shot lattice surgery for the 3D toric/surface code can be formulated using the fault-complex formalism \cite{arxiv:2410.12963}.'
    - '3D and Hybrid 2D-3D surface code computation using lattice surgery and without magic-state distillation \cite{arxiv:1801.04255}.'
    - 'Fault-tolerant Hadamard gate using teleportation and error correction \cite{arxiv:1801.04255}.'
    - 'Three distance-\(d\) 3D surface/toric codes with open boundaries and cyclically permuted lattice axes admit a logical \(CCZ\) gate via transversal physical \(CCZ\) gates; concatenating each supporting qubit triple with an \([[8,3,2]]\) block yields a \([[8n,3,2d]]\) 3D toric/color family whose smallest member has parameters \([[72,3,4]]\) \cite{arxiv:2404.19005}.'
    - 'Various inter-code \(CZ\) and \(CCZ\) gates implemented via constant-depth circuits on stacks or coupled collections of 3D surface/toric codes \cite{arxiv:1503.02065,arxiv:1801.04255,arxiv:2106.05274,arxiv:2108.00018,arxiv:2310.16982,arxiv:2312.09111,arxiv:2404.05033}, with \(CZ\) gates formulated in terms of the slant product \cite{arxiv:1509.03626,arxiv:2208.07367} or cup product \cite{arxiv:2410.16250} structures.'
    # 2410.16250 explains the above 
  fault_tolerance:
    - 'Fault-tolerant Hadamard gate using teleportation and error correction \cite{arxiv:1801.04255}.'
  code_capacity_threshold:
    - 'Independent \(X,Z\) noise: \(12\%\) for the bit-flip channel with a local decoder based on Toom''s rule and \(3\%\) for the phase-flip channel with MWPM decoding for the 3D toric code \cite{arxiv:1808.03092}.
    RG decoding yields \(17.2\%\) for the surface-like logical operator of the 3D cubic code.
    The optimal threshold for its line-like logical operator is about \(3.3\%\) \cite{arxiv:1708.09286}.'
    - 'Erasure noise: \(24.8\%\) with generalization of linear-time ML erasure decoder \cite{arxiv:1703.01517} to 3D surface codes \cite{arxiv:1808.03092}.
    No threshold was observed for the welded surface code \cite{arxiv:1808.03092}.'

  threshold:
    - 'Phenomenological noise model for the 3D toric code: \(2.90(2)\%\) under MWPM syndrome repair followed by BP-OSD decoding \cite{arxiv:2009.11790}, \(7.1\%\) under improved BP-OSD \cite{arxiv:2206.03122}, and \(2.6\%\) under flip decoder \cite{arxiv:2212.06985}.
    For the surface-like logical operator of the 3D cubic code, RG decoding yields \(7.3\%\) \cite{arxiv:1708.09286}.
    For 3D surface code: \(3.08(4)\%\) under MWPM syndrome repair followed by BP-OSD decoding \cite{arxiv:2009.11790}.
    Optimal thresholds of \(11\%\) under \(X\)-type and \(2\%\) under \(Z\)-type noise for the 3D toric code are derived in Ref. \cite{arxiv:2510.20489}.'


