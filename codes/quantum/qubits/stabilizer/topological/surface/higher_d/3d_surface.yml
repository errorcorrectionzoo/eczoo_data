      detail: 'The qudit 3D surface code reduces to the 3D surface code for \(q=2\). The 3D surface code realizes 3D \(\mathbb{Z}_2\) gauge theory with bosonic charge and loop excitations (BcBl). The welded surface code does not satisfy homogeneous topological order \cite{arxiv:2009.13551}.'
  cousins:
