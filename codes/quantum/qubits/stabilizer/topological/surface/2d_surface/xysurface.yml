code_id: xysurface
physical: qubits
logical: qubits

name: 'XY surface code'
introduced: '\cite{arxiv:1708.08474}'

alternative_names:
  - 'Tailored surface code (TSC)'

description: |
  A variant of the surface code whose generators are \(XXXX\)  and \(YYYY\), obtained by mapping \(Z \to Y\) in the surface code.
  While this code is equivalent to a CSS surface code with the same distance, other properties like noise-bias performance can differ significantly.


protection: As a stabilizer code, \([[n=O(d^2), k=O(1), d]]\).

features:
  threshold:
    - '\(6.32(3)\%\) for infinite \(Z\) bias, and thresholds of \(\approx 5\%\) for \(Z\) bias around \(\eta = 100\) using a variant of the minimum-weight perfect matching decoder \cite{arxiv:1907.02554}.'
  code_capacity_threshold:
    - '\(50\%\) at infinite \(Z\) bias with maximum-likelihood decoder \cite{arxiv:1812.08186}.'
    - '\(18.8(2)\%\) for standard depolarizing noise with maximum-likelihood decoder \cite{arxiv:1812.08186}.'
    - 'Under \(Z\)-biased noise \(p_x=p_y=p_z/(2\eta)\) at the point \(p_z=1-p\), the statistical mechanical model of the code on a \(d\times d\) rotated layout with odd \(d\) reduces to a single one-dimensional Ising model \cite{arxiv:2401.04008}.
    At this point, which lies above threshold for finite \(\eta\), the maximum-likelihood logical failure rate is exactly \(\frac{3}{4}-\frac{1}{4}e^{-2d^2\,\text{artanh}(1/2\eta)}\), with \(d^2\) the weight of the pure-\(Z\) logical operator \cite{arxiv:2401.04008}.'

relations:
  parents:
    - code_id: surface
      detail: 'The XY surface code is obtained from the surface code by applying \(H\sqrt{Z}H\) to all qubits, thereby exchanging \(Z\leftrightarrow Y\). While it is equivalent to a CSS surface code with the same distance, other properties like noise-bias performance can differ significantly.'
  cousins:
    - code_id: heavy_hex
      detail: 'XY surface code can be adapted for a heavy-hexagonal point set \cite{arxiv:2211.14038}.'
    - code_id: repetition
      detail: 'Under pure \(Z\) noise, the \(d\times d\) XY surface code with odd \(d\) is equivalent to a distance-\(d^2\) repetition code, since its only pure-\(Z\) logical operator is \(Z^{\otimes d^2}\) \cite{arxiv:1812.08186}\cite[Sec. IV.C]{arxiv:2401.04008}.'


