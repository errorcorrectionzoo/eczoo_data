      detail: 'Tetron subsystem codes are Majorana subsystem stabilizer codes whose gauge group is generated by tetron parity operators together with \(\gamma_d\)-strings determined by a classical binary code \cite{doi:10.1088/1367-2630/ad4737}.'
  cousins:
    - code_id: tetron
      detail: 'Tetron subsystem codes are defined on \(n\) tetrons, whose parity operators serve as gauge generators rather than being fixed by high charging energy \cite{doi:10.1088/1367-2630/ad4737}.'
    - code_id: qubit_stabilizer
      detail: 'The tetron subsystem construction converts an \([[n,k_b,d_b]]\) qubit stabilizer code, together with a compatible classical code, into a \([[2n,k_b,k,d_f]]\) Majorana subsystem code \cite{doi:10.1088/1367-2630/ad4737}.'
    - code_id: binary_linear
      detail: 'The classical input code of a tetron subsystem code determines its tetron-parity stabilizers and its gauge qubits, one per row of its generator matrix \cite{doi:10.1088/1367-2630/ad4737}.'
    - code_id: stab_5_1_3
      detail: 'The \([[10,1,2,3]]\) tetron subsystem code is obtained from the five-qubit perfect code together with the \([5,2,3]\) classical code \cite[Sec. 3.5]{doi:10.1088/1367-2630/ad4737}.'
