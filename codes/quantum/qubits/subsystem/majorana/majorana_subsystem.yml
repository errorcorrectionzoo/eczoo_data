code_id: majorana_subsystem
physical: qubits
logical: qubits

name: 'Majorana subsystem stabilizer code'
introduced: '\cite{doi:10.1088/1367-2630/ad4737}'

description: |
  Subsystem stabilizer code whose gauge group is generated by products of Majorana operators.
  Logical information is encoded in physical fermionic modes, with some encoded degrees of freedom designated as gauge qubits.

  The measured checks need not commute, the stabilizer group is the center of the check group, and the logical group is its normalizer \cite[Sec. II D]{arxiv:2110.10280}.
  Such codes can be denoted by \([[n,k,g,d]]_{f}\), where \(n\) is the number of fermionic modes, \(g\) is the number of gauge qubits, and \(d\) is the least Majorana weight of a nontrivial dressed logical operator.
  Codes with no gauge qubits reduce to \hyperref[code:majorana_stab]{Majorana stabilizer codes}, denoted \([[n,k,d]]_{f}\).

  In tetron constructions, placing tetron parity operators in the gauge group makes it possible to diagnose parity-violating errors without fixing each tetron parity using high charging energy, while requiring fewer stabilizer generators than an earlier non-subsystem construction with the same error-correction capability \cite{doi:10.1088/1367-2630/ad4737}.


relations:
  parents:
    - code_id: qubit_subsystem_stabilizer
      detail: 'A Majorana subsystem stabilizer code is a subsystem qubit stabilizer code whose gauge generators are products of Majorana operators, realizable using Pauli strings via the \hyperref[code:jw]{Jordan-Wigner mapping}.'
  cousins:
    - code_id: fermions
      detail: 'Majorana subsystem stabilizer codes encode logical information into a physical Fock space of fermionic modes, with some degrees of freedom designated as gauge qubits.'
    - code_id: majorana_stab
      detail: 'A Majorana subsystem stabilizer code with no gauge qubits is a Majorana stabilizer code.'


