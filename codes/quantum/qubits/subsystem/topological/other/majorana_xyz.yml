code_id: majorana_xyz
physical: qubits
logical: qubits

name: 'Majorana-XYZ code'
introduced: '\cite{arxiv:2603.26311}'

alternative_names:
  - 'Majorana-XYZ subsystem code'

description: |
  Two-dimensional non-CSS subsystem qubit stabilizer code on a triangular lattice whose gauge group is generated by geometrically local weight-three triangle operators.
  It encodes one logical qubit with distance proportional to the linear lattice size, while taking only the double loops as stabilizers instead yields a distance-three subspace code whose rate tends to one.
  The stabilizer generators are non-local loop products, but their syndrome can in principle be inferred from the local gauge measurements, making the code suitable for architectures with native few-qubit measurements.

  The gauge generators are the terms of a frustrated three-spin Hamiltonian, with every up- and down-pointing triangle of the lattice hosting a weight-three Pauli operator that assigns \(Z\), \(X\), and \(Y\) to its three vertices in an orientation-dependent pattern,
  \begin{align}
    T_{k}^{\nabla} = Z_k X_i Y_j
    \qquad\text{and}\qquad
    T_{j}^{\Delta} = Z_j Y_k X_l~,
  \end{align}
  where the site labels follow the two triangle orientations \cite[Fig. 1]{arxiv:2603.26311}.
  The two orientations mutually commute, but any two corner-sharing triangles of the same orientation anticommute, so the gauge group is non-Abelian and the associated Hamiltonian is strongly frustrated.

  For each Pauli type \(A \in \{X,Y,Z\}\) there is one lattice direction along which the product of \(A\) over a straight line winding around the torus commutes with every triangle operator; there are \(3L\) such weight-\(L\) \textit{loop operators} \(\Xi^{A}_{l}\).
  Products \(\Xi^{A}_{i}\Xi^{A}_{i+1}\) of two adjacent parallel loops of the same type intersect any other loop an even number of times and are products of triangle operators; they generate the stabilizer group.
  The center has \(|\mathsf{S}| = 3L-3\) independent generators for every \(L\) — double loops of weight \(2L\), together with one additional non-double-loop generator when \(L\) is even — leaving \(g = (|\mathsf{G}|-|\mathsf{S}|)/2 = L^2-3L+2\) gauge qubits and a single logical qubit.
  The reported subsystem parameters are \([[L^2,1,L^2-3L+2,L]]\) \cite{arxiv:2603.26311}.

  Taking the double loops alone as the stabilizer group of a subspace code, without designating any gauge qubits, yields an \([[L^2,L^2-3L+3+((L+1) \bmod 2),3]]\) code whose rate tends to one \cite[Sec. II.A]{arxiv:2603.26311}.
  The double loops are no longer all independent for even \(L\), where one additional non-double-loop generator enters the center of the gauge group.
  For even \(L\) this code therefore has one logical qubit more than the \(k+g\) of the subsystem code, since that extra center generator is released as well.

protection: |
  The bare logical operators of the subsystem code are the single-loop operators, and the dressed logical operators are obtained by multiplying these by gauge operators.
  The distance is \(d=L=\sqrt{n}\), set by the weight of a single loop, i.e., by the length of the shortest homologically nontrivial cycle.
  This saturates the distance scaling allowed by the \hyperref[topic:subsystem-bt-bound]{2D subsystem BT bound}.

features:
  rate: 'The subsystem code encodes one logical qubit, while the subspace variant obtained by taking only the double loops as stabilizers has \hyperref[topic:asymptotics]{order} \(n-O(\sqrt{n})\) logical qubits and constant distance three, yielding an asymptotically unit rate \cite[Table I]{arxiv:2603.26311}.'

  decoders:
    - 'BP-OSD decoder \cite{arxiv:2005.07016} applied to the degree-six Tanner graph of the double-loop stabilizer generators \cite{arxiv:2603.26311}.'

  code_capacity_threshold:
    - 'Independent \(X,Z\) noise: \(1.4\% \pm 0.1\%\) for odd distance and \(1.8\% \pm 0.2\%\) for even distance under BP-OSD decoding, extracted from a finite-size collapse over distances up to \(13\) with fitted exponents \(\nu_{\mathrm{odd}}=1.5\pm0.5\) and \(\nu_{\mathrm{even}}=1.5\pm1.0\) \cite{arxiv:2603.26311}. The estimates decode stabilizer syndromes under code-capacity noise.'


relations:
  parents:
    - code_id: qubit_subsystem_stabilizer
    - code_id: translationally_invariant_subsystem
  cousins:
    - code_id: floquet
      detail: 'A Floquet variant of the Majorana-XYZ code has been proposed, in which the triangle operators are split into three mutually anticommuting sublattices measured in a three-step periodic sequence, with only homologically nontrivial operators surviving a full cycle \cite{arxiv:2603.26311}.'
    - code_id: compass_model
      detail: 'The line symmetries of the Majorana-XYZ code are analogous to the straight-line symmetries of the \(90^{\circ}\) compass model \cite{arxiv:cond-mat/0501708,arxiv:1303.5922}, and the code has been described as a triangular-lattice generalization of the square-lattice quantum compass model \cite{arxiv:2603.26311}.'
    - code_id: majorana_subsystem
      detail: 'In the thermodynamic limit, the (originally qubit-based) Majorana-XYZ code has a Majorana-fermion formulation as the strong-interaction limit of the honeycomb-lattice Majorana-Hubbard model \cite{arxiv:1806.06092}, whose four-Majorana interaction terms play the role of the gauge generators. The two models are related by a Jordan-Wigner transformation \cite[Appx. A]{arxiv:2603.26311}.'
    - code_id: jw
      detail: 'In the thermodynamic limit, the (originally qubit-based) Majorana-XYZ code has a Majorana-fermion formulation as the strong-interaction limit of the honeycomb-lattice Majorana-Hubbard model \cite{arxiv:1806.06092}, whose four-Majorana interaction terms play the role of the gauge generators. The two models are related by a Jordan-Wigner transformation \cite[Appx. A]{arxiv:2603.26311}.'
    - code_id: hexagonal
      detail: 'The Majorana-XYZ code is defined on the triangular lattice \cite[Fig. 1]{arxiv:2603.26311}.'


