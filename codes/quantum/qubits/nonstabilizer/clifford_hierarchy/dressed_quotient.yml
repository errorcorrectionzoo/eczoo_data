code_id: dressed_quotient
physical: qubits
logical: qubits

name: 'Dressed quotient code'
introduced: '\cite{arxiv:2611.09538}'

description: |
  Clifford-hierarchy stabilizer code obtained from a parent code by identifying qubits along the orbits of deck transformations composed with entangling diagonal circuits.
  The diagonal circuits dress the \(X\)-type checks by diagonal gates, which lets Abelian parent codes realize non-Abelian topological order \cite{arxiv:2611.09538}.

  The parent is generated by Pauli \(Z\)-checks and operators \(X(c)e^{2\pi i h(a)}\), each an \(X\)-string times a diagonal phase, which a free group of qubit permutations permutes \cite[Def. 3.18]{arxiv:2611.09538}.
  Each generator is replaced by its descent, the \(X\)-string summed over each orbit times the phase evaluated on configurations that are constant on orbits.
  For parents made of surface codes, a cup-product twist composes each deck transformation with a diagonal cup-product circuit \cite[Thm. 3.19]{arxiv:2611.09538}.
  The descended checks are then Gauss laws dressed near the twist wall \cite[Def. 3.14]{arxiv:2611.09538}.
  A twist whose phase polynomial has degree \(m\) dresses the checks at level at most \(m-1\) of the \hyperref[topic:clifford-hierarchy]{Clifford hierarchy} \cite[Prop. 3.16]{arxiv:2611.09538}.
  Three 3D surface codes on \(X\times S^1\) modulo a translation composed with transversal \(CCZ\) realize \(D(D_4)\) topological order on \(X\) \cite[Sec. 1.3 and Thm. 3.19]{arxiv:2611.09538}.

protection: |
  The codespace dimension of a dressed quotient with a cubic twist equals the number of solutions of a system of quadratic equations in cup products \cite[Thm. 3.21]{arxiv:2611.09538}.
  On \(T^2\times S^1\), the 176-dimensional codespace of the \(D(D_4)\) example rules out any equivalent qubit Pauli stabilizer code \cite[Sec. 3.7 and Cor. D.4]{arxiv:2611.09538}.
  On tori \(T^d_L\) with fields of degrees between one and \(d-1\), the distance is greater than \((L-3)/10\) \cite[Cor. 3.28]{arxiv:2611.09538}.

relations:
  parents:
    - code_id: clifford_hierarchy
      detail: 'A dressed quotient of a parent whose \(X\)-type checks are dressed at level \(\ell\) has Pauli \(Z\)-checks and \(X\)-type checks dressed at level at most \(\ell\) \cite[Prop. 3.24]{arxiv:2611.09538}. On \(X\times S^1\), \(N\) surface codes modulo a translation composed with \((-1)^{\int a_1\cup\cdots\cup a_N}\) realize the phases of the twisted \(\mathbb{Z}_2^N\) Clifford-hierarchy stabilizer codes on \(X\) \cite[Exam. 3.25]{arxiv:2611.09538}.'
    - code_id: commuting_projector
      detail: 'A dressed quotient of surface codes is the ground space of commuting projectors, each a local flux projector times the average of the powers of one dressed Gauss law \cite[Prop. 3.15 and Thm. 3.19]{arxiv:2611.09538}.'
  cousins:
    - code_id: quotient
      detail: 'Dressed quotients compose deck transformations with entangling diagonal circuits rather than monomial Cliffords, and they need not be stabilizer codes \cite[Def. 3.18 and Thm. 3.19]{arxiv:2611.09538}. For twists of polynomial degree two, the dressed quotient is a quotient code of the dressed parent by a free qubit permutation \cite[Thm. 3.19]{arxiv:2611.09538}.'


