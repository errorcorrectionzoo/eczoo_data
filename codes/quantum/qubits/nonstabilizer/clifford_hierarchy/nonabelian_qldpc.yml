code_id: nonabelian_qldpc
physical: qubits
logical: qubits

name: 'Non-Abelian QLDPC code'
introduced: '\cite{arxiv:2601.06736,arxiv:2602.12228}'

alternative_names:
  - 'Twisted QLDPC code'
  - 'Gauged QLDPC code'

description: |
  Clifford stabilizer code with sparse checks obtained from two CSS QLDPC codes by gauging a transversal Clifford gate between them, such as a \(CZ\) or \(\mathrm{SWAP}\) gate \cite{arxiv:2601.06736,arxiv:2602.12228}.
  Gauging adds a block of gauge qubits whose dressed \(X\)-type checks multiply to the gauged gate, and dresses the input codes' checks with Clifford gates controlled by the gauge qubits \cite[Sec. III.C.4]{arxiv:2601.06736}\cite[Sec. III.D]{arxiv:2602.12228}.

  The codes realize a QLDPC analogue of non-Abelian topological order \cite[Sec. V]{arxiv:2601.06736}\cite[Sec. V.B]{arxiv:2602.12228}.
  In \textit{homological gauging}, the two input codes and the gauge block are defined on one chain complex with a cup product \cite[Sec. III.C]{arxiv:2602.12228}.
  When a \(CZ\) gate is gauged, all \(Z\)-type checks are kept.
  Each \(X\)-type check gains \(CZ\) gates on those qubit pairs from the other two blocks whose cells have a nonzero triple cup product with its cell \cite[Sec. III.C.1]{arxiv:2601.06736}.
  \textit{Graph gauging} instead places the gauge qubits on the edges of a suitable ancilla graph \cite[Sec. III.D]{arxiv:2602.12228}.
  It can gauge any transversal gate of order two, such as \(\mathrm{SWAP}\) between two copies of a code \cite[Sec. III.D]{arxiv:2602.12228}.

features:
  transversal_gates:
    - 'When a \(CZ\) gate is gauged, the \(Z\)-type logical operators of the input codes remain logical Pauli operators \cite[Sec. III.C.3]{arxiv:2601.06736}.'

  encoders:
    - 'Finite-depth adaptive circuits prepare the code from the input codes, with Pauli-\(Z\) corrections on the gauge block chosen by a decoder for its CSS code \cite[Sec. III.E]{arxiv:2602.12228}.'

  general_gates:
    - 'Gauging a transversal Clifford gate and then ungauging measures that logical gate on the input codes \cite[Sec. IV.A]{arxiv:2601.06736}\cite[Sec. VI.A]{arxiv:2602.12228}.
      Measuring a logical \(CZ\) gate on \(|\overline{++}\rangle\) with outcome \(+1\) prepares the magic state \((|\overline{00}\rangle+|\overline{01}\rangle+|\overline{10}\rangle)/\sqrt{3}\) \cite[Sec. IV.A.3]{arxiv:2601.06736}.'


relations:
  parents:
    - code_id: clifford_hierarchy
      detail: 'Non-Abelian QLDPC codes are sparse Clifford stabilizer codes whose checks are dressed by Clifford gates such as \(CZ\) gates \cite{arxiv:2601.06736,arxiv:2602.12228}.'
    - code_id: frustration_free
      detail: 'The codespace of a non-Abelian QLDPC code is the ground-state subspace of a frustration-free Hamiltonian built from its checks \cite[Sec. III.C.3]{arxiv:2601.06736}.'
  cousins:
    - code_id: qldpc
      detail: |
        Gauging a transversal Clifford gate between two CSS qubit QLDPC codes yields a non-Abelian QLDPC code when the codes admit a suitable cup product or when the ancilla graph is chosen to keep the checks sparse \cite[Secs. III.C and III.D]{arxiv:2602.12228}.
        Ungauging afterwards measures the logical gate on the input codes, and measuring a logical \(CZ\) gate can prepare magic states \cite{arxiv:2601.06736,arxiv:2602.12228}.
    - code_id: hypergraph_product
      detail: |
        \textit{Twisted HGP codes} are constant-rate non-Abelian QLDPC codes obtained by gauging addressable transversal \(CZ\) gates between HGP codes built from a good classical LDPC code \cite[Sec. III.E and Lemmas 7 and 13]{arxiv:2601.06736}.
        Gauging and then ungauging these gates prepares \(\Theta(\sqrt{n})\) disjoint logical \(CZ\) magic states (using \hyperref[topic:asymptotics]{asymptotic notation}) \cite[Thm. 1 and Sec. IV.C]{arxiv:2601.06736}.
    - code_id: qcga
      detail: 'Two copies of a BB code admit a transversal \(CZ\) gate, and gauging it with an ancilla graph yields a non-Abelian BB code \cite[Sec. IV.C]{arxiv:2602.12228}.'
    - code_id: tqd_abelian
      detail: |
        When a cup-product \(CZ\) gate is gauged homologically, the dressed checks mirror a spatial slice of the Type-III \(\mathbb{Z}_2^3\) Abelian TQD action \cite[Sec. III.C.3]{arxiv:2602.12228}.
        For two toric codes, the result has the topological order of the Type-III \(\mathbb{Z}_2^3\) Abelian TQD \cite[Sec. III.C.3]{arxiv:2602.12228}\cite{arxiv:hep-th/9511195}.


