    - code_id: qubit_concatenated
      detail: 'The \([[16,4,4]]\) code is obtained by concatenating the \([[4,2,2]]\) code with the \hyperref[topic:symplectic-doubling]{symplectic double} of the \([[4,2,2]]\) code along a \(ZX\)-duality \cite{arxiv:2510.18753}.'
    - code_id: stab_16_6_4
      detail: 'The \([[16,4,4]]\) code is obtained from the tesseract color code by promoting one \(X\)-type and one \(Z\)-type weight-four logical operator to stabilizers \cite{arxiv:2008.05051,arxiv:2112.03785}, equivalently by fixing the weight-four gauge operators of the \([[16,4,2,4]]\) tesseract subsystem code \cite{arxiv:2409.04628}.'


