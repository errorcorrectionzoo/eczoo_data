  cousins:
    - code_id: stab_4_2_2
      detail: 'The \([[16,4,4]]\) CSD code is obtained by concatenating the \([[4,2,2]]\) code with the \hyperref[topic:symplectic-doubling]{symplectic double} of the \([[4,2,2]]\) code, and is isomorphic to the \(L=2\), \(C_4\)-based many-hypercubes code \cite{arxiv:2510.18753}.'
    - code_id: stab_6_4_2
