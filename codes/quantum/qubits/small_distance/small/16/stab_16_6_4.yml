code_id: stab_16_6_4
physical: qubits
logical: qubits

name: '\([[16,6,4]]\) Tesseract color code'
introduced: '\cite{arxiv:1703.00612,arXiv:1703.07847,arxiv:2008.05051,arxiv:2112.03785}'
# arXiv:1703.07847 attributes arxiv:1703.00612 

alternative_names:
  - '\([[16,6,4]]\) hypercube code'
  - '\([[16,6,4]]\) 4D color code'

description: |
  A (hyperbolic self-dual CSS) doubly-even 4D color code defined on a tesseract, with stabilizer generators of both types supported on each cube. 
  A \([[16,4,2,4]]\) tesseract subsystem code can be obtained from this code by using two logical qubits as gauge qubits \cite{arxiv:2409.04628}.

  A stabilizer tableau for the code is \cite[ID 67d2cf9965e067195651cfbe]{preset:QECDB}
  \begin{align}
  \begin{smallmatrix}
    X & X & X & X & X & X & X & X & X & X & X & X & X & X & X & X \\
    I & X & I & X & I & X & I & X & I & X & I & X & I & X & I & X \\
    I & I & X & X & I & I & X & X & I & I & X & X & I & I & X & X \\
    I & I & I & I & X & X & X & X & I & I & I & I & X & X & X & X \\
    I & I & I & I & I & I & I & I & X & X & X & X & X & X & X & X \\
    Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z & Z \\
    I & Z & I & Z & I & Z & I & Z & I & Z & I & Z & I & Z & I & Z \\
    I & I & Z & Z & I & I & Z & Z & I & I & Z & Z & I & I & Z & Z \\
    I & I & I & I & Z & Z & Z & Z & I & I & I & I & Z & Z & Z & Z \\
    I & I & I & I & I & I & I & I & Z & Z & Z & Z & Z & Z & Z & Z
  \end{smallmatrix}~.
  \end{align}

  The automorphism group of the underlying \([16,5,8]\) \(\text{RM}(1,4)\) code is the affine group \(AGL(4,2)\), of order \(322\,560\) \cite{preset:MacSlo}.
  Shortening \(\text{RM}(1,4)\) on one, two, and four bits yields the \([[15,7,3]]\), \([[14,8,2]]\), and \([[12,8,2]]\) codes, respectively.

features:
  transversal_gates:
    - 'The logical classes of the tesseract color code are the \(63\) nontrivial cosets of \(\text{RM}(1,4)\) in \(\text{RM}(2,4)\), which split into \(35\) classes of minimum weight four, indexed by the rank-two alternating forms on \(\mathbb{F}_2^4\), and \(28\) classes of minimum weight six, indexed by the nondegenerate ones.'
    - 'Global transversal \(S\) implements a logical circuit composed of \(CZ\) and \(Z\) gates \cite{arxiv:2410.07595,arxiv:1910.09333}'
    - 'Transversal Hadamard can be chosen to swap three pairs of logical qubits, allowing even-weight Hadamard-product measurements in magic-state distillation protocols \cite[Sec. III]{arxiv:1703.07847}.'
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2602.09788}.
      Twelve of the fifteen logical-qubit pairs, which can be associated with the edges of an octahedron, carry an addressable \(\overline{CZ}\) and its \(X\)-type dual, each realized by a single such circuit of four physical \(CZ\) gates and eight single-qubit gates \cite{arxiv:2602.09788,arxiv:2608.05688}.'
  general_gates:
    - 'Using this code as a hyperbolic inner code yields quartic magic-state distillation on six outputs; pipelining it with \([[4,2,2]]\) inner-code checks lowers the non-Clifford cost from 390 to 246 noisy \(T\) gates \cite[Sec. I.B.2]{arxiv:1703.07847}.'
  decoders:
    - 'Post-selected fault-tolerant syndrome extraction \cite{arxiv:2008.05051,arxiv:2112.03785}.'
  fault_tolerance:
    - 'Post-selected fault-tolerant syndrome extraction \cite{arxiv:2008.05051,arxiv:2112.03785}.'

realizations:
  - 'Trapped-ion devices: logical graph and GHZ states of up to 12 logical qubits constructed using three copies of the \([[16,4,2,4]]\) tesseract subsystem code, along with five rounds of post-selected fault-tolerant error correction in a device by Quantinuum \cite{arxiv:2409.04628,doi:10.1038/s41586-026-10628-y}.'
  - 'Neutral atom arrays: deep circuits and 1D-cluster-state creation using 96 logical qubits and hundreds of logical teleportations by the Lukin group \cite{arxiv:2506.20661}.'


