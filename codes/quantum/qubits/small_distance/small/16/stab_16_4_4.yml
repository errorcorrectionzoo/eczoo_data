code_id: stab_16_4_4
physical: qubits
logical: qubits

# TODO: link doubly even codes to quantum_divisible (and make self-dual doubly-even CSS entry)
name: '\([[16,4,4]]\) symplectic-double code'
introduced: '\cite{arxiv:2403.16054,arxiv:2510.05211,arxiv:2510.18753}'

description: |
  Self-dual doubly-even CSS code obtained by concatenating the non-CSS \([[4,2,2]]\) code, defined by stabilizer generators \(XZZX,ZXXZ\), with the \hyperref[topic:symplectic-doubling]{symplectic double} of itself.
  Concretely, the \hyperref[topic:symplectic-doubling]{symplectic double} of the \([[4,2,2]]\) code yields a non-CSS-seeded \([[8,4,2]]\) code, and concatenating this \([[8,4,2]]\) code with the \([[4,2,2]]\) code \(C_4\) along the \(ZX\)-duality \(\tau\) yields the \([[16,4,4]]\) concatenated \hyperref[topic:symplectic-doubling]{symplectic double} (CSD) code.
  This code is isomorphic to the \(L=2\), \(C_4\)-based many-hypercubes (MHC) code \cite{arxiv:2403.16054,arxiv:2510.18753}.

  A stabilizer tableau for the code is \cite{arxiv:2510.18753}
  \begin{align}
  \begin{smallmatrix}
    Z & Z & Z & Z & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & Z & Z & Z & Z & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & Z & Z & Z & Z & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & Z & Z & Z & Z \\
    Z & Z & I & I & Z & I & Z & I & Z & I & Z & I & Z & Z & I & I \\
    Z & I & Z & I & Z & Z & I & I & Z & Z & I & I & Z & I & Z & I \\
    X & X & X & X & I & I & I & I & I & I & I & I & I & I & I & I \\
    I & I & I & I & X & X & X & X & I & I & I & I & I & I & I & I \\
    I & I & I & I & I & I & I & I & X & X & X & X & I & I & I & I \\
    I & I & I & I & I & I & I & I & I & I & I & I & X & X & X & X \\
    X & X & I & I & X & I & X & I & X & I & X & I & X & X & I & I \\
    X & I & X & I & X & X & I & I & X & X & I & I & X & I & X & I
  \end{smallmatrix}~.
  \end{align}
  Rows 1--4 are the \(Z\)-type inner stabilizers of each \([[4,2,2]]\) block; rows 5--6 are the \(Z\)-type outer stabilizers inherited from the double cover; rows 7--10 are the \(X\)-type inner stabilizers; rows 11--12 are the \(X\)-type outer stabilizers.

protection: |
  Detects errors on up to 3 qubits and corrects errors on 1 qubit.

features:
  encoders:
    - 'A fault-tolerant, bare-ancilla state-preparation procedure for the logical \(|\overline{0}\rangle\) and \(|\overline{+}\rangle\) states is given in \cite{arxiv:2510.18753}.'

  transversal_gates:
    - 'SWAP-transversal gates lifted from automorphisms of the seed \([[4,2,2]]\) code, together with the \(ZX\)-duality gates \(\overline{H}_\tau\) and \(\overline{S}_\tau\) inherited from the symplectic double, generate \(216\) unique logical gates and, with a global logical phase gate, the group \((A_8\times A_8)\rtimes(C_2\times C_2)\subset \mathrm{Sp}_8(\mathbb{F}_2)\); a targeted logical \(S\) gate on any logical qubit instead generates the full symplectic group \(\mathrm{Sp}_8(\mathbb{F}_2)\) \cite{arxiv:2510.18753}.'

  general_gates:
    - 'Any logical Clifford circuit on the four logical qubits can be compiled using the SWAP-transversal gateset together with at most a small number of logical phase-gate injections via state teleportation \cite{arxiv:2510.18753}.'

  fault_tolerance:
    - 'The transversal phase gate on the outer \([[8,4,2]]\) \hyperref[topic:symplectic-doubling]{symplectic double} code requires performing logical global phase gates on each \([[4,2,2]]\) block to remain SWAP-transversal on the concatenated code; this can be implemented fault-tolerantly, but requires two-qubit gates \cite[Appx. D.7]{arxiv:2510.18753}\cite{arxiv:2510.18753}.'
    - 'An automorphism gate that swaps logical qubits between different \([[4,2,2]]\) blocks requires additional \([[4,2,2]]\) ancilla blocks to implement fault-tolerantly \cite[Appx. D.8]{arxiv:2510.18753}.'

realizations:
  - 'Neutral atom arrays: state initialization of the \([[16,4,4]]\) doubly concatenated code (a.k.a., the level-two many-hypercube code) on a device by Infleqtion \cite{arxiv:2509.13247}.'

