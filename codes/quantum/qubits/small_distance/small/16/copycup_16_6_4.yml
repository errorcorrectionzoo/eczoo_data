code_id: copycup_16_6_4
physical: qubits
logical: qubits

name: '\([[16,6,4]]\) copy-cup code'
introduced: '\cite{arxiv:2602.23307}'

description: |
  An even \hyperref[topic:quantum-weight-enumerator]{pure} \([[16,6,4]]\) CSS code that admits a constant-depth logical \(CZ\) gate between two copies and is constructed as a balanced product of two weight-four cyclic group-algebra codes over \(\mathbb{F}_2[\mathbb{Z}_8]\).
  It is one of two inequivalent \([[16,6,4]]\) codes whose complete logical Clifford group is realizable by depth-one two-local circuits, the other being the \hyperref[code:stab_16_6_4]{tesseract color code}.

  A stabilizer tableau for the code, given by cyclic shifts of the \hyperref[code:generalized_bicycle]{generalized bicycle} rows \(H_X=(A|B)\) and \(H_Z=(B^T|A^T)\), is \cite{arxiv:2602.23307}
  \begin{align}
  \begin{smallmatrix}
    X & X & X & X & I & I & I & I & X & X & I & X & I & I & X & I \\
    I & X & X & X & X & I & I & I & I & X & X & I & X & I & I & X \\
    I & I & X & X & X & X & I & I & X & I & X & X & I & X & I & I \\
    I & I & I & X & X & X & X & I & I & X & I & X & X & I & X & I \\
    I & I & I & I & X & X & X & X & I & I & X & I & X & X & I & X \\
    Z & I & Z & I & I & Z & I & Z & Z & I & I & I & I & Z & Z & Z \\
    Z & Z & I & Z & I & I & Z & I & Z & Z & I & I & I & I & Z & Z \\
    I & Z & Z & I & Z & I & I & Z & Z & Z & Z & I & I & I & I & Z \\
    Z & I & Z & Z & I & Z & I & I & Z & Z & Z & Z & I & I & I & I \\
    I & Z & I & Z & Z & I & Z & I & I & Z & Z & Z & Z & I & I & I
  \end{smallmatrix}~,
  \end{align}
  where \(A=a(P)\) and \(B=b(P)\) are the \(8\times 8\) circulants of \(a(x)=1+x+x^2+x^3\) and \(b(x)=1+x+x^3+x^6\), and \(P\) is the length-eight cyclic shift.


features:
  transversal_gates:
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2608.05688}.'
  general_gates:
    - 'Admits a constant-depth logical \(CZ\) gate between two copies of the code (an inter-code gate), the 2-copy-cup gate, built from a cup product on the balanced-product cochain complex subject to a pre-orientation condition on the two classical codes \cite{arxiv:2602.23307,arxiv:2410.16250}.'

relations:
  parents:
    - code_id: generalized_bicycle
      detail: 'The \([[16,6,4]]\) copy-cup code is the generalized bicycle code \(\text{GB}(a,b)\) over \(\mathbb{Z}_8\) with \(a(x)=1+x+x^2+x^3\) and \(b(x)=1+x+x^3+x^6\), equivalently the balanced product of two weight-four cyclic group-algebra codes \cite{arxiv:2602.23307}.'
    - code_id: small_distance_qubit_stabilizer
  cousins:
    - code_id: stab_16_6_4
      detail: |
        The \([[16,6,4]]\) copy-cup code and the \([[16,6,4]]\) tesseract color code are the two inequivalent \([[16,6,4]]\) codes whose complete logical Clifford group is realizable by depth-one two-local circuits \cite{arxiv:2608.05688}; both are \hyperref[topic:quantum-weight-enumerator]{pure} CSS codes whose stabilizer generators all have weight eight.
        The two are inequivalent in that they have different weight enumerators, and one is even while the other is doubly-even self-dual.


