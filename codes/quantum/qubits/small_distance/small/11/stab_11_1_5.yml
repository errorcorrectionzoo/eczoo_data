code_id: stab_11_1_5
physical: qubits
logical: qubits

name: '\([[11,1,5]]\) quantum dodecacode'
short_name: '\([[11,1,5]]\)'
introduced: '\cite{arxiv:quant-ph/9608006}'

description: |
  Eleven-qubit \hyperref[topic:quantum-weight-enumerator]{pure} stabilizer code that is the smallest qubit stabilizer code to correct two-qubit errors.
  It can be obtained from the additive but not \(\mathbb{F}_4\)-linear dodecacode by puncturing \cite[Table IV]{arxiv:quant-ph/9608006}.

  A stabilizer tableau for the code is given by \cite[Sec. V]{arxiv:quant-ph/0406063}
  \begin{align}
  \begin{array}{ccccccccccc}
    X & I & I & I & I & Z & Z & Z & I & X & X \\
    I & X & I & I & I & Z & Z & Y & Z & I & Y \\
    I & I & X & I & I & Z & Z & X & X & Z & I \\
    I & I & I & X & I & Z & Y & I & X & X & Y \\
    I & I & I & I & X & Z & X & I & Z & Z & X \\
    I & I & Z & I & I & X & Y & I & Y & Z & Z \\
    I & Z & Z & I & I & I & X & Z & I & X & Z \\
    I & Z & I & I & Z & I & Z & X & X & I & Z \\
    Z & Z & Z & I & Z & I & I & Z & X & Z & X \\
    I & Z & I & Z & I & I & Z & I & Z & X & X
  \end{array}~.
  \end{align}
  It is the quaternary generator matrix of that reference, translated into Paulis by the \hyperref[topic:gf4-representation]{\(\mathbb{F}_4\) representation} with \(\omega\to X\), \(\omega^2\to Z\), and \(1\to Y\).
  The code has paired support despite not being Hermitian \cite{arxiv:2605.15344}.

protection: 'Smallest stabilizer code that protects against errors on any two qubits. Detects four-qubit errors.'

features:
  encoders:
    - 'Encoding circuit consisting of 32 gates constructed from reinforcement learning \cite{arxiv:2311.04750}.'

relations:
  parents:
    - code_id: small_distance_qubit_stabilizer
# Not over \mathbb{F}_4 because dodecacode is additive but not \mathbb{F}_4-linear

