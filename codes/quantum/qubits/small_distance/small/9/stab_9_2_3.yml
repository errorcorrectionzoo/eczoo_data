code_id: stab_9_2_3
physical: qubits
logical: qubits

name: '\([[9,2,3]]\) automorphism-maximal code'
introduced: '\cite{arxiv:2609.19250}'

description: |
  A non-CSS stabilizer code on which single-qubit Clifford gates together with qubit permutations realize the largest logical group attainable on two logical qubits.
  It is the smallest distance-three stabilizer code with this property.

  A stabilizer tableau for the code is \cite{arxiv:2609.19250}\cite[ID 80585]{preset:qiskit}
  \begin{align}
  \begin{array}{ccccccccc}
    X & Z & I & I & Y & X & I & I & I \\
    I & I & X & Z & I & I & Y & X & I \\
    Y & X & I & I & I & X & I & I & Z \\
    I & I & Y & X & I & I & I & X & Z \\
    Y & Y & I & I & Z & Y & I & I & I \\
    I & I & Y & Y & I & I & Z & Y & I \\
    X & X & X & X & Z & I & Z & I & X
  \end{array}~.
  \end{align}
  The logical basis is \(\overline{X}_1=IIZIYXIZI\), \(\overline{X}_2=IYIIIYYXI\), \(\overline{Z}_1=IXIXXIXII\), and \(\overline{Z}_2=IYIYIYIYI\) \cite{arxiv:2609.19250}.


features:
  transversal_gates:
    - |
      Single-qubit Clifford gates together with qubit permutations realize the logical group \(O^{+}(4,2)\) of order 72 \cite{arxiv:2609.19250}.
      In the displayed logical basis, this group is generated by \(H_1\), \(H_2\), and \(\mathrm{CZ}_{12}\).
      A different logical basis gives the generators \(H_1\), \(S_1\), and \(\mathrm{SWAP}_{12}\) \cite[Tab. X]{arxiv:2609.19250}.
      This is the largest logical group attainable this way at \(k=2\), exceeding the maximum of 48 attainable by a CSS code \cite{arxiv:2609.19250}.

relations:
  parents:
    - code_id: small_distance_qubit_stabilizer
  cousins:
    - code_id: stab_6_2_2
      detail: 'A non-CSS code with the same parameters as the \([[6,2,2]]\) \(C_6\) code attains the logical group \(O^{+}(4,2)\) by single-qubit Clifford gates and qubit permutations \cite{arxiv:2609.19250}. That code and the \([[9,2,3]]\) automorphism-maximal code are the unique smallest \(k=2\) stabilizer codes doing so at distances two and three, up to local-Clifford and permutation equivalence \cite{arxiv:2609.19250}.'


