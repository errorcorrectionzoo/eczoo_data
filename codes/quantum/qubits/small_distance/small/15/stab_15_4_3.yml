    - code_id: stab_15_6_3
      detail: 'The \([[15,4,3]]\) code is obtained from the \([[15,6,3]]\) code by fixing two additional logical qubits to the \(+1\) eigenspaces of logical \(X\) operators supported on weight-five codewords of the \([15,7,5]\) BCH code. The two codes have the same \(Z\)-type stabilizer group. Both codes have exactly 35 weight-3 \(X\)-type logical operators. These correspond to the weight-3 codewords of the \([15,11,3]\) Hamming code. Every \(Z\)-type logical operator has even weight at least 4.'
