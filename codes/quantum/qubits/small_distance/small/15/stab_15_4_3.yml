code_id: stab_15_4_3
physical: qubits
logical: qubits

name: '\([[15,4,3]]\) quantum Hamming subcode'
introduced: '\cite{preset:QECDB}\cite{arxiv:2608.05688}'

description: |
  A \hyperref[topic:quantum-weight-enumerator]{pure} CSS subcode of the \([[15,7,3]]\) quantum Hamming code obtained by fixing three logical qubits to the \(+1\) eigenspaces of independent logical \(X\) operators.
  Equivalently, \(X^{\otimes 15}\) and two weight-five \(X\)-type logical operators are adjoined to the stabilizer group.

  The \(Z\)-type stabilizers are generated by the \([15,4,8]\) simplex code, while the \(X\)-type stabilizers are generated by the \([15,7,5]\) BCH code of designed distance five, which contains both the simplex code and the all-ones vector.
  A stabilizer tableau for the code, in a qubit ordering for which both classical codes are cyclic, is \cite[ID 6705228319cca60cf657a8ee]{preset:QECDB}\cite{arxiv:2608.05688}
  \begin{align}
  \begin{smallmatrix}
    Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I & I \\
    I & Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I \\
    I & I & Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z \\
    I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I & I & Z \\
    X & I & I & I & I & I & I & X & X & X & I & X & I & I & I \\
    I & X & I & I & I & I & I & I & X & X & X & I & X & I & I \\
    I & I & X & I & I & I & I & I & I & X & X & X & I & X & I \\
    I & I & I & X & I & I & I & I & I & I & X & X & X & I & X \\
    I & I & I & I & X & I & I & X & X & X & I & I & X & X & I \\
    I & I & I & I & I & X & I & I & X & X & X & I & I & X & X \\
    I & I & I & I & I & I & X & X & X & I & X & I & I & I & X
  \end{smallmatrix}~.
  \end{align}

  The simultaneous permutation automorphism group of the two classical codes coincides with the automorphism group of the BCH code alone, which automatically preserves the simplex code.
  It is isomorphic to \(\Gamma L(2,4)\), of order 360, and acts transitively but imprimitively on the qubits, with five blocks of three qubits corresponding to the cosets of \(GF(4)^{\times}\) in \(GF(16)^{\times}\).

protection: |
  Since the minimum weight of an \(X\)-type logical operator is 3 while that of a \(Z\)-type logical operator is 4, the code detects \(X\)-type errors on up to 2 qubits and \(Z\)-type errors on up to 3 qubits.

features:
  transversal_gates:
    - 'Transversal \(\sqrt{X}\) preserves the code \cite{arxiv:2608.05688}.'
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2608.05688}.'
    - 'Each of the four logical \(\sqrt{X}\) gates and each of the six Hadamard-conjugated logical controlled-\(Z\) gates can be realized individually by a depth-one circuit of two-local code-preserving physical gates, so that every \(X\)-type diagonal logical Clifford gate is addressable \cite{arxiv:2608.05688}.'


