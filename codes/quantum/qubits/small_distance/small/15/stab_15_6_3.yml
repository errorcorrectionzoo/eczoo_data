code_id: stab_15_6_3
physical: qubits
logical: qubits

name: '\([[15,6,3]]\) gauge-fixed quantum Hamming code'
introduced: '\cite{arxiv:1302.1035,arxiv:2608.05688}'

description: |
  A \hyperref[topic:quantum-weight-enumerator]{pure} CSS code obtained from the \([[15,7,3]]\) quantum Hamming code by promoting the logical operator \(X^{\otimes 15}\) to a stabilizer, i.e., by \hyperref[topic:gauging-out]{gauging out} the corresponding logical qubit \cite[Sec. IV.A]{arxiv:1302.1035}.
  Equivalently, the code is obtained from the tesseract color code by removing one qubit.

  The \(Z\)-type stabilizers are generated by the \([15,4,8]\) simplex code, while the \(X\)-type stabilizers are generated by the \([15,5,7]\) punctured first-order RM code, i.e., the span of the simplex code and the all-ones vector.
  A stabilizer tableau for the code, in a qubit ordering for which both classical codes are cyclic, is \cite[ID 6705228819cca60cf657a8f4]{preset:QECDB}\cite{arxiv:2608.05688}
  \begin{align}
  \begin{smallmatrix}
    Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I & I \\
    I & Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I \\
    I & I & Z & I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z \\
    I & I & I & Z & Z & Z & Z & I & Z & I & Z & Z & I & I & Z \\
    X & I & I & I & I & X & I & X & I & I & X & X & I & X & X \\
    I & X & I & I & I & X & X & X & X & I & X & I & X & X & I \\
    I & I & X & I & I & I & X & X & X & X & I & X & I & X & X \\
    I & I & I & X & I & X & I & I & X & X & I & X & X & X & I \\
    I & I & I & I & X & I & X & I & I & X & X & I & X & X & X
  \end{smallmatrix}~.
  \end{align}

  The simultaneous permutation automorphism group of the two classical codes is isomorphic to \(GL(4,2)\), of order 20160, and acts transitively on the qubits \cite{arxiv:1302.1035}.

protection: |
  Since the minimum weight of an \(X\)-type logical operator is 3 while that of a \(Z\)-type logical operator is 4, the code detects \(X\)-type errors on up to 2 qubits and \(Z\)-type errors on up to 3 qubits.

features:
  transversal_gates:
    - 'Qubit permutations combined with transversal CNOT gates realize the full logical linear group \(GL(6,2)\) on one code block and the full \(GL(12,2)\) on pairs of code blocks \cite[Sec. IV.A]{arxiv:1302.1035}.'
    - 'Transversal \(\sqrt{X}\) preserves the code \cite{arxiv:2608.05688} and implements an order-two logical gate that is a product of Hadamard-conjugated controlled-\(Z\) gates on nine pairs of logical qubits, up to a logical Pauli correction.'
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2608.05688}.'


relations:
  parents:
    - code_id: quantum_reed_muller
      detail: 'The \([[15,6,3]]\) code is a CSS code constructed from the \([15,5,7]\) punctured first-order RM code and the \([15,4,8]\) shortened first-order RM code.'
    - code_id: quantum_bch
      detail: 'Both classical codes underlying the \([[15,6,3]]\) code are BCH codes: the \([15,5,7]\) punctured first-order RM code is the BCH code of designed distance seven, and the \([15,4,8]\) simplex code is the BCH code of designed distance eight.'
    - code_id: quantum_cyclic
      detail: 'The \([[15,6,3]]\) code is cyclic in a qubit ordering in which both underlying classical codes are cyclic.'
    - code_id: small_distance_qubit_stabilizer
  cousins:
