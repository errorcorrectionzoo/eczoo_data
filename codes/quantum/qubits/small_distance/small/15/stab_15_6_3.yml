      detail: 'The \([[15,6,3]]\) code is obtained from the \([[15,7,3]]\) quantum Hamming code by \hyperref[topic:gauging-out]{gauging out} the logical qubit whose logical \(X\) operator is \(X^{\otimes 15}\) \cite[Sec. IV.A]{arxiv:1302.1035}.'
    - code_id: stab_16_6_4
      detail: 'The \([[15,6,3]]\) code is obtained from the tesseract color code by removing one qubit, which punctures the underlying first-order RM code on the \(X\) side and shortens it to the simplex code on the \(Z\) side.'
