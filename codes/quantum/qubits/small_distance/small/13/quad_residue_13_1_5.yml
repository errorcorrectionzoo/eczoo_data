code_id: quad_residue_13_1_5
physical: qubits
logical: qubits

name: '\([[13,1,5]]\) quantum QR code'
introduced: '\cite[pg. 11]{arxiv:quant-ph/9704019}'

description: |
  Thirteen-qubit cyclic Hermitian qubit code derived from a quaternary quadratic-residue code using the Hermitian construction \cite[pg. 11]{arxiv:quant-ph/9704019}\cite{arxiv:2211.00891}.
  The code admits a stabilizer tableau whose rows are cyclic permutations of the Pauli string \(XXZZIZIIIZIZZ\) \cite[ID 67067199e766ad364e845262]{preset:QECDB}.

relations:
  parents:
    - code_id: stabilizer_over_gf4
    - code_id: small_distance_qubit_stabilizer
  cousins:
    # galois_quad_residue demoted from parent to cousin: that entry is the Galois-qudit
    # CSS construction applied to a dual-containing QR code, while this code is a
    # non-CSS qubit code coming from a quaternary QR code via the Hermitian construction.
    - code_id: galois_quad_residue
      detail: 'The \([[13,1,5]]\) code is obtained from a quaternary QR code via the Hermitian construction and is not CSS, in contrast to quantum QR codes, which are obtained via the CSS construction \cite[pg. 11]{arxiv:quant-ph/9704019}.'
    - code_id: q-ary_quad_residue
      detail: 'The stabilizer group of the \([[13,1,5]]\) code is defined by a quaternary QR code of length 13 \cite[pg. 11]{arxiv:quant-ph/9704019}.'


