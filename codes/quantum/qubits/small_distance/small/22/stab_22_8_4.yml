code_id: stab_22_8_4
physical: qubits
logical: qubits

name: '\([[22,8,4]]\) Grassl-Rötteler code'
introduced: '\cite{arxiv:1302.1035,arxiv:2608.05688}'

description: |
  Self-dual \hyperref[topic:quantum-weight-enumerator]{pure} CSS code constructed from a self-orthogonal \([22,7,8]\) classical binary code \cite[Sec. IV.C]{arxiv:1302.1035}.
  All of its logical Clifford gates can be realized by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2608.05688}.

  The underlying classical code has weight enumerator \(1 + 21y^{8} + 42y^{10} + 42y^{12} + 21y^{14} + y^{22}\); it is even but not doubly even, and it contains the all-ones vector.
  Its permutation automorphism group is isomorphic to \(PGL(2,7)\), of order 336 \cite[Sec. IV.C]{arxiv:1302.1035}, fixing one distinguished qubit and acting transitively on the remaining 21.

  Both an \(X\)-type and a \(Z\)-type stabilizer generator are supported on each row of the following stabilizer tableau \cite[ID 67374955079675676c5c196a]{preset:QECDB}\cite{arxiv:2608.05688}
  \begin{align}
  \begin{smallmatrix}
    Z & I & I & I & I & I & I & I & I & Z & Z & Z & Z & Z & Z & I & I & Z & Z & Z & Z & Z \\
    I & Z & I & I & I & I & I & Z & Z & I & I & I & I & Z & Z & I & Z & I & Z & Z & Z & Z \\
    I & I & Z & I & I & I & I & Z & I & Z & I & Z & Z & I & Z & Z & Z & Z & I & I & I & Z \\
    I & I & I & Z & I & I & I & I & Z & I & Z & I & I & I & Z & Z & Z & Z & Z & Z & Z & I \\
    I & I & I & I & Z & I & I & Z & I & I & I & Z & I & Z & Z & Z & Z & Z & Z & Z & I & I \\
    I & I & I & I & I & Z & I & Z & I & I & Z & Z & Z & I & I & Z & Z & Z & Z & I & Z & I \\
    I & I & I & I & I & I & Z & Z & Z & Z & I & Z & I & I & I & Z & I & I & I & Z & Z & I
  \end{smallmatrix}~.
  \end{align}


features:
  transversal_gates:
    - 'Qubit permutations combined with transversal CNOT gates between two code blocks realize the full logical linear group \(GL(16,2)\) on the 16 logical qubits of the two blocks \cite[Sec. IV.C]{arxiv:1302.1035}.'
    - 'All logical Clifford gates can be realized as two-fold transversal gates, i.e., by depth-one circuits of two-local code-preserving physical gates \cite{arxiv:2608.05688}.'


