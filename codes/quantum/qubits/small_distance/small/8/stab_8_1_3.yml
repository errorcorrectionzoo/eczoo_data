code_id: stab_8_1_3
physical: qubits
logical: qubits

name: '\([[8,1,3]]\) permutation-Hadamard code'
introduced: '\cite{arxiv:2609.19250}'

description: |
  A non-CSS cyclic stabilizer code that is the shortest code to realize a logical Hadamard gate via a single cyclic relabelling of the physical qubits.

  Its stabilizer group is generated by the first six cyclic shifts of \(g=IIXXIYXZ\) together with \(h=-X^{\otimes8}\) \cite{arxiv:2609.19250}.

  A logical Pauli basis is \(\overline{X}=IIIXYIIZ\) and \(\overline{Z}=ZIIIXYII\) \cite[Constr. 7]{arxiv:2609.19250}.

features:
  transversal_gates:
    - 'The cyclic qubit permutation \(\rho=(12345678)\) implements a logical Hadamard gate \cite{arxiv:2609.19250}.'


relations:
  parents:
    - code_id: small_distance_qubit_stabilizer
    - code_id: quantum_cyclic


