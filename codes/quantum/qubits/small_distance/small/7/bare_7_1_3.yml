code_id: bare_7_1_3
physical: qubits
logical: qubits

name: '\([[7,1,3]]\) bare code'
introduced: '\cite{arxiv:1702.01155}'

description: |
  A \([[7,1,3]]\) code that admits fault-tolerant syndrome extraction using only one ancilla per stabilizer generator measurement.

  A stabilizer tableau for the code is given by \cite[ID 108]{preset:qiskit}
  \begin{align}
  \begin{array}{ccccccc}
    X & I & I & I & Z & I & I \\
    I & X & I & I & Z & I & I \\
    I & I & X & I & I & Z & I \\
    I & I & I & X & I & I & Z \\
    I & I & Z & Z & I & Y & Y \\
    Z & Z & Z & I & X & X & Z
  \end{array}~.
  \end{align}
  It is one of sixteen distinct indecomposable \([[7,1,3]]\) codes \cite{arxiv:0709.1780}.

features:
  transversal_gates:
    - 'No nontrivial logical Clifford gates from single-qubit Clifford gates and qubit permutations \cite{arxiv:2606.02542}.'
  general_gates:
    - 'Logical \(S\) gate via a dynamical automorphism that gauge-fixes through a closed loop of \([[7,1,3]]\) codes, followed by single-qubit Clifford gates and a qubit permutation \cite{arxiv:2606.02542}.'
  decoders:
    - 'Fault-tolerant syndrome extraction using a single ancilla \cite{arxiv:1702.01155}.'

relations:
  parents:
    - code_id: small_distance_qubit_stabilizer


