code_id: qubit_6_2_3
physical: qubits
logical: qubits

name: '\(((6,2,3))\) transversal-\(\mathbb{Z}_{10}\) code'
introduced: '\cite{arxiv:2504.20847}'


description: |
  Six-qubit code that realizes gates from the group \(\mathbb{Z}_{10}\) transversally.
  It has the minimum length among codes encoding a qubit with distance at least three whose transversal gates cannot all be made \hyperref[topic:clifford]{Clifford} by a change of logical basis \cite[Sec. IV.B.4]{arxiv:2610.29955}.
  Up to local unitaries and qubit permutations, it is the only \(((6,2,3))\) code with a transversal gate of projective logical order five \cite[Cor. IV.7]{arxiv:2610.29955}.

  With the qubits split into the first four and the last two, the codewords are \cite[Eqs. (122-123)]{arxiv:2610.29955}
  \begin{align}
  \begin{split}
  |\overline{0}\rangle &= \tfrac{1}{\sqrt{10}}\left(|0000\rangle(|00\rangle+|11\rangle)+|S_3\rangle|10\rangle\right)+\tfrac{1}{\sqrt{15}}|E\rangle|01\rangle\\
  |\overline{1}\rangle &= \tfrac{1}{\sqrt{10}}\left(|1111\rangle(|00\rangle+|11\rangle)-|S_1\rangle|01\rangle\right)-\tfrac{1}{\sqrt{15}}|E^{*}\rangle|10\rangle~,
  \end{split}
  \end{align}
  where \(|S_j\rangle\) is the sum of all four-qubit basis states of weight \(j\).
  The state \(|E^{*}\rangle\) is the complex conjugate of \(|E\rangle=|1100\rangle+|0011\rangle+\omega(|1010\rangle+|0101\rangle)+\omega^{2}(|1001\rangle+|0110\rangle)\) with \(\omega=e^{2\pi i/3}\).
  See Ref. \cite{arxiv:2504.20847} for another presentation of the codewords.


features:
  transversal_gates:
    - 'The \(\mathbb{Z}_{10}\) group can be realized transversally \cite{arxiv:2504.20847}.'
    - 'The transversal gate \(\bigotimes_{j=1}^{6}\text{diag}(1,\zeta^{a_j})\) with \(\zeta=e^{2\pi i/5}\) and \(a=(1,1,1,1,2,3)\) acts as the logical gate \(\text{diag}(1,\zeta^{4})\) on the above codewords \cite[Eq. (125)]{arxiv:2610.29955}.'
    - 'Up to a phase, every nontrivial logical gate realized by a transversal diagonal gate on a \(((6,2,3))\) code has order two, three, or five \cite[Thm. IV.3]{arxiv:2610.29955}.'


