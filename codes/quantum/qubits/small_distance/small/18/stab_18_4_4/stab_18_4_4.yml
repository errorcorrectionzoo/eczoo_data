code_id: stab_18_4_4
physical: qubits
logical: qubits

name: '\([[18,4,4]]\) 6.6.6 toric color code'
introduced: '\cite{arxiv:quant-ph/0605138,arxiv:cond-mat/0607736}'

alternative_names:
  - '\([[18,4,4]]\) bivariate bicycle (BB) code'

description: |
  Self-dual \hyperref[topic:quantum-weight-enumerator]{pure} CSS code that is the \hyperref[code:triangular_color]{6.6.6 (honeycomb) color code} on the torus \(\mathbb{Z}^2/3\mathbb{Z}^2\).
  The nine hexagonal faces each host a weight-six \(X\)-type and a weight-six \(Z\)-type stabilizer generator, and the 18 qubits sit on the vertices of the tiling, i.e., on the faces of the underlying triangular lattice.

  The faces of the honeycomb tiling of a torus \(\mathbb{Z}^2/L\) are three-colorable only when \(L\) lies in a particular index-three sublattice of \(\mathbb{Z}^2\).
  Among all such tori, this is the smallest one whose 6.6.6 color code has distance four; the smaller admissible tori give the \hyperref[code:stab_6_4_2]{\([[6,4,2]]\) code} on three hexagons and a \([[12,4,2]]\) code on six hexagons, both of distance two.

  \begin{figure}
    \includegraphics{stab_18_4_4}
    \caption{
    The nine hexagonal faces of the code on the \(3\times 3\) torus, each carrying a weight-six \(X\)-type and a weight-six \(Z\)-type generator, with the two boundary identifications indicated by the dashed arrows.
    Shaded circles are the 18 physical qubits; a white circle is a periodic image of the shaded qubit carrying the same letter.
    }
    \label{figure:18-4-4-color}
  \end{figure}

  The code is simultaneously the \hyperref[code:qcga]{bivariate bicycle code} with \(\ell=m=3\), \(A=x+1+y^2\) and \(B=y+1+x^2\) \cite{arxiv:2505.09684}, i.e., an Abelian 2BGA code over \(\mathbb{Z}_3\times\mathbb{Z}_3\).
  It is equivalently the \(\ell=m=3\) member of the bivariate bicycle family \(A=1+x+xy\), \(B=1+y+xy\), which yields 6.6.6 color codes whenever \(\ell\) and \(m\) are multiples of three \cite[Exam. 1]{arxiv:2412.04181}.

  In the bivariate-bicycle qubit ordering \(L_{3a+b},R_{3a+b}\), where the group element \(x^a y^b\) labels the left and right blocks, the stabilizer tableau of the nine \(X\)-type faces is
  \begin{align}
  \begin{smallmatrix}
    X & I & X & X & I & I & I & I & I & X & X & I & I & I & I & X & I & I \\
    I & I & I & I & X & X & I & I & X & I & I & X & X & I & X & I & I & I \\
    I & X & I & I & I & I & X & X & I & I & I & I & I & X & I & I & X & X \\
    X & X & I & I & X & I & I & I & I & I & X & X & I & I & I & I & X & I \\
    I & I & I & X & I & X & X & I & I & X & I & I & X & X & I & I & I & I \\
    I & I & X & I & I & I & I & X & X & I & I & I & I & I & X & X & I & X \\
    I & X & X & I & I & X & I & I & I & X & I & X & I & I & I & I & I & X \\
    I & I & I & X & X & I & I & X & I & I & X & I & I & X & X & I & I & I \\
    X & I & I & I & I & I & X & I & X & I & I & I & X & I & I & X & X & I
  \end{smallmatrix}~,
  \end{align}
  listed in color classes of three: rows 1--3, rows 4--6, and rows 7--9 each partition all 18 qubits.
  The \(Z\)-type generators are supported on the same nine strings because \(C_X=C_Z\).

  The classical code \(C=C_X=C_Z\) is a self-orthogonal \([18,7]\) code with weight enumerator \(1+18x^6+45x^8+45x^{10}+18x^{12}+x^{18}\).
  It is even but not doubly even, so this is not a \hyperref[code:quantum_divisible]{divisible} code.

# There is a second, inequivalent \([[18,4,4]]\) bivariate bicycle code built from the cyclic group \(\mathbb{Z}_9\) instead, so the parameters alone do not pick out this code within the family.

features:
  transversal_gates:
    - 'Transversal Hadamard, since the code is a \hyperref[code:self_dual_css]{self-dual CSS code}. The code is hyperbolic self-dual, so in a suitable logical basis transversal Hadamard acts as pairwise logical swaps rather than as logical Hadamards \cite[Sec. III]{arxiv:1703.07847}.'

realizations:
  - 'Superconducting circuits: syndrome extraction has been implemented for the \([[18,4,4]]\) BB code on a 32-qubit Kunlun device by the Wang, Song, and Deng groups \cite{arxiv:2505.09684}. The same is also shown for an \([[18,6,3]]\) code obtained by removing two check operators from the former code \cite{arxiv:2505.09684}.'


