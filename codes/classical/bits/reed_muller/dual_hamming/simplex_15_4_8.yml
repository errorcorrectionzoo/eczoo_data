code_id: simplex_15_4_8
physical: bits
logical: bits

name: '\([15,4,8]\) simplex code'

description: |
  Binary code that corrects three bit errors on fifteen bits and generates the \(Z\)-type stabilizers of the \([[15,6,3]]\) and \([[15,4,3]]\) codes.
  It is the \(m=4\) member of the simplex family, i.e., the dual of the \([15,11,3]\) Hamming code.

  Adjoining the all-ones vector yields the \([15,5,7]\) punctured first-order RM code \cite[pg. 31]{preset:MacSlo}.

relations:
  parents:
    - code_id: simplex
    - code_id: bch
      detail: 'The \([15,4,8]\) simplex code is the BCH code of designed distance eight.'


