code_id: simplex_15_4_8
physical: bits
logical: bits

name: '\([15,4,8]\) simplex code'

description: |
  Binary code that corrects three bit errors on fifteen bits and generates the stabilizers of the \([[15,7,3]]\) quantum Hamming code.
  It also generates the \(Z\)-type stabilizers of the \([[15,6,3]]\) and \([[15,4,3]]\) codes.
  It is the \(m=4\) member of the simplex family, i.e., the dual of the \([15,11,3]\) Hamming code.

relations:
  parents:
    - code_id: simplex


