code_id: rm_16_5_8
physical: bits
logical: bits

name: '\([16,5,8]\) first-order RM code'

description: |
  Binary code that corrects three bit errors on sixteen bits and from which the NR code, the \(\Lambda_{16}\) Barnes-Wall lattice, and the tesseract color code are constructed.
  It is the \(m=4\) member of the first-order RM family.

relations:
  parents:
    - code_id: biorthogonal
      detail: 'The \([16,5,8]\) first-order RM code is the RM\((1,4)\) code.'
    - code_id: griesmer
      detail: 'Extending the \([15,5,7]\) BCH code by a parity check yields the \([16,5,8]\) first-order RM code, which saturates the Griesmer bound \cite[pg. 157]{doi:10.1201/9781315371993}.'


