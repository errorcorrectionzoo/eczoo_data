code_id: polar
physical: bits
logical: bits

name: 'Polar code'
introduced: '\cite{manual:{N. Stolte, “Rekursive Codes mit der Plotkin-Konstruktion und ihre Decodierung”, PhD thesis, Darmstadt University of Technology, 2002},arxiv:0807.3917}'

description: |
  A member of a family of binary linear codes whose encoding is based on picking the "most reliable bits" at the output of a noise channel.

  In its basic version, a binary linear polar code encodes \(K\) message bits into \(N=2^n\) bits. The linear transformation that defines the code is given by the matrix \(G^{(n)}=B_N G^{\otimes n}\), where \(B_N\) is a certain \(N\times N\) permutation matrix, and \(G^{\otimes n}\) is the \(n\)th Kronecker power of the \(2\times 2\) \textit{kernel matrix} \(G=\left(\begin{smallmatrix}1 & 0\\ 1 & 1 \end{smallmatrix}\right)\). To encode \(K\) message bits, one forms an \(N\)-vector \(u\) in which \(K\) coordinates represent the message bits. The remaining \(N-K\) coordinates are set to some fixed values and are said to be \textit{frozen}. The codeword \(x \in \{0,1\}^N\) is obtained as \(x=u G^{(n)}\).

  The choice of the frozen coordinates depends on the communication channel, and they correspond to the least reliable bits on the output of the channel under a particular decoding procedure called successive cancellation decoding. If the communication channel is input-symmetric, the values of the frozen bits can be set to zero.

  There are multiple variants of the above basic construction, in particular relying on other kernel matrices \cite{doi:10.1109/TIT.2010.2080990}.
  The codes can be defined for nonbinary alphabets, and they can be adjusted to support tasks such as lossless and lossy compression, successive refinement, communication over the multiple access channel, communication over the wiretap channel, and many others.

  Polar codes designed for a binary memoryless symmetric (BMS) channel are \textit{decreasing monomial codes}, spanned by evaluations of Boolean monomials closed downward under a channel-independent partial order \cite[Thm. 1]{arxiv:1601.06215}.
  The affine automorphism group of a decreasing monomial code consists of the maps \(x\mapsto Ax+b\) on the evaluation points \(x\in\mathbb{F}_2^n\) with \(A\) block lower-triangular \cite{arxiv:2103.14215}\cite[Thm. 3]{arxiv:2206.03342}.
  This group is generated by the lower-triangular affine group \cite[Thm. 2]{arxiv:1601.06215} and the frozen-set-preserving variable permutations, which act as the full symmetric group on each diagonal block \cite{arxiv:2101.09679}.
  For polar codes of rate equal to the capacity of a BMS channel, no diagonal block grows with \(n\) \cite[Thm. 1]{arxiv:2112.12495}.

protection: 'Protects against various types of noise in the communication channel, for instance, errors, erasures, or other types of noise. Distance plays no role in the analysis of its properties, and is much lower than the largest possible value given \(K,N\). Polar codes often need to be tailored for a given channel, but universal constructions also exist \cite{doi:10.1109/ISIT.2014.6875073}.'

features:
  rate: 'Supports reliable transmission at rates \(K/N\) approaching the Shannon capacity of the channel under the successive cancellation decoder \cite{arxiv:0807.3917,doi:10.1109/ISIT.2009.5205860}; see also Refs. \cite{doi:10.1109/TIT.2016.2616117,doi:10.1109/ISIT.2010.5513579}.'

  decoders:
    - 'Successive cancellation (SC) decoder \cite{arxiv:0807.3917}.'
    - 'Successive cancellation list (SCL) decoder \cite{doi:10.1109/TIT.2015.2410251} and a modification utilizing sequence repetition (SR-List) \cite{arxiv:2205.08857}.'
    - 'Soft cancellation (SCAN) decoder \cite{doi:10.1109/JSAC.2014.140515,doi:10.1109/ICC.2013.6655247}.'
    - 'Belief propagation (BP) decoder \cite{doi:10.1109/LCOMM.2008.080017}.'
    - 'Noisy quantum gate-based decoder \cite{arxiv:2210.10854}.'
    - 'Automorphism ensemble (AE) decoder with SC constituent decoders and block lower-triangular affine automorphisms \cite{arxiv:2101.09679}. The automorphisms commuting with SC decoding form a subgroup containing the lower-triangular affine group \cite[Thm. 2]{arxiv:2012.07635}, and automorphisms in the same right coset yield the same candidate \cite[Lemma 10]{arxiv:2206.03342}.'

realizations:
  - 'Code control channels for the 5G NR (New Radio) interfaces \cite{manual:{3rd Generation Partnership Project (3GPP), “Technical specification group radio access network”, 3GPP TS 38.212 V.15.0.0, 2017}}.'

notes:
  - 'For more details, see Refs. \cite{preset:HKSpolar,doi:10.1017/9781009283403}.'
  - 'See Kaiserslautern database \cite{preset:KLdatabase} and the pretty-good-codes database \cite{preset:PGCdatabase} for explicit representatives and benchmarking.'
  - 'Codes have been benchmarked using AFF3CT toolbox \cite{doi:10.1016/j.softx.2019.100345}.'
  - 'Polar codes are also useful for source coding \cite{doi:10.1109/TIT.2010.2040961}.'

relations:
  parents:
    - code_id: binary_linear
    - code_id: generalized_concatenated
      detail: 'Polar codes can be represented as generalized concatenations of their kernels.'
  cousins:
    - code_id: reed_muller
      detail: 'The generator matrices of RM and polar codes are different submatrices of Kronecker products of Hadamard matrices \cite{arxiv:0807.3917,doi:10.1109/ITWKSPS.2010.5503223}. There are families interpolating between the two codes \cite{arXiv:1401.3127}.'
    - code_id: hadamard
      detail: 'The generator matrices of RM and polar codes are different submatrices of Kronecker products of Hadamard matrices \cite{arxiv:0807.3917,doi:10.1109/ITWKSPS.2010.5503223}. There are families interpolating between the two codes \cite{arXiv:1401.3127}.'
    - code_id: polar_for_quantum
      detail: 'Quantum-classical polar codes generalize polar codes for transmission through channels with quantum output.'


