code_id: spc_4_3_2
physical: bits
logical: bits

name: '\([4,3,2]\) single parity-check (SPC) code'
short_name: '\([4,3,2]\) SPC'

description: |
  Binary code that detects any single bit flip on four bits by appending one parity bit to three message bits.
  Its all-ones parity check is the \(Z\)-type stabilizer of the \([[4,1,2]]\) LNCY code and both stabilizer generators of the \([[4,2,2]]\) code.

relations:
  parents:
    - code_id: parity_check
    - code_id: biorthogonal
      detail: 'The \([4,3,2]\) SPC code is the first-order RM\((1,2)\) code.'
  cousins:
    - code_id: stab_4_2_2
      detail: 'The \([[4,2,2]]\) code is constructed from the \([4,3,2]\) SPC code via the CSS construction.'
    - code_id: css_4_1_2
      detail: 'The \(Z\)-type stabilizer of the \([[4,1,2]]\) LNCY code is the parity check of the \([4,3,2]\) SPC code.'


