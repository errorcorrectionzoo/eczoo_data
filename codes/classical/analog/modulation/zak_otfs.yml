code_id: zak_otfs
physical: reals
logical: reals

name: 'Zak-transform orthogonal time frequency space (Zak-OTFS) modulation'
short_name: 'Zak-OTFS'
introduced: '\cite{arxiv:2302.08696}'

alternative_names:
  - 'OTFS 2.0'

description: |
  Linear modulation scheme that mounts information symbols on quasi-periodic delay-Doppler pulses and converts them to a time-domain signal by the inverse Zak transform \cite{arxiv:2302.08696}.
  Such pulses are geometric modes of time-varying wireless channels, which move them around in the delay-Doppler domain \cite{arxiv:2302.08696,arxiv:2402.09551}.

  Each pulse is quasi-periodic with delay period \(\tau_p\) and Doppler period \(\nu_p=1/\tau_p\) \cite{arxiv:2402.09551}.
  Its time-domain realization, a \textit{pulsone}, is a train of pulses spaced by \(\tau_p\) and modulated by a tone \cite{arxiv:2302.08696}.
  For bandwidth \(B\) and duration \(T\), filtered pulses sit on a lattice with spacings \(1/B\) in delay and \(1/T\) in Doppler, yielding \(MN=BT\) carriers with \(M=B\tau_p\) and \(N=T\nu_p\) \cite{arxiv:2402.09551}.

  In the discrete-time model, the carriers are the common eigenvectors of delay and Doppler shifts by multiples of \(\tau_p\) and \(\nu_p\) \cite[Lemma 6]{arxiv:2508.15671}\cite[Exam. 1]{arxiv:2604.16781}.
  These shifts form a maximal commutative subgroup of the discrete Heisenberg-Weyl group \cite[Exam. 1]{arxiv:2604.16781}.
  Zak-OTFS parallels quantum stabilizer codes, which store information in common eigenvectors of commuting bit and phase flips, the discrete analogs of delay and Doppler shifts \cite{arxiv:2302.08696}.

  The original OTFS proposal \cite{arxiv:1608.02993,doi:10.1109/WCNC.2017.7925924}, now called \textit{MC-OTFS}, approximates Zak-OTFS using periodic delay-Doppler signals and has a less predictable input-output relation \cite{arxiv:2302.08696,arxiv:2302.08705}.
  Earlier Zak-transform formulations of OTFS appeared in Refs. \cite{arxiv:2007.14357,arxiv:2106.12828}.

protection: |
  The input-output relation is predictable and non-fading when the effective channel delay and Doppler spreads are smaller than \(\tau_p\) and \(\nu_p\), respectively \cite{arxiv:2302.08696,arxiv:2302.08705}.
  Under this \textit{crystallization condition}, the effective channel can be read off from the response to a single pilot \cite{arxiv:2302.08705}.
  Gaussian pulse-shaping filters enlarge the region in which the crystallization condition holds \cite{arxiv:2405.02718}.

realizations:
  - 'Wireless testbeds: over-the-air transmission at 140 and 240 GHz \cite{arxiv:2504.15947} and at millimeter-wave frequencies on the COSMOS testbed \cite{arxiv:2511.07610}.'

notes:
  - 'See Ref. \cite{arxiv:2604.16781} for a review.'

relations:
  parents:
    - code_id: modulation
      detail: 'Zak-OTFS is a linear modulation scheme whose basis waveforms are \(MN\) pulsones, i.e., pulse trains modulated by tones \cite{arxiv:2302.08696}.'
  cousins:
    - code_id: gkp
      detail: 'Unfiltered Zak-OTFS carriers are quasi-periodic point pulses in the delay-Doppler domain of the Zak transform \cite{arxiv:2402.09551}. Ideal square-lattice GKP codewords are likewise point masses at the trivial syndrome in Zak-transform coordinates \cite[Prop. 4.4]{arxiv:2609.10802}.'
    - code_id: ldpc
      detail: 'LDPC coding widens the range of Doppler spreads over which model-free Zak-OTFS communication is reliable \cite{arxiv:2402.09551}. Placing information symbols rather than parity symbols on the delay-Doppler bins whose response is most reliably predicted from a pilot further lowers the bit error rate \cite{arxiv:2402.09551}.'


