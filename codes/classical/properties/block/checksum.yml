code_id: checksum

name: 'Checksum code'

description: |
  An error-detecting block code that appends to a message a shorter string, called a checksum, that is computed from the message.


protection: 'The checksum can be recalculated from the received message and compared with the appended checksum in order to detect certain transmission or storage errors.'

notes:
  - 'See Refs. \cite[Ch. 2]{manual:{J. Verhoeff, \emph{Error Detecting Decimal Codes}, Mathematical Centre Tracts 29 (Mathematisch Centrum, Amsterdam, 1969) \href{https://ir.cwi.nl/pub/13045}{URL}}}\cite{doi:10.1145/243439.243457} for surveys of check-digit schemes.'
  - 'See Ref. \cite{doi:10.1109/TDSC.2007.70216} for an evaluation of checksums and CRCs.'


relations:
  parents:
    - code_id: block
    - code_id: ecc_finite


