code_id: checksum

name: 'Checksum code'

description: |
  An error-detecting block code that appends to a message a shorter string, called a checksum, that is computed from the message.


protection: 'The checksum can be recalculated from the received message and compared with the appended checksum in order to detect certain transmission or storage errors.'
realizations:
  - 'Manuscript copying: the Masoretes counted the verses, words, and letters of biblical books, and Bible copyists counted letters and words for proofreading or salary purposes \cite{arxiv:1211.6847}. The Talmud states that the first sages counted all letters of the Torah \cite{manual:{Babylonian Talmud, Kiddushin 30a, William Davidson Edition \href{https://www.sefaria.org/Kiddushin.30a}{URL}}}.'


relations:
  parents:
    - code_id: block
    - code_id: ecc_finite


