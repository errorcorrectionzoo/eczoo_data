      detail: 'There are relations between LDCs and LTCs \cite{doi:10.1007/978-3-642-15369-3_50}.'
    - code_id: quantum_locally_recoverable
      detail: 'There are quantum counterparts of LDCs, but they can be transformed into (classical) LDCs which can be decoded well on average \cite{arxiv:0806.2101}.'


