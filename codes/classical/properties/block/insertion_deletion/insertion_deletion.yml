code_id: insertion_deletion


name: 'Editing code'
introduced: '\cite{manual:{V. I. Levenshtein, “Binary codes capable of correcting deletions, insertions, and reversals”, Soviet Physics Doklady 10(8) (1966)}}'

alternative_names:
  - 'Insertion and deletion code'

description: |
    A block code designed to protect against insertions, where a new symbol is added somewhere within the string, and deletions, where a symbol at an unknown location is erased.
# Since deletions come at unknown locations, they are more difficult to deal with than erasures.

protection: |
    The metric measuring distance of a received word to the nearest codeword is the \textit{Levenshtein deletion distance}: given vectors \(u,v\), this distance is one-half the smallest number of deletions and insertions needed to change \(u\) to \(v\).
    A code \(C\) corrects \(e\) deletions if all codewords are separated by at least \(e+1\) in the deletion distance \cite{arxiv:math/0207197}.
    Similar distances, collectively called \textit{editing distances}, can be defined for insertions and related operations \cite[Sec. 22.7]{preset:HKSmetrics}.
    Two edits are any combination of at most two insertions, deletions, and substitutions.
    A binary code corrects two edits if and only if it separately corrects two deletions, up to two substitutions, and one deletion with up to one substitution \cite[Thm. 1]{arxiv:2403.11766}.
    For fixed \(n\), \(t\), and \(b\) with \((t+1)b<n\), the largest \(q\)-ary length-\(n\) code correcting \(t\) bursts of \(b\) deletions has size \hyperref[topic:asymptotics]{asymptotically} equal to \(q^{n-tb}/\binom{n-tb+t}{t}\) as \(q\to\infty\) \cite[Thm. 7]{arxiv:2606.01245}.


features:
  rate: |
    An asymptotically good linear code against bit-flip errors can be converted into an asymptotically good code against insertion-deletion errors \cite{arxiv:2007.09075}.
    Binary two-edit-correcting codes can be constructed with \(6\log n+O(\log\log n)\) redundant bits (using \hyperref[topic:asymptotics]{asymptotic notation}) \cite[Thm. 5]{arxiv:2403.11766}.

  decoders:
    - 'List-recovery-based decoder: any \((\rho,2\rho n+1,L)\)-list-recoverable code with an efficient list-recovery algorithm can be efficiently list decoded from \(\rho n\) insertions and deletions with list size \(L\) \cite[Thm. 2.1]{arxiv:2505.02452}.'

# features:
#   rate: 'For binary codes, the optimal achievable rate to protect against a \(\delta\) fraction of insertions and deletions is \(1- O(\delta \log\frac{1}{\delta})\).'
# In the large alphabet setting, there exists a code which corrects a \(\delta\) fraction of insertions and deletions and has a rate of \((1-\Omega)^5\).'

notes:
  - 'See Refs. \cite{arxiv:1906.07887,doi:10.1109/TIT.2021.3056317}\cite[Sec. 22.7]{preset:HKSmetrics} for more details.'


# Codewords are q-ary strings, so q-ary parent
relations:
  parents:
    - code_id: block
    - code_id: ecc_finite
  cousins:
    - code_id: permutation_invariant
      detail: 'PI codes of distance \(d\) can protect against \(d-1\) (quantum) deletion errors.'
    - code_id: combinatorial_design
      detail: 'Perfect deletion correcting codes can be constructed using combinatorial design theory \cite{doi:10.1007/BF01390767,doi:10.1023/A:1008212622423}.'
    - code_id: perfect
      detail: 'Perfect deletion correcting codes can be constructed using combinatorial design theory \cite{doi:10.1007/BF01390767,doi:10.1023/A:1008212622423}.'


