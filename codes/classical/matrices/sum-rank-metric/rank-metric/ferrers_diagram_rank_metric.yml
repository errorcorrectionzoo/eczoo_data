code_id: ferrers_diagram_rank_metric
physical: matrices
logical: matrices

name: 'Ferrers diagram rank-metric (FDRM) code'
short_name: 'FDRM'
introduced: '\cite{arxiv:0807.4846}'

alternative_names:
  - 'Ferrers diagram code'

description: |
  Linear rank-metric code whose codeword matrices vanish outside a fixed \textit{Ferrers diagram} \(\mathcal{F}\) \cite{arxiv:0807.4846}.
  The diagram is an \(m\times n\) array of right-justified dots with non-increasing row lengths, i.e., the free entries of a reduced row echelon form with fixed pivots.
  Lifting an FDRM code thus yields subspaces with a common pivot pattern, the building blocks of the multilevel construction of \hyperref[code:finite_grassmann]{constant-dimension codes} \cite{arxiv:0807.4846}.

  An FDRM code on \(\mathcal{F}\) with dimension \(k\) and minimum rank distance \(\delta\) is denoted \([\mathcal{F},k,\delta]_q\), and the diagram is written \([\gamma_0,\ldots,\gamma_{n-1}]\) by its column lengths.
  Optimal codes are typically subcodes of a systematic MRD code with generator matrix \((I_k|A)\) over \(\mathbb{F}_{q^m}\).
  The \(i\)th information symbol is restricted to the span of the first \(\gamma_i\) elements of an \(\mathbb{F}_q\)-basis.
  This confines the \(i\)th column of the expanded codeword matrix to its first \(\gamma_i\) rows, while the subcode inherits the minimum rank distance of the MRD code \cite{doi:10.1109/TIT.2016.2522971,arxiv:1804.00624,doi:10.1007/s10623-023-01284-8}.

  Generator matrices with non-systematic entries \(a_{i,j}\beta^{j-i}\) are MRD for \(m\geq kn-k^2\) when \(\beta\) generates a polynomial basis and all minors of \((a_{i,j})\) over \(\mathbb{F}_q\) are nonzero \cite[Lemma 15]{arxiv:2609.24239}.
  Their subcodes include optimal \([\mathcal{F},2\gamma_0,n-1]_q\) codes for \(\mathcal{F}=[\gamma_0,\gamma_0,\gamma_0+1,\ldots,\gamma_0+n-2]\), \(\gamma_0\geq 3\), and \(n\leq q+1\) \cite[Thm. 1]{arxiv:2609.24239}\cite[Exam. 3]{arxiv:2609.24239}.
  A second construction appends a column to the generator matrix of an MRD code of distance \(\delta-1\) \cite[Thm. 2]{arxiv:2609.24239}.
  Copying the expansion of the first information symbol into the last column of the codeword matrix then restores distance \(\delta\).
  Appending \(r\) columns and copying the first \(r\) information symbols in a staggered pattern extends this to diagrams whose rightmost \(\delta-2\) columns have only \(n-r\) dots each, with \(r<n-\delta+1\) \cite[Thm. 3]{arxiv:2609.24239}.
  Larger optimal codes are assembled from optimal codes on disjoint subdiagrams via block and \textit{proper-combination} constructions \cite{doi:10.1109/TIT.2016.2522971,arxiv:1804.01211}\cite[Secs. 4 and 5]{arxiv:2609.24239}.

protection: |
  The dimension of an \([\mathcal{F},k,\delta]_q\) code satisfies \(k \leq \min_{0\leq i\leq \delta-1} v_i\), where \(v_i\) is the number of dots of \(\mathcal{F}\) outside its first \(i\) rows and its rightmost \(\delta-1-i\) columns \cite{arxiv:0807.4846}.
  Codes attaining this bound are called \textit{optimal}, and the \textit{Etzion-Silberstein conjecture} states that the bound is attained for every diagram, distance, and field size \cite{arxiv:0807.4846}.
  The conjecture holds for initially convex diagrams, i.e., those with \(\gamma_0\leq 1\) and \(\gamma_{i+1}-\gamma_i\leq 1\) \cite{arxiv:2306.16407}.
  It also holds when each of the rightmost \(\delta-1\) columns contains at least \(n\) dots \cite{doi:10.1109/TIT.2016.2522971}.
  Optimal \([\mathcal{F},6,7]_q\) codes exist for \(\mathcal{F}=[1,2,3,4,8,8,8,8,8]\) and all \(q\geq 7\) \cite[Rem. 2]{arxiv:2609.24239}.
  For even \(n\), a family of square \(n\times n\) diagrams admits optimal codes of dimension \(n+1\) and distance \(n/2-1\) for every \(q\) \cite[Thm. 6]{arxiv:2609.24239}.

relations:
  parents:
    - code_id: rank_metric
      detail: 'An FDRM code is a linear rank-metric code whose codeword matrices are supported on a Ferrers diagram \cite{arxiv:0807.4846}. The full \(m\times n\) diagram recovers ordinary linear rank-metric codes.'
  cousins:
    - code_id: maximum_rank_distance
      detail: 'Optimal FDRM codes are constructed as subcodes of systematic MRD codes, with information symbols restricted so that each codeword column lies in the diagram \cite{doi:10.1109/TIT.2016.2522971,arxiv:2609.24239}.'
    - code_id: finite_grassmann
      detail: 'The multilevel construction lifts an FDRM code on the echelon-form diagram of each identifying vector of a binary \hyperref[code:constant_weight]{constant-weight code} \cite{arxiv:0807.4846}. For identifying vectors at Hamming distance \(2\delta\) and FDRM codes of rank distance \(\delta\), the union of the lifted codes has subspace distance \(2\delta\) \cite{arxiv:0807.4846}. Optimal FDRM codes combined with pending blocks give the largest known constant-dimension codes for several parameter sets \cite{arxiv:1404.6723,arxiv:2609.24239}.'


