code_id: maximum_sum_rank_distance
physical: matrices
logical: matrices

name: 'Maximum-sum-rank distance (MSRD) code'
short_name: 'MSRD'
introduced: '\cite{arxiv:1710.03109}'

alternative_names:
  - 'Optimal sum-rank-distance code'

description: |
  A sum-rank-metric code whose parameters satisfy the sum-rank-metric Singleton bound with equality.
  
  An \([n\times m,k,d]_q\) code is MSRD if its parameters are such that the sum-rank-metric Singleton bound \cite[Prop. 34]{arxiv:1710.03109},
  \begin{align}
  d_{\text{SR}}(C) \leq n - k + 1~,
  \end{align}
  becomes an equality, where \(d_{\text{SR}}\) is the sum-rank metric.

  Additive MSRD codes arise from the rank-\(r\) Drinfeld module \(\phi_T=\tau^r\) over \(\mathbb{F}_{q^r}\) in characteristic \((T)\) \cite[Sec. 3.5]{arxiv:2609.01484}.
  Each codeword restricts one endomorphism of \(\tau\)-degree at most \(tm-1\) to the torsion modules \(\phi[\mathfrak{q}_i]\cong\mathbb{F}_{q^m}^r\) of \(\ell\) distinct degree-\(m\) monic irreducible polynomials \(\mathfrak{q}_i\neq T\), one \(r\times r\) block per polynomial.
  The resulting code has \(d_{\text{SR}}=\ell r-t+1\) \cite[Thm. 3.9]{arxiv:2609.01484}.


