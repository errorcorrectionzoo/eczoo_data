code_id: arithmetic_residue
physical: rings
logical: rings

name: 'Arithmetic residue code'

alternative_names:
  - 'Separate residue code'

description: |
  Checksum code that appends to an integer its residue modulo a check base \(m\), so that residues of operands predict the residue of their sum or product \cite{manual:{R. S. Lim, “Concurrent error-detecting codes for arithmetic processors”, NASA Technical Paper 1528 (1979) \href{https://ntrs.nasa.gov/citations/19790022776}{URL}},doi:10.1147/rd.22.0166}.
  For the \textit{low-cost} check bases \(m=2^a-1\), the residue of a binary integer is the end-around-carry sum of its \(a\)-bit bytes \cite{manual:{R. S. Lim, “Concurrent error-detecting codes for arithmetic processors”, NASA Technical Paper 1528 (1979) \href{https://ntrs.nasa.gov/citations/19790022776}{URL}},doi:10.1109/T-C.1971.223134}.

protection: |
  Errors that change a result by a multiple of \(m\) go undetected \cite[Sec. III]{manual:{A. Avizienis, “A study of the effectiveness of fault-detecting codes for binary arithmetic”, Jet Propulsion Laboratory Technical Report 32-711 (1965) \href{https://ntrs.nasa.gov/citations/19650024278}{URL}}}.
  A check base that is coprime to the radix and larger than it detects every single-digit error \cite[Sec. III]{manual:{A. Avizienis, “A study of the effectiveness of fault-detecting codes for binary arithmetic”, Jet Propulsion Laboratory Technical Report 32-711 (1965) \href{https://ntrs.nasa.gov/citations/19650024278}{URL}}}.
  Low-cost check bases \(m=2^a-1\) also detect every burst confined to fewer than \(a\) adjacent bits \cite[Sec. III]{manual:{A. Avizienis, “A study of the effectiveness of fault-detecting codes for binary arithmetic”, Jet Propulsion Laboratory Technical Report 32-711 (1965) \href{https://ntrs.nasa.gov/citations/19650024278}{URL}}}.
  Biresidue codes, which use two residue checkers, locate and correct any single error position \cite{doi:10.1109/T-C.1970.222937}.
  Residue checks are the only checks that let an adder be verified by a circuit independent of it \cite{doi:10.1147/rd.22.0166}.

realizations:
  - 'Computer arithmetic: the arithmetic elements of the Burroughs Scientific Processor used modulo-3 residue arithmetic to check hardware failures \cite{doi:10.1109/ARITH.1978.6155777}.'

notes:
  - 'See Refs. \cite{manual:{T. R. N. Rao, \emph{Error Coding for Arithmetic Processors} (Academic Press, 1974)},doi:10.1007/978-1-4615-9053-8_5} for reviews of arithmetic codes.'


relations:
  parents:
    - code_id: q-ary_over_zq
      detail: 'Arithmetic residue codewords are strings of radix-\(q\) digits, labeled by elements of \(\mathbb{Z}_q\), whose last digits store a residue modulo the check base.'
    - code_id: checksum
      detail: 'The checksum of an arithmetic residue code is the residue of an integer modulo a check base.'


